<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>مدیریت | Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Tahoma,Arial,sans-serif;
color:white;

background:
radial-gradient(circle at 20% 20%,#30206b,transparent 35%),
radial-gradient(circle at 80% 70%,#35105e,transparent 35%),
linear-gradient(135deg,#050716,#17104a);

padding:20px;
}

.container{
width:100%;
max-width:800px;
margin:auto;
}

h1{
text-align:center;
margin:10px 0 25px;
}

.top{
display:flex;
gap:10px;
margin-bottom:20px;
}

.top button{
flex:1;
padding:14px;
border:0;
border-radius:15px;
background:#7650ff;
color:white;
font-weight:bold;
font-size:15px;
}

.posts{
display:flex;
flex-direction:column;
gap:18px;
}

.post{

background:#ffffff12;

border:1px solid #ffffff18;

border-radius:22px;

padding:18px;

backdrop-filter:blur(12px);

box-shadow:
0 10px 40px #0005;

}

.title{

font-size:20px;

font-weight:bold;

margin-bottom:10px;

}

.content{

color:#ddd;

line-height:1.9;

white-space:pre-wrap;

}

.post img{

display:block;

width:100%;

max-height:350px;

object-fit:cover;

border-radius:17px;

margin-top:14px;

}

video{

display:block;

width:100%;

max-height:400px;

margin-top:14px;

border-radius:17px;

background:#000;

}

audio{

width:100%;

margin-top:14px;

}

.media{

margin-top:12px;

font-size:13px;

color:#cfc5ff;

}

.date{

margin-top:12px;

font-size:12px;

color:#aaa;

}

.delete{

width:100%;

margin-top:16px;

padding:14px;

border:0;

border-radius:15px;

background:#d9365b;

color:white;

font-size:15px;

font-weight:bold;

}

.delete:active{

transform:scale(.97);

}

.loading{

text-align:center;

padding:40px;

color:#ccc;

}

.empty{

text-align:center;

padding:40px;

background:#ffffff0d;

border-radius:20px;

color:#bbb;

}

.error{

text-align:center;

padding:25px;

background:#ff000018;

border-radius:20px;

color:#ffb0b0;

line-height:2;

}

</style>

</head>


<body>

<div class="container">

<h1>☆ مدیریت پست‌ها ☆</h1>


<div class="top">

<button onclick="loadPosts()">
🔄 بروزرسانی
</button>

<button onclick="location.href='publish.html'">
➕ پست جدید
</button>

</div>


<div id="posts" class="posts">

<div class="loading">
در حال دریافت پست‌ها... ⏳
</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   دریافت پست‌ها
========================= */

async function loadPosts(){

const box =
document.getElementById("posts");


box.innerHTML =
`
<div class="loading">
در حال دریافت پست‌ها... ⏳
</div>
`;


const {data,error} =
await db
.from("posts")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

box.innerHTML =
`
<div class="error">
❌ خطا در دریافت پست‌ها
<br>
${escapeHtml(error.message)}
</div>
`;

return;

}


if(!data || data.length===0){

box.innerHTML =
`
<div class="empty">
هنوز هیچ پستی نداری 🌙
</div>
`;

return;

}


box.innerHTML="";


data.forEach(post=>{

const div =
document.createElement("div");

div.className="post";


/* عنوان */

if(post.title){

const title =
document.createElement("div");

title.className="title";

title.innerText =
post.title;

div.appendChild(title);

}


/* متن */

if(post.content){

const content =
document.createElement("div");

content.className="content";

content.innerText =
post.content;

div.appendChild(content);

}


/* عکس */

if(post.image_url){

const img =
document.createElement("img");

img.src =
post.image_url;

img.alt =
post.title || "تصویر پست";

img.loading="lazy";

div.appendChild(img);

}


/* ویدیو */

if(post.video_url){

const video =
document.createElement("video");

video.src =
post.video_url;

video.controls=true;

video.playsInline=true;

div.appendChild(video);

}


/* صدا */

if(post.audio_url){

const audio =
document.createElement("audio");

audio.src =
post.audio_url;

audio.controls=true;

div.appendChild(audio);

}


/* نوع محتوا */

let types=[];

if(post.image_url)
types.push("🖼️ عکس");

if(post.video_url)
types.push("🎬 ویدیو");

if(post.audio_url)
types.push("🎵 صدا");


if(types.length){

const media =
document.createElement("div");

media.className="media";

media.innerText =
types.join("  •  ");

div.appendChild(media);

}


/* تاریخ */

if(post.created_at){

const date =
document.createElement("div");

date.className="date";

date.innerText =
"تاریخ: "+
new Date(
post.created_at
).toLocaleString("fa-IR");

div.appendChild(date);

}


/* دکمه حذف */

const deleteButton =
document.createElement("button");

deleteButton.className="delete";

deleteButton.innerText =
"🗑️ حذف این پست";


deleteButton.onclick =
function(){

deletePost(post.id);

};


div.appendChild(deleteButton);


box.appendChild(div);

});

}


/* =========================
   حذف پست
========================= */

async function deletePost(id){

const answer =
confirm(
"مطمئنی می‌خوای این پست حذف بشه؟\n\nاین کار قابل برگشت نیست."
);


if(!answer)
return;


const {error} =
await db
.from("posts")
.delete()
.eq("id",id);


if(error){

alert(
"❌ پست حذف نشد:\n\n"+
error.message
);

return;

}


alert(
"پست با موفقیت حذف شد ✅"
);


await loadPosts();

}


/* =========================
   جلوگیری از نمایش HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.innerText=text;

return div.innerHTML;

}


/* =========================
   شروع
========================= */

loadPosts();

</script>

</body>

</html>
