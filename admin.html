<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}
input,textarea,button{
width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:0;
}
button{
background:#765cff;
color:white;
}
</style>
</head>

<body>

<h2>☆ Minuit côtier ☆</h2>

<input id="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز">

<button onclick="login()">ورود</button>

<hr>

<input id="title" placeholder="عنوان پست">
<textarea id="content" placeholder="متن پست"></textarea>

<button onclick="post()">انتشار پست ☆</button>

<p id="out">آماده</p>


<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function login(){

let {error}=await db.auth.signInWithPassword({

email:
document.getElementById("email").value,

password:
document.getElementById("password").value

});


out.innerText =
error ? error.message : "وارد شدی ✅";

}



async function post(){

const {data} =
await db.auth.getSession();


if(!data.session){

out.innerText="اول وارد شو ❌";
return;

}


const {error}=await db
.from("posts")
.insert({

title:
document.getElementById("title").value,

content:
document.getElementById("content").value,

image_url:null

});


out.innerText =
error ? error.message : "پست منتشر شد ✅";

}

</script>

</body>
</html>
