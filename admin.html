<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل مدیریت | Minuit côtier</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:white;
min-height:100vh;
background:linear-gradient(135deg,#08091f,#17144b,#32236b);
padding:20px;
overflow-x:hidden;
}

.star{
position:fixed;
color:white;
opacity:.8;
pointer-events:none;
animation:fall linear infinite;
}

@keyframes fall{
from{transform:translateY(-10vh)}
to{transform:translateY(110vh)}
}

.container{
position:relative;
z-index:2;
max-width:650px;
margin:auto;
}

h1{text-align:center}

.box{
background:rgba(10,10,35,.8);
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:13px;
margin:8px 0;
border:0;
border-radius:12px;
font-size:15px;
}

textarea{
height:130px;
resize:vertical;
}

button{
width:100%;
padding:13px;
margin-top:10px;
border:0;
border-radius:12px;
background:#7567d9;
color:white;
font-size:16px;
font-weight:bold;
}

#error,#loginError{color:#ff8995;margin-top:10px}
#success{color:#8fffb0;margin-top:10px}

.post{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-top:15px;
}

.post img{
width:100%;
border-radius:12px;
margin-top:10px;
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container">

<h1>☆ Minuit côtier ☆</h1>

<div class="box" id="loginBox">

<h2>ورود به پنل مدیریت</h2>

<input id="email" type="email" placeholder="ایمیل">

<input id="password" type="password" placeholder="رمز عبور">

<button onclick="login()">ورود</button>

<div id="loginError"></div>

</div>


<div id="adminPanel" style="display:none">

<div class="box">

<h2>انتشار پست ☆</h2>

<input id="title" placeholder="عنوان پست">

<textarea id="content" placeholder="متن پست"></textarea>

<input id="image_url" placeholder="لینک عکس">

<button onclick="publishPost()">انتشار پست ☆</button>

<div id="error"></div>
<div id="success"></div>

</div>


<div class="box">

<h2>پست‌های منتشرشده</h2>

<div id="posts">در حال بارگذاری...</div>

<button onclick="logout()">خروج از پنل</button>

</div>

</div>

</div>


<script>

/* آدرس پروژه */
const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


/*
================================================
اینجا کلید Publishable خودت را قرار بده
================================================
*/

const SUPABASE_KEY =
"sb_publishable_dU9-NzHm2dS8c20VqCAtrw_hph0-hb7";


/* ستاره‌ها */
for(let i=0;i<80;i++){

const star=document.createElement("div");

star.className="star";
star.textContent="☆";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*-100+"vh";
star.style.fontSize=(5+Math.random()*8)+"px";
star.style.animationDuration=(5+Math.random()*10)+"s";
star.style.animationDelay=Math.random()*8+"s";

document.getElementById("stars").appendChild(star);

}


/* ورود */
async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const error=document.getElementById("loginError");

error.textContent="";

const response=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
}
);

const data=await response.json();

if(!response.ok){

error.textContent=
data.error_description ||
data.msg ||
"ورود ناموفق بود.";

return;
}

localStorage.setItem(
"access_token",
data.access_token
);

localStorage.setItem(
"refresh_token",
data.refresh_token
);

document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

loadPosts();

}


/* انتشار پست */
async function publishPost(){

const token=localStorage.getItem("access_token");

const title=document.getElementById("title").value.trim();

const content=document.getElementById("content").value.trim();

const image_url=document.getElementById("image_url").value.trim();

const error=document.getElementById("error");

const success=document.getElementById("success");

error.textContent="";
success.textContent="";

const response=await fetch(
SUPABASE_URL+"/rest/v1/posts",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token,
"Content-Type":"application/json",
"Prefer":"return=representation"
},

body:JSON.stringify({

title:title,
content:content,
image_url:image_url

})

});

const data=await response.json();

if(!response.ok){

error.textContent=
data.message ||
data.hint ||
data.details ||
"خطا در انتشار پست";

return;
}

success.textContent="پست با موفقیت منتشر شد ☆";

document.getElementById("title").value="";
document.getElementById("content").value="";
document.getElementById("image_url").value="";

loadPosts();

}


/* نمایش پست‌ها */
async function loadPosts(){

const token=localStorage.getItem("access_token");

const response=await fetch(
SUPABASE_URL+
"/rest/v1/posts?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token
}
}
);

const posts=await response.json();

const box=document.getElementById("posts");

if(!Array.isArray(posts)||posts.length===0){

box.innerHTML="هنوز پستی منتشر نشده.";

return;
}

box.innerHTML="";

posts.forEach(post=>{

const div=document.createElement("div");

div.className="post";

div.innerHTML=`

<h3>${post.title || ""}</h3>

<p>${post.content || ""}</p>

${
post.image_url
?
`<img src="${post.image_url}">`
:
""
}

`;

box.appendChild(div);

});

}


/* خروج */
function logout(){

localStorage.removeItem("access_token");
localStorage.removeItem("refresh_token");

location.reload();

}


/* ورود خودکار */
if(localStorage.getItem("access_token")){

document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

loadPosts();

}

</script>

</body>
</html>
