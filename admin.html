<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Minuit côtier</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#08091f,#17144b,#32236b);
  overflow-x:hidden;
}

.star{
  position:fixed;
  color:white;
  opacity:.7;
  pointer-events:none;
  animation:fall linear infinite;
}

@keyframes fall{
  from{
    transform:translateY(-30px) rotate(0deg);
  }
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

.container{
  width:92%;
  max-width:600px;
  margin:40px auto;
  position:relative;
  z-index:2;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.box{
  background:rgba(10,10,40,.75);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

input,
textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  background:#151536;
  color:white;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#7567ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.logout{
  background:#a33b67;
}

.post{
  background:rgba(255,255,255,.08);
  padding:15px;
  border-radius:15px;
  margin-top:12px;
}

.post img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

.hidden{
  display:none;
}

#message{
  text-align:center;
  margin:15px 0;
  color:#ffd6f5;
  word-break:break-word;
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container">

<h1>☆ Minuit côtier ☆</h1>

<div id="loginBox" class="box">

<h2>ورود مدیر</h2>

<input
  id="email"
  type="email"
  placeholder="ایمیل"
/>

<input
  id="password"
  type="password"
  placeholder="رمز عبور"
/>

<button onclick="login()">ورود</button>

</div>


<div id="adminBox" class="hidden">

<div class="box">

<h2>انتشار پست</h2>

<input
  id="title"
  type="text"
  placeholder="عنوان پست"
/>

<textarea
  id="content"
  placeholder="متن پست"
></textarea>

<input
  id="image_url"
  type="text"
  placeholder="لینک عکس (اختیاری)"
>

<button onclick="addPost()">
انتشار پست ☆
</button>

</div>


<div class="box">

<h2>پست‌های منتشرشده</h2>

<div id="posts">
در حال بارگذاری...
</div>

<button class="logout" onclick="logout()">
خروج از پنل
</button>

</div>

</div>

<div id="message"></div>

</div>


<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dU9-NzHm2dS8c20VqCAtrw_hph0-hb7";


/* ستاره‌های ریز */

function createStars(){

  for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";

    star.innerText="☆";

    star.style.left=
      Math.random()*100+"%";

    star.style.animationDuration=
      (5+Math.random()*10)+"s";

    star.style.animationDelay=
      (-Math.random()*10)+"s";

    star.style.fontSize=
      (5+Math.random()*8)+"px";

    document.getElementById("stars")
      .appendChild(star);
  }
}

createStars();


function showMessage(text){

  document.getElementById("message")
    .innerText=text;

}


/* ورود */

async function login(){

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  if(!email || !password){

    showMessage(
      "ایمیل و رمز عبور را وارد کن."
    );

    return;
  }

  showMessage("در حال ورود...");

  try{

    const response=await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const data=await response.json();

    if(!response.ok){

      showMessage(
        data.error_description ||
        data.msg ||
        "ورود ناموفق بود."
      );

      return;
    }

    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "refresh_token",
      data.refresh_token
    );

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminBox")
      .classList.remove("hidden");

    showMessage(
      "با موفقیت وارد شدی ❤️"
    );

    loadPosts();

  }catch(error){

    showMessage(
      "خطا در اتصال به سرور."
    );

  }

}


/* انتشار پست */

async function addPost(){

  const title =
    document.getElementById("title")
    .value.trim();

  const content =
    document.getElementById("content")
    .value.trim();

  const image_url =
    document.getElementById("image_url")
    .value.trim();

  const token =
    localStorage.getItem("access_token");


  if(!token){

    showMessage(
      "اول وارد پنل شو."
    );

    return;
  }


  if(!title && !content){

    showMessage(
      "عنوان یا متن پست را وارد کن."
    );

    return;
  }


  showMessage(
    "در حال انتشار..."
  );


  try{

    const response=await fetch(
      SUPABASE_URL +
      "/rest/v1/posts",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+token,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=representation"
        },

        body:JSON.stringify({

          Title:title,

          content:content,

          image_url:image_url

        })
      }
    );


    const data=await response.json();


    if(!response.ok){

      showMessage(
        data.message ||
        data.error ||
        data.hint ||
        "پست منتشر نشد."
      );

      return;
    }


    document.getElementById("title")
      .value="";

    document.getElementById("content")
      .value="";

    document.getElementById("image_url")
      .value="";


    showMessage(
      "پست با موفقیت منتشر شد ❤️"
    );

    loadPosts();


  }catch(error){

    showMessage(
      "خطا در اتصال به دیتابیس."
    );

  }

}


/* نمایش پست‌ها */

async function loadPosts(){

  const postsBox =
    document.getElementById("posts");

  try{

    const response=await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?select=*&order=created_at.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY
        }
      }
    );


    const data=await response.json();


    if(!response.ok){

      postsBox.innerText=
        data.message ||
        "خطا در دریافت پست‌ها.";

      return;
    }


    if(!data.length){

      postsBox.innerText=
        "هنوز پستی منتشر نشده.";

      return;
    }


    postsBox.innerHTML="";


    data.forEach(post=>{

      const div=
        document.createElement("div");

      div.className="post";


      const title=
        post.Title || "";

      const content=
        post.content || "";


      div.innerHTML=`

        <h3>
          ${escapeHtml(title)}
        </h3>

        <p>
          ${escapeHtml(content)}
        </p>

        ${
          post.image_url
          ?
          `<img src="${post.image_url}">`
          :
          ""
        }

      `;


      postsBox.appendChild(div);

    });


  }catch(error){

    postsBox.innerText=
      "خطا در اتصال به دیتابیس.";

  }

}


/* جلوگیری از اجرای HTML داخل پست */

function escapeHtml(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}


/* خروج */

function logout(){

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  location.reload();

}


/* بررسی ورود قبلی */

if(
  localStorage.getItem("access_token")
){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("adminBox")
    .classList.remove("hidden");

  loadPosts();

}

</script>

</body>
</html>
