<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minuit côtier - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  padding:30px;
  background:linear-gradient(135deg,#08091f,#17144b,#32236b);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
.box{
  max-width:500px;
  margin:auto;
  background:#111333;
  padding:25px;
  border-radius:20px;
}
input,textarea,button{
  width:100%;
  box-sizing:border-box;
  margin:8px 0;
  padding:14px;
  border-radius:12px;
  border:0;
}
button{
  background:#7c5cff;
  color:white;
  font-weight:bold;
}
#status{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#22254d;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="box">

<h1>☆ Minuit côtier ☆</h1>
<h2>پنل مدیریت</h2>

<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور">

<button onclick="login()">ورود</button>

<hr>

<input id="title" placeholder="عنوان پست">
<textarea id="content" placeholder="متن پست"></textarea>

<button onclick="publish()">انتشار پست</button>

<div id="status">هنوز تست نشده</div>

</div>

<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dU9-NzHm2dS8c20VqCAtrw_hph0-hb7";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    document.getElementById("status").innerText =
      "خطای ورود:\n" + error.message;
    return;
  }

  document.getElementById("status").innerText =
    "ورود موفق شد ✅\n\nحالا روی انتشار پست بزن.";

}

async function publish(){

  document.getElementById("status").innerText =
    "در حال بررسی حساب...";

  const {
    data:{session},
    error:sessionError
  } = await db.auth.getSession();

  if(sessionError){
    document.getElementById("status").innerText =
      "خطای Session:\n" + sessionError.message;
    return;
  }

  if(!session){
    document.getElementById("status").innerText =
      "هیچ Session فعالی پیدا نشد ❌\n\nاول وارد شو.";
    return;
  }

  const {
    data:{user},
    error:userError
  } = await db.auth.getUser();

  if(userError || !user){
    document.getElementById("status").innerText =
      "کاربر احراز هویت نشده ❌\n\n" +
      (userError?.message || "");
    return;
  }

  document.getElementById("status").innerText =
    "کاربر شناسایی شد ✅\n" +
    "Email: " + (user.email || "نامشخص") +
    "\n\nحالا ارسال پست...";

  const title =
    document.getElementById("title").value;

  const content =
    document.getElementById("content").value;

  const {data,error} =
    await db
      .from("posts")
      .insert({
        title:title,
        content:content,
        image_url:null
      })
      .select();

  if(error){
    document.getElementById("status").innerText =
      "خطای انتشار:\n" + error.message;
    return;
  }

  document.getElementById("status").innerText =
    "پست با موفقیت منتشر شد ✅❤️";

}

</script>

</body>
</html>
