<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Tahoma;
color:white;
background:
radial-gradient(circle at top,#30206b,transparent 40%),
linear-gradient(135deg,#050716,#17104a);
}

.container{
width:90%;
max-width:600px;
margin:auto;
padding:30px 0;
}

.card{
background:rgba(255,255,255,.1);
border-radius:22px;
padding:20px;
margin-bottom:20px;
backdrop-filter:blur(10px);
}

h1,h2{
text-align:center;
}

input,button{
width:100%;
padding:13px;
margin-top:10px;
border-radius:14px;
border:0;
}

input{
background:#ffffff18;
color:white;
}

button,.link{
display:block;
width:100%;
padding:14px;
margin-top:12px;
border-radius:14px;
background:#7650ff;
color:white;
border:0;
text-align:center;
text-decoration:none;
font-weight:bold;
}

.message{
text-align:center;
margin-top:10px;
}
</style>

</head>

<body>

<div class="container">


<div class="card">

<h1>☆ Minuit côtier ☆</h1>
<h2>🔐 ورود مدیر</h2>


<div id="login">

<input id="email" placeholder="ایمیل">

<input id="password" type="password" placeholder="رمز عبور">


<button onclick="login()">
ورود
</button>


<div id="msg" class="message"></div>

</div>



<div id="panel" style="display:none">

<h2>پنل مدیریت</h2>


<a class="link" href="settings.html">
⚙️ تنظیمات سایت
</a>


<a class="link" href="publish.html">
📝 انتشار پست
</a>


<a class="link" href="posts.html">
📚 مدیریت پست‌ها
</a>


<button onclick="logout()">
🚪 خروج
</button>


</div>


</div>


</div>


<script>


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


const {error} =
await db.auth.signInWithPassword({

email,
password

});


if(error){

document.getElementById("msg")
.innerText =
"خطا: "+error.message;

return;

}


showPanel();

}



function showPanel(){

document.getElementById("login")
.style.display="none";


document.getElementById("panel")
.style.display="block";

}



async function check(){

const {data}=

await db.auth.getSession();


if(data.session){

showPanel();

}

}



async function logout(){

await db.auth.signOut();

location.reload();

}


check();


</script>


</body>
</html>
