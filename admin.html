<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Session</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
  padding:30px;
}
input,button{
  width:90%;
  padding:12px;
  margin:8px;
  border-radius:10px;
  border:0;
}
button{
  background:#765cff;
  color:white;
}
#out{
  margin-top:20px;
  background:#222;
  padding:15px;
  border-radius:10px;
  word-break:break-word;
}
</style>

</head>

<body>

<h2>☆ Minuit côtier ☆</h2>

<input id="email" placeholder="ایمیل">

<input id="password" type="password" placeholder="رمز">

<button onclick="login()">ورود</button>

<button onclick="check()">بررسی Session</button>

<div id="out">
آماده
</div>


<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


const {data,error} =
await db.auth.signInWithPassword({
email,
password
});


if(error){

document.getElementById("out").innerText =
"خطای ورود:\n" + error.message;

return;

}


document.getElementById("out").innerText =
"ورود موفق شد ✅";

}



async function check(){

const {data,error} =
await db.auth.getSession();


if(error){

document.getElementById("out").innerText =
error.message;

return;

}


if(!data.session){

document.getElementById("out").innerText =
"Session وجود ندارد ❌";

return;

}


document.getElementById("out").innerText =
"Session دارد ✅\n\n" +
"User ID:\n" +
data.session.user.id +
"\n\nEmail:\n" +
data.session.user.email;


}

</script>


</body>
</html>
