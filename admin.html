<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پنل مدیریت Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:tahoma;
background:
linear-gradient(135deg,#080820,#30205f);
color:white;
}

.box{

width:90%;
max-width:600px;
margin:30px auto;
background:#ffffff15;
padding:20px;
border-radius:25px;

}

input,textarea,button{

width:100%;
margin-top:12px;
padding:14px;
border:0;
border-radius:15px;

}


input,textarea{

background:#ffffff20;
color:white;

}


textarea{
height:100px;
}


button{

background:#8265ff;
color:white;
font-weight:bold;

}


.post{

margin-top:20px;
background:#ffffff15;
padding:15px;
border-radius:20px;

}


.post img{

width:100%;
border-radius:15px;

}


.delete{

background:#ff3b5c;

}


</style>

</head>


<body>


<div class="box">


<h2>
⚙️ پنل مدیریت
</h2>


<input id="title"
placeholder="عنوان پست">


<textarea id="content"
placeholder="متن پست"></textarea>


<input id="image_url"
placeholder="لینک عکس">


<input id="video_url"
placeholder="لینک فیلم">


<button onclick="addPost()">

💫 انتشار پست

</button>


<hr>


<h3>
پست‌های من
</h3>


<div id="list"></div>


</div>



<script>


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





async function addPost(){


const {error}=

await db
.from("posts")
.insert({

title:
document.getElementById("title").value,

content:
document.getElementById("content").value,

image_url:
document.getElementById("image_url").value,

video_url:
document.getElementById("video_url").value

});



if(error){

alert(error.message);

return;

}


alert("💫 پست اضافه شد");


loadPosts();


}






async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



let html="";



data.forEach(p=>{


html+=`

<div class="post">


<h3>
${p.title || "بدون عنوان"}
</h3>


<p>
${p.content || ""}
</p>


${p.image_url ?
`<img src="${p.image_url}">`
:""}



<button class="delete"
onclick="deletePost('${p.id}')">

🗑 حذف پست

</button>


</div>

`;

});


document.getElementById("list")
.innerHTML=html;


}







async function deletePost(id){


let confirmDelete =
confirm(
"این پست حذف شود؟"
);



if(!confirmDelete)
return;



const {error}=

await db
.from("posts")
.delete()
.eq(
"id",
id
);



if(error){

alert(error.message);

}else{

alert("حذف شد 🗑️");

loadPosts();

}


}



loadPosts();


</script>


</body>

</html>
