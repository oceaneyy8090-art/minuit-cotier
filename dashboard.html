<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓 | پنل مدیریت</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:tahoma,Arial,sans-serif;
  color:#fff;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 15% 15%,rgba(96,75,255,.35),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,205,255,.20),transparent 30%),
    linear-gradient(135deg,#03030d,#09082a,#17104a);
}


/* ستاره‌ها */

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.star{
  position:absolute;
  color:white;
  font-size:8px;
  opacity:.8;

  animation:float linear infinite;

  text-shadow:
    0 0 5px currentColor,
    0 0 10px currentColor;
}

@keyframes float{

  0%{
    transform:translateY(110vh) translateX(0) scale(.5);
    opacity:0;
  }

  15%{
    opacity:.9;
  }

  85%{
    opacity:.9;
  }

  100%{
    transform:translateY(-10vh) translateX(30px) scale(1);
    opacity:0;
  }

}


/* صفحه */

.page{
  position:relative;
  z-index:1;

  width:100%;
  max-width:700px;

  margin:auto;

  padding:22px 16px 40px;
}


/* هدر */

.header{
  text-align:center;

  padding:25px 10px 18px;
}

.logo{
  font-size:28px;
  font-weight:bold;

  text-shadow:
    0 0 10px #8c7cff,
    0 0 25px #604cff;
}

.subtitle{
  margin-top:8px;

  color:#bbb7df;

  font-size:13px;
}


/* خوش آمد */

.welcome{

  padding:22px;

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.045)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 15px 45px rgba(0,0,0,.3),
    inset 0 1px rgba(255,255,255,.08);
}

.welcome h2{
  margin:0 0 8px;

  font-size:20px;
}

.welcome p{
  margin:0;

  color:#bdb9d8;

  font-size:13px;
}


/* منو */

.menu{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  margin-top:18px;
}


/* کارت */

.menu-card{

  position:relative;

  min-height:145px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-decoration:none;

  color:white;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.045)
    );

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 12px 35px rgba(0,0,0,.28);

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;

  overflow:hidden;
}


.menu-card::before{

  content:"";

  position:absolute;

  width:90px;
  height:90px;

  border-radius:50%;

  background:rgba(125,95,255,.16);

  filter:blur(20px);
}


.menu-card:hover{

  transform:translateY(-4px);

  border-color:rgba(160,145,255,.55);

  box-shadow:
    0 15px 45px rgba(92,72,255,.22);
}


/* آیکون */

.icon{

  position:relative;

  font-size:36px;

  margin-bottom:12px;
}


/* عنوان */

.title{

  position:relative;

  font-size:16px;

  font-weight:bold;
}


/* توضیح */

.desc{

  position:relative;

  margin-top:6px;

  color:#aaa6c7;

  font-size:11px;
}


/* رنگ آیکون‌ها */

.profile .icon{
  text-shadow:0 0 18px #ff6fcf;
}

.settings .icon{
  text-shadow:0 0 18px #8e7cff;
}

.posts .icon{
  text-shadow:0 0 18px #5ecbff;
}

.dashboard .icon{
  text-shadow:0 0 18px #a77cff;
}

.website .icon{
  text-shadow:0 0 18px #65e6ff;
}


/* پایین */

.footer{

  text-align:center;

  margin-top:28px;

  color:#777392;

  font-size:11px;
}


@media(max-width:380px){

  .menu{
    gap:10px;
  }

  .menu-card{
    min-height:130px;
  }

  .logo{
    font-size:23px;
  }

}

</style>

</head>
