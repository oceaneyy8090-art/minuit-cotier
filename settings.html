<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تنظیمات کانال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{

margin:0;
font-family:tahoma;

background:
linear-gradient(135deg,#080820,#34205e);

color:white;

}


.box{

width:90%;
max-width:500px;

margin:25px auto;

background:#ffffff15;

padding:20px;

border-radius:25px;

}



input,textarea,button{

width:100%;

padding:14px;

margin-top:12px;

border:0;

border-radius:15px;

}



input,textarea{

background:#ffffff20;

color:white;

}


button{

background:#8265ff;

color:white;

}



img{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

display:block;

margin:auto;

box-shadow:0 0 30px #70ddff;

}

</style>

</head>


<body>


<div class="box">


<h2>
⚙️ تنظیمات کانال
</h2>


<img id="preview">



<input id="name"
placeholder="نام کانال">



<input id="image"
placeholder="لینک عکس پروفایل">



<textarea id="bio"
placeholder="بیو کانال"></textarea>



<button onclick="saveSettings()">

ذخیره تغییرات 💾

</button>



<p id="msg"></p>


</div>





<script>


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





async function loadSettings(){


const {data,error}=

await db
.from("site_settings")
.select("*")
.limit(1);



if(error){

console.log(error);

return;

}



if(!data[0])
return;



let s=data[0];


name.value =
s.site_name || "";


image.value =
s.image_url || "";


bio.value =
s.bio || "";


preview.src =
s.image_url || "";

}



image.oninput=()=>{

preview.src=image.value;

};





async function saveSettings(){



const newData={

site_name:
name.value,

image_url:
image.value,

bio:
bio.value

};



const {data}=

await db
.from("site_settings")
.select("id")
.limit(1);



let result;



if(data && data[0]){


result=
await db
.from("site_settings")
.update(newData)
.eq(
"id",
data[0].id
);



}else{


result=
await db
.from("site_settings")
.insert(newData);



}



if(result.error){

msg.innerText=
"خطا ❌";

}else{


msg.innerText=
"ذخیره شد ✅";

}


}



loadSettings();


</script>


</body>

</html>
