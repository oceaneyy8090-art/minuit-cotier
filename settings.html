<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تنظیمات کانال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:tahoma;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#3b2778,transparent 35%),
    linear-gradient(135deg,#050515,#171344,#08081d);
}

.box{
  width:92%;
  max-width:500px;
  margin:25px auto;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 40px rgba(100,80,255,.2);
}

h2{
  text-align:center;
}

.preview{
  width:130px;
  height:130px;
  display:block;
  margin:20px auto;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 0 35px #65cfff;
  background:#111;
}

input,
textarea,
button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:14px;
  margin-top:12px;
  font-family:inherit;
}

input,
textarea{
  color:white;
  background:rgba(255,255,255,.1);
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input::placeholder,
textarea::placeholder{
  color:rgba(255,255,255,.55);
}

button{
  color:white;
  background:linear-gradient(135deg,#7b61ff,#4f9cff);
  font-size:16px;
}

.fileButton{
  display:block;
  text-align:center;
  padding:14px;
  margin-top:12px;
  border-radius:16px;
  background:rgba(255,255,255,.12);
  cursor:pointer;
}

#file{
  display:none;
}

#msg{
  text-align:center;
  min-height:25px;
}
</style>
</head>

<body>

<div class="box">

<h2>⚙️ تنظیمات کانال</h2>

<img
  id="preview"
  class="preview"
  alt="پروفایل"
>

<label class="fileButton" for="file">
📷 انتخاب عکس پروفایل
</label>

<input
  id="file"
  type="file"
  accept="image/*"
>

<input
  id="name"
  placeholder="نام کانال"
>

<textarea
  id="bio"
  placeholder="بیو کانال"
></textarea>

<button onclick="saveSettings()">
💾 ذخیره تغییرات
</button>

<p id="msg"></p>

</div>

<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentId = null;
let currentImage = "";

const fileInput =
document.getElementById("file");

const preview =
document.getElementById("preview");

const nameInput =
document.getElementById("name");

const bioInput =
document.getElementById("bio");

const msg =
document.getElementById("msg");


fileInput.addEventListener(
  "change",
  function(){

    const file = this.files[0];

    if(!file) return;

    const localUrl =
      URL.createObjectURL(file);

    preview.src = localUrl;
  }
);


async function loadSettings(){

  const {data,error} =
    await db
      .from("site_settings")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(1);

  if(error){

    console.log(error);
    return;
  }

  if(!data || !data.length)
    return;

  const s = data[0];

  currentId = s.id || null;

  nameInput.value =
    s.site_name || "";

  bioInput.value =
    s.bio || "";

  currentImage =
    s.image_url || "";

  if(currentImage)
    preview.src = currentImage;
}


async function uploadProfile(file){

  const extension =
    file.name.includes(".")
    ? file.name.split(".").pop()
    : "jpg";

  const fileName =
    "profile-" +
    Date.now() +
    "." +
    extension;

  const {error} =
    await db.storage
      .from("Minuit cotier")
      .upload(
        fileName,
        file,
        {
          upsert:true
        }
      );

  if(error)
    throw error;

  const {data} =
    db.storage
      .from("Minuit cotier")
      .getPublicUrl(fileName);

  return data.publicUrl;
}


async function saveSettings(){

  msg.textContent =
    "در حال ذخیره...";

  try{

    const file =
      fileInput.files[0];

    let imageUrl =
      currentImage;

    if(file){

      imageUrl =
        await uploadProfile(file);

    }

    const values = {

      site_name:
        nameInput.value.trim(),

      bio:
        bioInput.value.trim(),

      image_url:
        imageUrl

    };


    let result;


    if(currentId){

      result =
        await db
          .from("site_settings")
          .update(values)
          .eq("id",currentId);

    }else{

      result =
        await db
          .from("site_settings")
          .insert(values)
          .select()
          .single();

      if(result.data)
        currentId =
          result.data.id;
    }


    if(result.error)
      throw result.error;


    currentImage =
      imageUrl;

    msg.textContent =
      "ذخیره شد ✅";

  }catch(error){

    console.error(error);

    msg.textContent =
      "خطا: " + error.message;
  }
}


loadSettings();

</script>

</body>
</html>
