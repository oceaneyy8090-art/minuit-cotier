<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>💫 مدیریت پست‌ها</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:tahoma;
background:linear-gradient(135deg,#080820,#34205e);
color:white;
}

.box{
width:90%;
max-width:600px;
margin:20px auto;
background:#ffffff15;
padding:20px;
border-radius:25px;
}

input,textarea,button{
width:100%;
padding:13px;
margin-top:10px;
border:0;
border-radius:15px;
}

input,textarea{
background:#ffffff20;
color:white;
}

button{
background:#8265ff;
color:white;
}

.card{
background:#ffffff15;
padding:15px;
margin-top:20px;
border-radius:20px;
}

.card img{
width:100%;
border-radius:15px;
}

.delete{
background:#ff3d5a;
}

</style>

</head>


<body>


<div class="box">

<h2>💫 مدیریت پست‌ها</h2>


<input id="title" placeholder="عنوان">


<textarea id="content" placeholder="متن پست"></textarea>


<input id="file" type="file" accept="image/*">


<button onclick="savePost()">
انتشار 💫
</button>


<div id="posts"></div>


</div>



<script>


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function uploadImage(file){

if(!file) return "";


const name =
Date.now()+"-"+file.name;


const {error}=

await db.storage
.from("Minuit cotier")
.upload(
name,
file
);


if(error){

alert(error.message);
return "";

}



const {data}=

db.storage
.from("Minuit cotier")
.getPublicUrl(name);



return data.publicUrl;


}




async function savePost(){


const file =
document.getElementById("file").files[0];


let image_url="";


if(file){

image_url =
await uploadImage(file);

}



const {error}=

await db
.from("posts")
.insert({

title:
title.value,

content:
content.value,

image_url:
image_url

});



if(error){

alert(error.message);
return;

}



alert("پست اضافه شد ✅");


title.value="";
content.value="";
file.value="";
content.value="";


loadPosts();


}




async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{ascending:false}
);



if(error) return;



let html="";


data.forEach(p=>{


html+=`

<div class="card">

<h3>${p.title || ""}</h3>

<p>${p.content || ""}</p>


${p.image_url ?
`<img src="${p.image_url}">`
:""}



<button class="delete"
onclick="deletePost('${p.id}')">

حذف 🗑️

</button>


</div>

`;

});


posts.innerHTML=html;


}



async function deletePost(id){


const {error}=

await db
.from("posts")
.delete()
.eq(
"id",
id
);



if(error){

alert(error.message);
return;

}


loadPosts();


}



loadPosts();


</script>


</body>

</html>
