<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
touch-action:none;
background:#020617;
}

canvas{
display:block;
}
</style>

</head>

<body>

<canvas id="sky"></canvas>

<audio id="lightMusic" loop>
<source src="light.mp3" type="audio/mpeg">
</audio>


<script>

const lightMusic=document.getElementById("lightMusic");
lightMusic.volume=0.25;


// شروع موزیک با اولین لمس
document.body.addEventListener("pointerdown",()=>{

lightMusic.play();

},{once:true});



const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");


let W,H;

function resize(){

W=canvas.width=innerWidth;
H=canvas.height=innerHeight;

}

resize();
onresize=resize;



let camX=0;
let camY=0;


let stars=[];


const colors=[
"#ffffff",
"#7dd3fc",
"#a78bfa",
"#f9a8d4",
"#c7d2fe"
];



function addStar(){

stars.push({

x:camX+(Math.random()-0.5)*W*5,

y:camY+(Math.random()-0.5)*H*5,


vx:(Math.random()-.5)*0.25,

vy:(Math.random()-.5)*0.25,


size:2+Math.random()*7,


color:
colors[
Math.floor(Math.random()*colors.length)
]

});

}



// ستاره زیاد

for(let i=0;i<1200;i++){

addStar();

}




function animate(){



while(stars.length<1500){

addStar();

}



stars=stars.filter(s=>{

return(
Math.abs(s.x-camX)<W*5 &&
Math.abs(s.y-camY)<H*5
);

});




let bg=
ctx.createLinearGradient(
0,0,0,H
);


bg.addColorStop(0,"#010314");
bg.addColorStop(.5,"#071a3d");
bg.addColorStop(1,"#31486d");


ctx.fillStyle=bg;

ctx.fillRect(0,0,W,H);




stars.forEach(s=>{


s.x+=s.vx;
s.y+=s.vy;



let x=s.x-camX+W/2;

let y=s.y-camY+H/2;



if(
x<-100||
x>W+100||
y<-100||
y>H+100
)return;



ctx.font=s.size+"px Arial";

ctx.fillStyle=s.color;

ctx.textAlign="center";


ctx.fillText(
"☆",
x,
y
);



});



requestAnimationFrame(animate);

}


animate();





// حرکت صفحه

let sx=null;
let sy=null;

let ox=0;
let oy=0;



canvas.onpointerdown=e=>{

sx=e.clientX;
sy=e.clientY;

ox=camX;
oy=camY;

};



canvas.onpointermove=e=>{

if(sx===null)return;


camX=
ox-(e.clientX-sx);


camY=
oy-(e.clientY-sy);


};



canvas.onpointerup=()=>{

sx=null;
sy=null;

};



</script>

</body>
</html>
