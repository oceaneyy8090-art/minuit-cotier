<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    background:#000;
}


/* پنجره پست */

#postWindow{

    display:none;

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(88%,420px);

    max-height:80vh;

    overflow:auto;

    background:rgba(8,8,15,.97);

    border:1px solid rgba(255,255,255,.15);

    border-radius:22px;

    padding:22px;

    box-sizing:border-box;

    color:white;

    text-align:center;

    z-index:20;

}


#postTitle{

    font-size:23px;

}


#postText{

    color:#ddd;

    line-height:1.8;

    white-space:pre-wrap;

}


#postMedia img{

    max-width:100%;

    border-radius:16px;

}


#postMedia video{

    width:100%;

    border-radius:16px;

}


#postMedia audio{

    width:100%;

}


#closePost{

    position:absolute;

    right:12px;

    top:10px;

    width:38px;

    height:38px;

    border:0;

    border-radius:50%;

    background:#171722;

    color:white;

    font-size:20px;

}


#likeButton{

    margin-top:20px;

    width:64px;

    height:52px;

    border:0;

    border-radius:18px;

    background:#15151f;

    color:white;

    font-size:30px;

}


#likeButton.liked{

    color:#ff4fa3;

    text-shadow:
    0 0 12px #ff4fa3,
    0 0 25px #ff4fa3;

}

</style>

</head>


<body>


<canvas id="sky"></canvas>


<div id="postWindow">

<button id="closePost">×</button>

<h2 id="postTitle"></h2>

<div id="postText"></div>

<div id="postMedia"></div>

<button id="likeButton">♡</button>

</div>


<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("sky");

const ctx =
canvas.getContext("2d");


let W=innerWidth;
let H=innerHeight;


function resize(){

    W=innerWidth;
    H=innerHeight;


    const dpr=
        Math.min(
            devicePixelRatio||1,
            1.5
        );


    canvas.width=W*dpr;
    canvas.height=H*dpr;


    canvas.style.width=W+"px";
    canvas.style.height=H+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


addEventListener(
"resize",
resize
);

resize();



/* =========================
   دوربین
========================= */


let camX=0;
let camY=0;


let targetX=0;
let targetY=0;


let dragging=false;


let startX=0;
let startY=0;


let startCamX=0;
let startCamY=0;



/* =========================
   رنگ ستاره‌ها
========================= */


const colors=[

"#ffffff",
"#ffd5ef",
"#ff9ed6",
"#d3baff",
"#a9d9ff",
"#9df3ff"

];



/* =========================
   آسمان
========================= */


const WORLD=24000;


const stars=[];


for(let i=0;i<3000;i++){

stars.push({

x:(Math.random()-.5)*WORLD,

y:(Math.random()-.5)*WORLD,

size:10+Math.random()*5,

color:
colors[
Math.floor(
Math.random()*colors.length
)],

vx:(Math.random()-.5)*.5,

vy:(Math.random()-.5)*.5,

phase:Math.random()*6

});

}



/* =========================
   پست‌ها
========================= */


let posts=[];



/*
 جای ماه‌ها در آسمان
*/


function getPostPosition(id,index){


const angle=
(Number(id)||index+1)
*2.399963;


const radius=
600+
Math.sqrt(index)*900;



return {

x:
Math.cos(angle)*radius,


y:
Math.sin(angle)*radius

};


}




/* =========================
   گرفتن پست‌ها
========================= */


async function loadPosts(){


try{


const res=
await fetch(

SUPABASE_URL+
"/rest/v1/posts?select=*&order=created_at.asc",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY

}

}

);



const data=
await res.json();



posts=
data.map(
(item,index)=>{


const pos=
getPostPosition(
item.id,
index
);



return {


id:item.id,


x:pos.x,

y:pos.y,


title:
item.title||
item.Title||
"پست 🌛",


text:
item.content||
"",


image_url:
item.image_url||
"",


video_url:
item.video_url||
"",


music_url:
item.music_url||
""

};


}

);



console.log(posts);


}
catch(e){

console.log(e);

}


}
/* =========================
   مسیر ستاره‌ای بین ماه‌ها
========================= */


function drawPostConnections(time){


if(posts.length < 2)
    return;


ctx.textAlign="center";
ctx.textBaseline="middle";



for(let i=0;i<posts.length;i++){


    for(let j=i+1;j<posts.length;j++){


        const a=posts[i];

        const b=posts[j];



        const dx=
            b.x-a.x;


        const dy=
            b.y-a.y;



        const distance=
            Math.hypot(dx,dy);



        const count=
            Math.floor(distance/65);



        for(let k=1;k<count;k++){



            const t=
                k/count;



            const worldX=
                a.x+
                dx*t;



            const worldY=
                a.y+
                dy*t;




            const x=
                worldX-
                camX+
                W/2;



            const y=
                worldY-
                camY+
                H/2;




            if(
                x<-50||
                x>W+50||
                y<-50||
                y>H+50
            )
            continue;




            const glow=
                Math.sin(
                    time*0.003+k
                );



            ctx.globalAlpha=
                .5+
                glow*.25;



            ctx.fillStyle="#fff";


            ctx.shadowColor="#fff";


            ctx.shadowBlur=5;


            ctx.font="11px Arial";



            ctx.fillText(

                "☆",

                x,

                y

            );



            ctx.shadowBlur=0;


        }


    }


}



ctx.globalAlpha=1;


}







/* =========================
   ماه‌ها 🌛
========================= */


function drawPosts(time){


ctx.textAlign="center";
ctx.textBaseline="middle";



/* اول مسیرها */

drawPostConnections(time);




for(const post of posts){



const x=
post.x-
camX+
W/2;



const y=
post.y-
camY+
H/2;




if(
x<-100||
x>W+100||
y<-100||
y>H+100
)
continue;




/*
 حلقه ستاره دور ماه
*/


for(let i=0;i<18;i++){


const angle=
(i/18)*Math.PI*2+
time*0.0003;



const sx=
x+
Math.cos(angle)*70;



const sy=
y+
Math.sin(angle)*70;



ctx.font="12px Arial";

ctx.fillStyle="#fff";

ctx.shadowColor="#fff";

ctx.shadowBlur=5;


ctx.fillText(
"☆",
sx,
sy
);


ctx.shadowBlur=0;


}





/*
 خود ماه
*/


ctx.font="36px Arial";


ctx.shadowColor="#fff";

ctx.shadowBlur=15;



ctx.fillText(
"🌛",
x,
y
);



ctx.shadowBlur=0;



}


}
/* =========================
   پیدا کردن ماه
========================= */

let activePost=null;


function findPost(x,y){


for(
let i=posts.length-1;
i>=0;
i--
){


const p=posts[i];


const px=
p.x-camX+W/2;


const py=
p.y-camY+H/2;



if(
Math.hypot(
x-px,
y-py
)<70
){

return p;

}


}


return null;

}





/* =========================
   باز کردن پست
========================= */


function openPost(post){


activePost=post;



document.getElementById(
"postTitle"
).textContent=
post.title;



document.getElementById(
"postText"
).textContent=
post.text;



const media=
document.getElementById(
"postMedia"
);



media.innerHTML="";



if(post.image_url){


let img=
document.createElement("img");


img.src=
post.image_url;


media.appendChild(img);


}



if(post.video_url){


let video=
document.createElement("video");


video.src=
post.video_url;


video.controls=true;


media.appendChild(video);


}



if(post.music_url){


let audio=
document.createElement("audio");


audio.src=
post.music_url;


audio.controls=true;


media.appendChild(audio);


}



document.getElementById(
"postWindow"
).style.display=
"block";


}







/* =========================
   بستن
========================= */


document.getElementById(
"closePost"
).onclick=function(){


document.getElementById(
"postWindow"
).style.display=
"none";


activePost=null;


};








/* =========================
   حرکت دوربین
========================= */


canvas.addEventListener(
"pointerdown",
e=>{


dragging=true;


startX=e.clientX;

startY=e.clientY;


startCamX=camX;

startCamY=camY;



canvas.setPointerCapture(
e.pointerId
);


});



canvas.addEventListener(
"pointermove",
e=>{


if(!dragging)
return;



targetX=
startCamX-
(e.clientX-startX)*1.5;


targetY=
startCamY-
(e.clientY-startY)*1.5;


});




canvas.addEventListener(
"pointerup",
e=>{


dragging=false;



const post=
findPost(
e.clientX,
e.clientY
);



if(post)
openPost(post);



});







/* =========================
   ستاره‌های لایک
========================= */


const likeStars=[];



function createLikeStars(){


if(!activePost)
return;



const x=
activePost.x-camX+W/2;


const y=
activePost.y-camY+H/2;



for(let i=0;i<100;i++){



const a=
Math.random()*Math.PI*2;



likeStars.push({

x:x,

y:y,


vx:
Math.cos(a)*
(2+Math.random()*3),


vy:
Math.sin(a)*
(2+Math.random()*3),


life:100+Math.random()*100,


color:
colors[
Math.floor(
Math.random()*colors.length
)]

});


}



}





function drawLikeStars(){


for(
let i=likeStars.length-1;
i>=0;
i--
){


let s=likeStars[i];


s.x+=s.vx;

s.y+=s.vy;


s.life--;



if(s.life<=0){

likeStars.splice(i,1);

continue;

}



ctx.globalAlpha=
s.life/100;


ctx.fillStyle=s.color;


ctx.font="18px Arial";


ctx.fillText(
"☆",
s.x,
s.y
);


}


ctx.globalAlpha=1;


}





document.getElementById(
"likeButton"
).onclick=function(){


this.classList.add(
"liked"
);


this.textContent="♥";


createLikeStars();


};








/* =========================
   انیمیشن اصلی
========================= */


function animate(time){



if(!dragging){


targetX+=0.05;

targetY+=0.03;


}




camX+=
(targetX-camX)*0.06;


camY+=
(targetY-camY)*0.06;




ctx.fillStyle="#000";


ctx.fillRect(
0,
0,
W,
H
);



drawStars(time);


drawPosts(time);


drawLikeStars();



requestAnimationFrame(
animate
);


}



loadPosts();


requestAnimationFrame(
animate
);

</script>

</body>
</html>
