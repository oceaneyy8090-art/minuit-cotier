<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  color:white;
}

#sky{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(25,20,55,.12),
      rgba(0,0,0,.95) 70%);
}

#world{
  position:absolute;
  width:24000px;
  height:24000px;
  left:-12000px;
  top:-12000px;
  transform:translate(0,0);
}

/* ستاره‌های اصلی */
.star{
  position:absolute;
  user-select:none;
  pointer-events:none;
  font-weight:400;
  line-height:1;
  text-shadow:
    0 0 5px currentColor,
    0 0 10px currentColor;
  will-change:transform;
}

/* ماه پست */
.post-moon{
  position:absolute;
  font-size:40px;
  cursor:pointer;
  user-select:none;
  z-index:20;
  filter:
    drop-shadow(0 0 7px rgba(255,255,255,.5));
  animation:moonFloat 2.8s ease-in-out infinite;
}

@keyframes moonFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* پنجره پست */
#postModal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  z-index:1000;
}

.post-box{
  width:min(430px,94vw);
  max-height:80vh;
  overflow:auto;
  padding:24px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  background:
    linear-gradient(
      145deg,
      rgba(15,15,30,.97),
      rgba(3,3,10,.98)
    );
  box-shadow:
    0 0 35px rgba(120,80,255,.18);
}

.post-title{
  font-size:22px;
  margin-bottom:14px;
}

.post-content{
  white-space:pre-wrap;
  line-height:1.8;
  color:#ddd;
}

.post-image{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:15px;
  margin:15px 0;
}

.close-btn{
  float:left;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:25px;
  cursor:pointer;
}

.like-btn{
  margin-top:20px;
  width:100%;
  border:1px solid rgba(255,255,255,.18);
  border-radius:15px;
  padding:12px;
  background:rgba(255,255,255,.05);
  color:white;
  font-size:27px;
  cursor:pointer;
}

.like-btn.liked{
  color:#ff72bd;
  text-shadow:
    0 0 8px #ff72bd,
    0 0 18px #ff72bd;
}

/* ستاره‌های لایک */
.like-star{
  position:fixed;
  z-index:2000;
  pointer-events:none;
  user-select:none;
  font-size:15px;
  line-height:1;
  font-weight:400;
  text-shadow:
    0 0 5px currentColor,
    0 0 12px currentColor;
  will-change:left,top,opacity;
}
</style>
</head>

<body>

<div id="sky">
  <div id="world"></div>
</div>

<div id="postModal">
  <div class="post-box">

    <button class="close-btn" id="closePost">×</button>

    <div class="post-title" id="modalTitle"></div>

    <img
      id="modalImage"
      class="post-image"
      style="display:none"
      alt=""
    >

    <div class="post-content" id="modalContent"></div>

    <button class="like-btn" id="likeBtn">♡</button>

  </div>
</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


/* =========================
   تنظیمات آسمان
========================= */

const world =
document.getElementById("world");

const WORLD_SIZE = 24000;

let camX = 0;
let camY = 0;

let stars = [];

const starColors = [
  "#ffffff",
  "#ffd6f2",
  "#ff9fd3",
  "#8fd8ff",
  "#65c7ff",
  "#b8a0ff",
  "#c9a7ff",
  "#a78bfa",
  "#d9c8ff",
  "#79f2ff",
  "#f0c8ff",
  "#e7e7ff",
  "#ffc1e3"
];


/* =========================
   ساخت 3000 ستاره اصلی
========================= */

for(let i=0;i<3000;i++){

  const el =
  document.createElement("div");

  el.className="star";
  el.textContent="☆";

  const x =
    Math.random()*WORLD_SIZE;

  const y =
    Math.random()*WORLD_SIZE;

  const size =
    13 + Math.random()*5;

  const color =
    starColors[
      Math.floor(
        Math.random()*starColors.length
      )
    ];

  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.fontSize=size+"px";
  el.style.color=color;

  world.appendChild(el);

  stars.push({
    el,
    x,
    y,
    vx:(Math.random()-.5)*.15,
    vy:(Math.random()-.5)*.15,
    phase:Math.random()*Math.PI*2
  });
}


/* =========================
   پست‌ها
========================= */

let posts=[];

let currentPost=null;


/* جای ثابت برای هر پست */

function postPosition(id,index){

  const n =
    Number(id) ||
    (index+1)*7919;

  return {

    x:
      12000 +
      (Math.sin(n*12.9898)*9000),

    y:
      12000 +
      (Math.sin(n*78.233)*9000)

  };
}


/* =========================
   گرفتن پست‌ها از Supabase
========================= */

async function loadPosts(){

  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/posts?select=*",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer "+SUPABASE_KEY
          }
        }
      );

    if(!response.ok){

      console.log(
        "Supabase error:",
        response.status
      );

      return;
    }

    const data =
      await response.json();

    posts =
      data.map((p,index)=>{

        const pos =
          postPosition(
            p.id,
            index
          );

        return {

          id:p.id,

          x:pos.x,
          y:pos.y,

          title:
            p.title ||
            p.Title ||
            "پست 🌛",

          text:
            p.content ||
            "",

          image_url:
            p.image_url ||
            ""

        };

      });

    drawPosts();

  }catch(error){

    console.log(
      "خطا در اتصال:",
      error
    );

  }
}


/* =========================
   نمایش ماه‌های پست
========================= */

function drawPosts(){

  document
    .querySelectorAll(".post-moon")
    .forEach(el=>el.remove());

  posts.forEach(post=>{

    const moon =
      document.createElement("div");

    moon.className="post-moon";

    moon.textContent="🌛";

    moon.style.left =
      post.x+"px";

    moon.style.top =
      post.y+"px";

    moon.dataset.id =
      post.id;

    moon.addEventListener(
      "click",
      e=>{

        e.stopPropagation();

        openPost(post);

      }
    );

    world.appendChild(moon);

  });

}


/* =========================
   باز کردن پست
========================= */

const modal =
document.getElementById("postModal");

const modalTitle =
document.getElementById("modalTitle");

const modalContent =
document.getElementById("modalContent");

const modalImage =
document.getElementById("modalImage");

const likeBtn =
document.getElementById("likeBtn");


function openPost(post){

  currentPost=post;

  modalTitle.textContent =
    post.title;

  modalContent.textContent =
    post.text;

  if(post.image_url){

    modalImage.src =
      post.image_url;

    modalImage.style.display=
      "block";

  }else{

    modalImage.style.display=
      "none";

  }

  likeBtn.textContent="♡";
  likeBtn.classList.remove("liked");

  modal.style.display=
    "flex";
}


document
.getElementById("closePost")
.addEventListener(
  "click",
  ()=>{
    modal.style.display="none";
  }
);


modal.addEventListener(
  "click",
  e=>{

    if(e.target===modal){

      modal.style.display="none";

    }

  }
);


/* =========================
   ⭐ ستاره‌های لایک
========================= */

function createLikeStars(){

  if(!currentPost) return;


  /*
    مختصات واقعی ماه پست
    روی صفحه
  */

  const moon =
    document.querySelector(
      '.post-moon[data-id="' +
      currentPost.id +
      '"]'
    );


  let startX =
    window.innerWidth/2;

  let startY =
    window.innerHeight/2;


  if(moon){

    const rect =
      moon.getBoundingClientRect();

    startX =
      rect.left +
      rect.width/2;

    startY =
      rect.top +
      rect.height/2;

  }


  const colors=[
    "#ff75c8",
    "#ff9edc",
    "#70d7ff",
    "#8fcfff",
    "#a98cff",
    "#c8a5ff",
    "#ffffff",
    "#72f1ff",
    "#f3b7ff",
    "#ffd1ee"
  ];


  /*
    دقیقاً 100 ستاره
    از خود پست شروع می‌شوند
  */

  for(let i=0;i<100;i++){

    const star =
      document.createElement("div");

    star.className=
      "like-star";

    star.textContent="☆";


    /*
      زاویه کاملاً تصادفی
      یعنی همه طرف پخش می‌شوند
    */

    const angle =
      Math.random() *
      Math.PI * 2;


    /*
      سرعت متفاوت
    */

    const speed =
      1.8 +
      Math.random()*4;


    let x=startX;
    let y=startY;

    let life=0;


    star.style.left=
      x+"px";

    star.style.top=
      y+"px";


    star.style.color=
      colors[
        Math.floor(
          Math.random()*
          colors.length
        )
      ];


    star.style.fontSize=
      (13+
       Math.random()*7)+"px";


    document.body.appendChild(star);


    function animate(){

      x +=
        Math.cos(angle) *
        speed;

      y +=
        Math.sin(angle) *
        speed;


      /*
        کمی حرکت نرم
        برای طبیعی‌تر شدن
      */

      y +=
        Math.sin(life*.04) *
        .35;


      life++;


      star.style.left=
        x+"px";

      star.style.top=
        y+"px";


      /*
        ابتدا کامل دیده می‌شوند
        بعد آرام محو می‌شوند
      */

      if(life<120){

        star.style.opacity=
          "1";

      }else{

        star.style.opacity=
          Math.max(
            0,
            1-
            (life-120)/80
          );

      }


      if(life<200){

        requestAnimationFrame(
          animate
        );

      }else{

        star.remove();

      }

    }


    requestAnimationFrame(
      animate
    );

  }

}


/* =========================
   لایک
========================= */

likeBtn.addEventListener(
  "click",
  ()=>{

    if(
      likeBtn.classList.contains(
        "liked"
      )
    ){

      return;

    }

    likeBtn.classList.add(
      "liked"
    );

    likeBtn.textContent="♥";

    createLikeStars();

  }
);


/* =========================
   حرکت خود ستاره‌های اصلی
========================= */

function animateStars(){

  for(const s of stars){

    s.x += s.vx;
    s.y += s.vy;

    s.phase += .025;


    /*
      حرکت نرم و خیلی کم
    */

    const twinkle =
      0.82 +
      Math.sin(s.phase)*0.18;

    s.el.style.opacity=
      twinkle;


    /*
      اگر از محدوده خارج شد
      از طرف مقابل برگردد
    */

    if(s.x<0)
      s.x=WORLD_SIZE;

    if(s.x>WORLD_SIZE)
      s.x=0;

    if(s.y<0)
      s.y=WORLD_SIZE;

    if(s.y>WORLD_SIZE)
      s.y=0;


    s.el.style.transform=
      `translate3d(${s.x}px,${s.y}px,0)`;

  }

  requestAnimationFrame(
    animateStars
  );

}


/* =========================
   حرکت دوربین / کشیدن آسمان
========================= */

let dragging=false;

let lastX=0;
let lastY=0;


function updateWorld(){

  world.style.transform=
    `translate3d(${camX}px,${camY}px,0)`;

}


sky.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.target.closest(
        ".post-moon"
      )
    ) return;

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;

    sky.setPointerCapture(
      e.pointerId
    );

  }
);


sky.addEventListener(
  "pointermove",
  e=>{

    if(!dragging) return;

    const dx =
      e.clientX-lastX;

    const dy =
      e.clientY-lastY;

    camX += dx;
    camY += dy;

    lastX=e.clientX;
    lastY=e.clientY;

    updateWorld();

  }
);


sky.addEventListener(
  "pointerup",
  ()=>{
    dragging=false;
  }
);


sky.addEventListener(
  "pointercancel",
  ()=>{
    dragging=false;
  }
);


/* =========================
   شروع
========================= */

updateWorld();

animateStars();

loadPosts();

</script>

</body>
</html>
