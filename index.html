<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;
overflow:hidden;
background:#02020d;
font-family:tahoma;

}


/* دنیای اصلی */

#space{

position:fixed;
inset:0;

overflow:hidden;

touch-action:none;

background:

radial-gradient(circle at 20% 30%,
#443080,
transparent 35%),

radial-gradient(circle at 80% 60%,
#32145c,
transparent 40%),

linear-gradient(
135deg,
#02020d,
#080824
);

}


/* جهان بزرگ */

#galaxy{

position:absolute;

width:10000px;
height:10000px;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}



/* سحابی */

.nebula{

position:absolute;

border-radius:50%;

filter:blur(120px);

opacity:.18;

}



.nebula.one{

width:2000px;
height:1200px;

left:800px;
top:700px;

background:#713cff;

}



.nebula.two{

width:1800px;
height:1300px;

left:5000px;
top:3500px;

background:#ff63c3;

}



.nebula.three{

width:1700px;
height:1000px;

left:2500px;
top:6500px;

background:#43d8ff;

}




/* ستاره های ریز */

.star{

position:absolute;

pointer-events:none;

font-size:8px;

animation:

shine 3s infinite alternate,

move 8s infinite alternate;

}



@keyframes shine{

from{

opacity:.2;

transform:scale(.5);

}


to{

opacity:1;

transform:scale(1.4);

}

}



@keyframes move{

from{

margin-left:0;

}


to{

margin-left:35px;

}

}



/* ستاره پست */

.post{

position:absolute;

width:24px;

height:24px;

border-radius:50%;

cursor:pointer;

background:

radial-gradient(
circle,

white 0%,

#ffeaa0 25%,

#ffc400 50%,

transparent 75%

);


box-shadow:

0 0 15px #ffd900,

0 0 40px #ffb000;


animation:pulse 2s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.5);

}

}




/* شهاب */

.comet{

position:absolute;

width:9px;

height:9px;

background:white;

border-radius:50%;

box-shadow:

0 0 20px white,

0 0 50px #5eeaff;

}


.comet:after{

content:"";

position:absolute;

right:5px;

top:3px;

width:180px;

height:4px;


background:

linear-gradient(
90deg,
white,
transparent
);


transform:rotate(-15deg);

}



/* نمایش پست */


#viewer{

position:fixed;

inset:0;

display:none;

align-items:center;

justify-content:center;

background:

rgba(0,0,20,.85);

z-index:100;

}


#viewer.show{

display:flex;

}



.box{

width:90%;

max-width:500px;

padding:25px;

background:#151535;

border-radius:25px;

color:white;

text-align:center;

}



.box img,
.box video{

width:100%;

border-radius:15px;

}



.box audio{

width:100%;

}



.like{

border:0;

background:none;

font-size:40px;

color:white;

cursor:pointer;

}




/* قلب ها */


.heart{

position:fixed;

z-index:999;

pointer-events:none;

animation:

heart 1.5s forwards;

}



@keyframes heart{


from{

opacity:1;

transform:scale(.3);

}


to{

opacity:0;

transform:

translate(var(--x),var(--y))

scale(1.5);

}

}



</style>

</head>


<body>


<div id="space">


<div id="galaxy">


<div class="nebula one"></div>

<div class="nebula two"></div>

<div class="nebula three"></div>


</div>


</div>



<div id="viewer">


<div class="box">


<h2 id="title">
💫
</h2>


<div id="content"></div>


<button class="like">
♡
</button>


</div>


</div>



<script>
// ===== حرکت دنیا =====

const space = document.getElementById("space");
const galaxy = document.getElementById("galaxy");

let x = 0;
let y = 0;

let down = false;
let sx = 0;
let sy = 0;


space.addEventListener("pointerdown", e=>{

down = true;

sx = e.clientX;
sy = e.clientY;

});



space.addEventListener("pointermove", e=>{

if(!down) return;


x += e.clientX - sx;
y += e.clientY - sy;


sx = e.clientX;
sy = e.clientY;


galaxy.style.transform =
`
translate(
calc(-50% + ${x}px),
calc(-50% + ${y}px)
)
`;

});



space.addEventListener("pointerup",()=>{

down=false;

});




// ===== ستاره های رنگی =====

const colors = [

"#bfe9ff",
"#ffc7e8",
"#d8c2ff",
"#ffeaa0",
"#a8ffda"

];


for(let i=0;i<1200;i++){

let s=document.createElement("div");

s.className="star";

s.innerText =
Math.random()>0.5
?"☆"
:"✦";


s.style.left =
Math.random()*9500+"px";


s.style.top =
Math.random()*9500+"px";


s.style.color =
colors[
Math.floor(Math.random()*colors.length)
];


s.style.fontSize =
(4+Math.random()*10)+"px";


galaxy.appendChild(s);

}





// ===== شهاب =====


function makeComet(){


let c=document.createElement("div");

c.className="comet";


c.style.left =
Math.random()*8000+"px";


c.style.top =
Math.random()*8000+"px";


galaxy.appendChild(c);



let move=0;


let timer=setInterval(()=>{


move+=10;


c.style.transform =
`translate(${move}px,${move/2}px)`;


if(move>3000){

clearInterval(timer);

c.remove();

}


},30);


}



setInterval(
makeComet,
5000
);





// ===== پست های نمونه =====
// بعداً این بخش به Supabase وصل می‌شود


const demo=[

{
x:1200,
y:800,
title:"اولین پست 💫",
text:"اینجا عکس یا فیلم قرار می‌گیرد"
},


{
x:3300,
y:1800,
title:"خاطره دوم ✨",
text:"محتوای پست"
},


{
x:5600,
y:3200,
title:"شب آرام 🌌",
text:"موزیک یا ویدیو"
}

];




demo.forEach(post=>{


let p=document.createElement("div");

p.className="post";


p.style.left =
post.x+"px";


p.style.top =
post.y+"px";



p.onclick=()=>{

openPost(post);

};



galaxy.appendChild(p);



});






// ===== باز کردن پست =====


function openPost(post){


document.getElementById("title")
.innerText =
post.title;


document.getElementById("content")
.innerHTML =
`
<p>${post.text}</p>
`;


document
.getElementById("viewer")
.classList.add("show");


}





// بستن پنجره

document
.getElementById("viewer")
.addEventListener("click",e=>{


if(e.target.id==="viewer"){

document
.getElementById("viewer")
.classList.remove("show");

}


});
// ===== SUPABASE =====

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// ===== گرفتن پست های واقعی =====

async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



data.forEach((post,index)=>{


let p=document.createElement("div");

p.className="post";


// جای پست ها در دنیا

p.style.left =
(1000 + index*700)+"px";


p.style.top =
(1200 + (index%4)*900)+"px";



p.onclick=()=>{

openRealPost(post);

};



galaxy.appendChild(p);


});


}




// ===== نمایش پست واقعی =====


function openRealPost(post){


document
.getElementById("title")
.innerText =
post.title || "💫";


let html="";


if(post.content){

html +=
`<p>${post.content}</p>`;

}



if(post.image_url){

html +=
`
<img src="${post.image_url}">
`;

}



if(post.video_url){

html +=
`
<video controls src="${post.video_url}">
</video>
`;

}



if(post.audio_url){

html +=
`
<audio controls src="${post.audio_url}">
</audio>
`;

}



document
.getElementById("content")
.innerHTML =
html;



document
.getElementById("viewer")
.classList.add("show");


}



// شروع

loadPosts();

</script>

</body>
</html>
