<style>
html,body{
    margin:0;
    width:100%;
    height:100%;

canvas{
    display:block;

    height:100%;

}

#postWindow{
    display:none;
    position:fixed;
    z-index:50;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(88vw,420px);
    max-height:82vh;
    overflow:auto;
    padding:24px 20px 20px;
    background:rgba(5,5,10,.97);
    border:1px solid rgba(255,255,255,.18);

#postWindow h2{

<body>

<canvas id="sky"></canvas>

<div id="postWindow">

    <button id="closePost">×</button>

    <h2 id="postTitle"></h2>

    <div id="postText"></div>

    <div id="postMedia"></div>

    <button id="likeButton">♡</button>

</div>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


/* =====================================
   CANVAS
===================================== */

const canvas =
document.getElementById("sky");

const ctx =
canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(devicePixelRatio || 1,1.5);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(
        dpr,0,
        0,dpr,
        0,0
    );
}

addEventListener("resize",resize);

resize();


/* =====================================
   دوربین
===================================== */

let camX = 0;
let camY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let startCamX = 0;
let startCamY = 0;

let downX = 0;
let downY = 0;


/* =====================================
   رنگ ستاره‌ها
===================================== */

const colors = [

    "#ffffff",
    "#ffd5ef",
    "#ff9ed6",
    "#ffb8e5",

    "#d3baff",
    "#b59cff",

    "#a9d9ff",
    "#78c8ff",

    "#9df3ff",

    "#e3c8ff",
    "#f4b9ff",

    "#c5ffe3"
];


/* =====================================
   جهان بزرگ
===================================== */

const WORLD = 24000;


/* =====================================
   3000 ستاره
===================================== */

const stars = [];

for(let i=0;i<3000;i++){

    stars.push({

        x:
            (Math.random()-.5)*WORLD,

        y:
            (Math.random()-.5)*WORLD,

        size:
            13+Math.random()*4,

        color:
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ],

        vx:
            (Math.random()-.5)*.8,

        vy:
            (Math.random()-.5)*.8,

        phase:
            Math.random()*Math.PI*2
    });
}


/* =====================================
   پست‌ها
===================================== */

let posts = [];


/*
   موقعیت ماه‌ها همان قبلی است.
*/

function getPostPosition(id,index){

    const n =
        Number(id) || index+1;

    const angle =
        n*2.399963229728653;

    const radius =
        500 + Math.sqrt(index)*650;

    return {

        x:
            Math.cos(angle)*radius,

        y:
            Math.sin(angle)*radius
    };
}


/* =====================================
   گرفتن پست‌ها از Supabase
===================================== */

async function loadPosts(){

    try{

        const response =
            await fetch(

                SUPABASE_URL+
                "/rest/v1/posts?select=*&order=created_at.asc",

                {
                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer "+SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            console.error(
                "Supabase error:",
                await response.text()
            );

            return;
        }


        const data =
            await response.json();


        posts =
            data.map(
                (item,index)=>{

                    const position =
                        getPostPosition(
                            item.id,
                            index
                        );

                    return {

                        id:item.id,

                        x:position.x,

                        y:position.y,

                        title:
                            item.title ||
                            item.Title ||
                            "بدون عنوان 🌛",

                        text:
                            item.content || "",

                        image_url:
                            item.image_url || "",

                        video_url:
                            item.video_url || "",

                        music_url:
                            item.music_url || "",

                        created_at:
                            item.created_at || ""
                    };
                }
            );


        console.log(
            "Posts:",
            posts
        );

    }catch(error){

        console.error(
            "خطا:",
            error
        );
    }
}


/* =====================================
   ستاره‌های اطراف هر ماه
===================================== */

function drawMoonStars(post,time){

    const count = 18;

    const orbitRadius = 70;


    for(let i=0;i<count;i++){

        const angle =
            (i/count)*Math.PI*2+
            time*.00035;

        const wave =
            Math.sin(
                time*.001+i
            )*5;


        const worldX =
            post.x+
            Math.cos(angle)*
            (orbitRadius+wave);

        const worldY =
            post.y+
            Math.sin(angle)*
            (orbitRadius+wave);


        const x =
            worldX-camX+W/2;

        const y =
            worldY-camY+H/2;


        if(
            x<-80 ||
            x>W+80 ||
            y<-80 ||
            y>H+80
        )
            continue;


        const size =
            12+
            Math.sin(
                time*.002+i
            )*2;


        ctx.globalAlpha =
            .75+
            Math.sin(
                time*.002+i
            )*.2;


        ctx.fillStyle =
            "#ffffff";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur =
            7;

        ctx.font =
            `${size}px Arial`;


        ctx.fillText(
            "☆",
            x,
            y
        );


        ctx.shadowBlur = 0;
    }


    ctx.globalAlpha = 1;
}


/* =====================================
   مسیر ستاره‌ای بین ماه‌ها
===================================== */

function drawMoonPath(time){

    /*
       اگر کمتر از دو پست داریم،
       مسیر ساخته نمی‌شود.
    */

    if(posts.length < 2)
        return;


    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    /*
       ماه‌ها به ترتیب پست‌ها
       به هم وصل می‌شوند.
    */

    for(
        let i=0;
        i<posts.length-1;
        i++
    ){

        const a =
            posts[i];

        const b =
            posts[i+1];


        /*
           تعداد ستاره‌های مسیر
        */

        const count = 45;


        for(
            let j=1;
            j<count;
            j++
        ){

            const t =
                j/count;


            /*
               حرکت بین دو ماه
            */

            let x =
                a.x+
                (b.x-a.x)*t;


            let y =
                a.y+
                (b.y-a.y)*t;


            /*
               موج خیلی آرام
            */

            y +=
                Math.sin(
                    time*.002+j
                )*4;


            /*
               تبدیل مختصات جهان
               به صفحه
            */

            const screenX =
                x-camX+W/2;

            const screenY =
                y-camY+H/2;


            /*
               اگر خارج صفحه است
            */

            if(
                screenX<-40 ||
                screenX>W+40 ||
                screenY<-40 ||
                screenY>H+40
            )
                continue;


            /*
               ستاره کوچک سفید
            */

            ctx.globalAlpha =
                .85+
                Math.sin(
                    time*.003+j
                )*.15;


            ctx.font =
                "10px Arial";


            ctx.fillStyle =
                "#ffffff";


            ctx.shadowColor =
                "#ffffff";


            ctx.shadowBlur =
                5;


            ctx.fillText(
                "☆",
                screenX,
                screenY
            );


            ctx.shadowBlur = 0;
        }
    }


    ctx.globalAlpha = 1;
}

/* =====================================
   پروفایل کانال
===================================== */

function drawProfile(){

    const x=W/2;
    const y=120;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        45,
        0,
        Math.PI*2
    );


    ctx.fillStyle="#15151f";
    ctx.fill();


    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=3;
    ctx.stroke();


    ctx.font="35px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    ctx.fillText(
        "🌛",
        x,
        y
    );


    ctx.font="18px Arial";
    ctx.fillStyle="#fff";


    ctx.fillText(
        "Minuit côtier",
        x,
        y+75
    );
}


/* مسیر از پروفایل تا اولین ماه */

function drawProfilePath(){

    if(posts.length===0)
        return;


    const startX=W/2;
    const startY=165;


    const endX=
        posts[0].x-camX+W/2;

    const endY=
        posts[0].y-camY+H/2;


    for(let i=1;i<40;i++){

        const t=i/40;


        const x=
            startX+(endX-startX)*t;

        const y=
            startY+(endY-startY)*t;


        ctx.font="10px Arial";

        ctx.fillStyle="#fff";

        ctx.fillText(
            "☆",
            x,
            y
        );
    }
}

/* =====================================
   ماه‌های پست
===================================== */

function drawPosts(time){

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    for(
        const post of posts
    ){

        const x =
            post.x-camX+W/2;

        const y =
            post.y-camY+H/2;


        if(
            x<-120 ||
            x>W+120 ||
            y<-120 ||
            y>H+120
        )
            continue;


        /*
           ستاره‌های اطراف ماه
        */

        drawMoonStars(
            post,
            time
        );


        /*
           خود ماه
        */

        ctx.font =
            "36px Arial";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur =
            15;


        ctx.fillText(
            "🌛",
            x,
            y
        );


        ctx.shadowBlur = 0;
    }
}


/* =====================================
   ستاره‌های لایک
===================================== */

const likeStars = [];

let activePost = null;


function createLikeStars(){

    if(!activePost)
        return;


    const startX =
        activePost.x-
        camX+
        W/2;


    const startY =
        activePost.y-
        camY+
        H/2;


    /*
       دقیقاً 100 ستاره
    */

    for(let i=0;i<100;i++){

        const angle =
            Math.random()*
            Math.PI*2;


        const speed =
            1.5+
            Math.random()*4;


        likeStars.push({

            x:startX,

            y:startY,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            size:
                13+
                Math.random()*5,

            color:
                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ],

            life:
                100+
                Math.random()*100
        });
    }
}


/* =====================================
   رسم ستاره‌های لایک
===================================== */

function drawLikeStars(){

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    for(
        let i=likeStars.length-1;
        i>=0;
        i--
    ){

        const s =
            likeStars[i];


        s.x += s.vx;
        s.y += s.vy;


        s.vx *= .998;
        s.vy *= .998;


        s.life--;


        if(s.life<=0){

            likeStars.splice(
                i,
                1
            );

            continue;
        }


        ctx.globalAlpha =
            Math.min(
                1,
                s.life/35
            );


        ctx.fillStyle =
            s.color;


        ctx.shadowColor =
            s.color;

        ctx.shadowBlur =
            5;


        ctx.font =
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            s.x,
            s.y
        );


        ctx.shadowBlur = 0;
    }


    ctx.globalAlpha = 1;
}


/* =====================================
   پس‌زمینه
===================================== */

function drawBackground(){

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================
   ستاره‌های اصلی آسمان
===================================== */

function drawStars(time){

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    for(
        const s of stars
    ){

        s.x += s.vx;
        s.y += s.vy;


        if(s.x>WORLD/2)
            s.x=-WORLD/2;

        if(s.x<-WORLD/2)
            s.x=WORLD/2;


        if(s.y>WORLD/2)
            s.y=-WORLD/2;

        if(s.y<-WORLD/2)
            s.y=WORLD/2;


        const x =
            s.x-camX+W/2;

        const y =
            s.y-camY+H/2;


        if(
            x<-40 ||
            x>W+40 ||
            y<-40 ||
            y>H+40
        )
            continue;


        const alpha =
            .88+
            Math.sin(
                time*.002+s.phase
            )*.10;


        ctx.globalAlpha =
            alpha;


        ctx.fillStyle =
            s.color;


        ctx.shadowColor =
            s.color;

        ctx.shadowBlur =
            5;


        ctx.font =
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            x,
            y
        );


        ctx.shadowBlur = 0;
    }


    ctx.globalAlpha = 1;
}


/* =====================================
   پیدا کردن ماه
===================================== */

function findPost(x,y){

    for(
        let i=posts.length-1;
        i>=0;
        i--
    ){

        const post =
            posts[i];


        const px =
            post.x-camX+W/2;

        const py =
            post.y-camY+H/2;


        if(
            Math.hypot(
                x-px,
                y-py
            )<70
        )
            return post;
    }


    return null;
}


/* =====================================
   لمس صفحه
===================================== */

canvas.addEventListener(
    "pointerdown",
    e=>{

        downX =
            e.clientX;

        downY =
            e.clientY;


        dragging = true;


        startX =
            e.clientX;

        startY =
            e.clientY;


        startCamX =
            camX;

        startCamY =
            camY;


        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx =
            e.clientX-startX;

        const dy =
            e.clientY-startY;


        targetX =
            startCamX-
            dx*1.5;


        targetY =
            startCamY-
            dy*1.5;
    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const distance =
            Math.hypot(
                e.clientX-downX,
                e.clientY-downY
            );


        dragging = false;


        if(distance<12){

            const post =
                findPost(
                    e.clientX,
                    e.clientY
                );


            if(post)
                openPost(post);
        }


        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}
    }
);


/* =====================================
   باز کردن پست
===================================== */

function openPost(post){

    activePost =
        post;


    document.getElementById(
        "postTitle"
    ).textContent =
        post.title;


    document.getElementById(
        "postText"
    ).textContent =
        post.text;


    const media =
        document.getElementById(
            "postMedia"
        );


    media.innerHTML = "";


    if(post.image_url){

        const img =
            document.createElement(
                "img"
            );

        img.src =
            post.image_url;

        img.alt =
            "تصویر پست";


        media.appendChild(
            img
        );
    }


    if(post.video_url){

        const video =
            document.createElement(
                "video"
            );

        video.src =
            post.video_url;

        video.controls =
            true;

        video.playsInline =
            true;


        media.appendChild(
            video
        );
    }


    if(post.music_url){

        const audio =
            document.createElement(
                "audio"
            );

        audio.src =
            post.music_url;

        audio.controls =
            true;


        media.appendChild(
            audio
        );
    }


    const like =
        document.getElementById(
            "likeButton"
        );


    like.classList.remove(
        "liked"
    );


    like.textContent =
        "♡";


    document.getElementById(
        "postWindow"
    ).style.display =
        "block";
}


/* =====================================
   بستن پست
===================================== */

document.getElementById(
    "closePost"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "postWindow"
        ).style.display =
            "none";

        activePost = null;
    }
);


/* =====================================
   لایک
===================================== */

document.getElementById(
    "likeButton"
).addEventListener(
    "click",
    function(){

        if(!activePost)
            return;


        this.classList.add(
            "liked"
        );


        this.textContent =
            "♥";


        createLikeStars();
    }
);


/* =====================================
   شروع
===================================== */

loadPosts();


function animate(time){

    if(!dragging){

        targetX += .10;

        targetY += .04;
    }


    camX +=
        (targetX-camX)*.06;


    camY +=
        (targetY-camY)*.06;


    drawBackground();

    drawStars(time);
    drawProfile();
    /*
       مسیر بین ماه‌ها
    */

    drawMoonPath(time);

    /*
       خود ماه‌ها
    */

    drawPosts(time);

    /*
       افکت لایک
    */

    drawLikeStars();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

<script>

"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY

/* ورود با Google */

/* خروج */

document.getElementById("logoutBtn").onclick =
async function(){

/* وضعیت کاربر */

async function updateLogin(){

    const { data } =
    await supabaseClient.auth.getSession();

    const session = data.session;

    const loginBtn =
    document.getElementById("googleLoginBtn");

    const logoutBtn =
    document.getElementById("logoutBtn");

    const userInfo =
    document.getElementById("userInfo");


    if(session){

        loginBtn.style.display = "none";

        logoutBtn.style.display = "inline-block";

        userInfo.textContent =
        "☆ " +
        (session.user.user_metadata?.name ||
         session.user.email ||
         "کاربر");

        /* ستاره‌های ورود */

        for(let i=0;i<25;i++){

            const star =
            document.createElement("div");

            star.textContent = "☆";

            star.style.position = "fixed";
            star.style.left =
            (45 + Math.random()*10) + "%";

            star.style.top =
            (45 + Math.random()*10) + "%";

            star.style.color =
            [
                "#ff7bd5",
                "#7ddcff",
                "#b98cff",
                "#ffffff"
            ][Math.floor(Math.random()*4)];

            star.style.fontSize =
            (12 + Math.random()*20) + "px";

            star.style.zIndex = "100000";

            star.style.pointerEvents = "none";

            document.body.appendChild(star);

            const x =
            (Math.random()-0.5)*500;

            const y =
            (Math.random()-0.5)*500;

            star.animate(
                [
                    {
                        transform:"translate(0,0) scale(1)",
                        opacity:1
                    },
                    {
                        transform:
                        `translate(${x}px,${y}px) scale(0)`,
                        opacity:0
                    }
                ],
                {
                    duration:1000 +
                    Math.random()*1000,
                    easing:"ease-out"
                }
            );

            setTimeout(()=>{
                star.remove();
            },2200);
        }

    }else{

        loginBtn.style.display =
        "inline-block";

        logoutBtn.style.display =
        "none";

        userInfo.textContent = "";

    }

}


supabaseClient.auth.onAuthStateChange(
    function(){
        updateLogin();
    }
);

updateLogin();

</script>
