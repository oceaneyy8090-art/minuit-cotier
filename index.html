<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030d;
  color:white;
  font-family:Arial,sans-serif;
  touch-action:none;
}

/* =====================================================
   SPACE VIEW
===================================================== */

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle at center,
      #171943 0%,
      #090b25 38%,
      #030513 75%,
      #010208 100%
    );
}

/* =====================================================
   GALAXY WORLD
===================================================== */

#world{
  position:absolute;

  width:6000px;
  height:6000px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  transform-origin:center center;

  will-change:transform;
}

/* =====================================================
   BACKGROUND NEBULA
===================================================== */

.nebula{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(60px);
  opacity:.22;
}

.nebula.one{
  width:1000px;
  height:700px;
  left:600px;
  top:700px;
  background:#6b42ff;
}

.nebula.two{
  width:900px;
  height:600px;
  left:3500px;
  top:2700px;
  background:#087cff;
}

.nebula.three{
  width:1100px;
  height:800px;
  left:2200px;
  top:4200px;
  background:#ff318c;
}

/* =====================================================
   STARS
===================================================== */

.star{
  position:absolute;

  color:#fff;

  font-size:8px;

  text-shadow:
    0 0 6px currentColor,
    0 0 15px currentColor;

  pointer-events:none;

  animation:
    twinkle 1.5s ease-in-out infinite alternate,
    floatStar 8s ease-in-out infinite;
}

@keyframes twinkle{
  from{
    opacity:.2;
    transform:scale(.7);
  }

  to{
    opacity:1;
    transform:scale(1.25);
  }
}

@keyframes floatStar{
  0%,100%{
    margin-left:0;
    margin-top:0;
  }

  50%{
    margin-left:25px;
    margin-top:-20px;
  }
}

/* =====================================================
   PROFILE PLANET / HOME
===================================================== */

.home{
  position:absolute;

  left:3000px;
  top:2800px;

  width:420px;

  transform:translate(-50%,-50%);

  text-align:center;
}

.profileCircle{
  width:125px;
  height:125px;

  margin:auto;

  border-radius:50%;

  object-fit:cover;

  display:none;

  border:3px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 15px #fff,
    0 0 35px #8067ff,
    0 0 80px rgba(100,70,255,.5);
}

#siteName{
  margin-top:18px;

  font-size:31px;

  text-shadow:
    0 0 10px #fff,
    0 0 30px #8d72ff;
}

#siteBio{
  margin-top:10px;

  color:#d6d6ea;

  line-height:1.8;
}

/* =====================================================
   YELLOW STAR
===================================================== */

#followStar{
  position:absolute;

  left:3550px;
  top:2500px;

  width:65px;
  height:65px;

  border:0;

  background:transparent;

  color:#ffd83d;

  font-size:36px;

  cursor:pointer;

  z-index:30;

  filter:
    drop-shadow(0 0 5px #ffd83d)
    drop-shadow(0 0 18px #ff9d00);

  animation:
    yellowStarMove 4s ease-in-out infinite,
    yellowStarGlow 1.3s ease-in-out infinite alternate;
}

@keyframes yellowStarMove{

  0%,100%{
    transform:
      translate(-35px,0)
      rotate(-10deg);
  }

  50%{
    transform:
      translate(35px,-25px)
      rotate(10deg);
  }
}

@keyframes yellowStarGlow{

  from{
    filter:
      drop-shadow(0 0 4px #ffd83d)
      drop-shadow(0 0 10px #ff9d00);
  }

  to{
    filter:
      drop-shadow(0 0 15px #fff)
      drop-shadow(0 0 35px #ffb300);
  }
}

/* =====================================================
   STAR LABEL
===================================================== */

.starLabel{
  position:absolute;

  color:#aaaed5;

  font-size:13px;

  pointer-events:none;

  white-space:nowrap;
}

/* =====================================================
   PLANETS
===================================================== */

.planet{
  position:absolute;

  border-radius:50%;

  pointer-events:none;

  animation:
    planetFloat 8s ease-in-out infinite;
}

@keyframes planetFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-25px);
  }
}

.earth{
  left:800px;
  top:900px;

  width:260px;
  height:260px;

  background:
    radial-gradient(
      circle at 32% 28%,
      #70d7ff 0 7%,
      transparent 8%
    ),
    radial-gradient(
      circle at 65% 55%,
      #38a95b 0 12%,
      transparent 13%
    ),
    radial-gradient(
      circle at 35% 68%,
      #238d4d 0 10%,
      transparent 11%
    ),
    radial-gradient(
      circle at 50% 50%,
      #168bd5,
      #07518e 60%,
      #011b3b
    );

  box-shadow:
    -25px -15px 35px rgba(255,255,255,.25),
    0 0 50px rgba(40,140,255,.55);
}

.moon{
  left:1800px;
  top:700px;

  width:145px;
  height:145px;

  background:
    radial-gradient(
      circle at 35% 28%,
      #f5f5f5,
      #aaaab5 55%,
      #555563 100%
    );

  box-shadow:
    0 0 35px rgba(220,225,255,.45);
}

.mars{
  left:4300px;
  top:900px;

  width:190px;
  height:190px;

  background:
    radial-gradient(
      circle at 30% 28%,
      #ff9a72,
      #bd422d 50%,
      #55150d
    );

  box-shadow:
    0 0 40px rgba(255,75,40,.35);
}

.jupiter{
  left:4200px;
  top:3700px;

  width:360px;
  height:360px;

  background:
    repeating-linear-gradient(
      0deg,
      #d7b58e 0px,
      #d7b58e 22px,
      #9c7657 30px,
      #f0d4aa 45px,
      #a77d5c 62px
    );

  box-shadow:
    0 0 55px rgba(230,180,130,.28);
}

.saturn{
  left:900px;
  top:4100px;

  width:270px;
  height:270px;

  background:
    repeating-linear-gradient(
      0deg,
      #f1dca7 0px,
      #d0b77d 22px,
      #a98955 38px,
      #ead49b 55px
    );

  box-shadow:
    0 0 50px rgba(255,220,150,.3);
}

.saturnRing{
  position:absolute;

  width:430px;
  height:115px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    rotate(-18deg);

  border:
    18px solid rgba(211,190,145,.65);

  border-radius:50%;

  box-shadow:
    0 0 0 8px rgba(120,100,70,.35),
    inset 0 0 20px rgba(255,255,255,.25);
}

.sun{
  left:2700px;
  top:700px;

  width:430px;
  height:430px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #fffbc2 0%,
      #ffd52f 25%,
      #ff8d00 55%,
      #ff3d00 78%,
      #a30000 100%
    );

  box-shadow:
    0 0 60px #ffbd00,
    0 0 160px rgba(255,100,0,.55);

  animation:
    sunPulse 3s ease-in-out infinite alternate;
}

@keyframes sunPulse{
  from{
    box-shadow:
      0 0 45px #ffbd00,
      0 0 120px rgba(255,100,0,.45);
  }

  to{
    box-shadow:
      0 0 80px #ffdb32,
      0 0 190px rgba(255,100,0,.65);
  }
}

/* =====================================================
   POSTS
===================================================== */

.postsArea{
  position:absolute;

  left:3550px;
  top:2750px;

  width:1000px;

  display:grid;

  grid-template-columns:
    repeat(2,420px);

  gap:70px;

  transform:translate(-50%,0);
}

.post{
  position:relative;

  width:420px;

  padding:20px;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(19,23,61,.94),
      rgba(4,6,23,.94)
    );

  border:
    1px solid rgba(160,150,255,.25);

  box-shadow:
    0 20px 60px rgba(0,0,0,.55);

  backdrop-filter:blur(12px);
}

.post h2{
  font-size:20px;

  margin-bottom:12px;
}

.postText{
  color:#d7d7e8;

  line-height:1.8;

  margin-bottom:15px;

  white-space:pre-wrap;
}

.post img,
.post video{
  width:100%;

  max-height:500px;

  display:block;

  object-fit:contain;

  border-radius:18px;

  background:#000;
}

.post audio{
  width:100%;

  margin-top:12px;
}

/* =====================================================
   LIKE
===================================================== */

.postBottom{
  margin-top:15px;
}

.like{
  border:0;

  background:transparent;

  color:white;

  font-size:32px;

  cursor:pointer;

  transition:.2s;
}

.like:hover{
  transform:scale(1.2);
}

.like.liked{
  color:#ff5d9e;

  text-shadow:
    0 0 8px #ff5d9e,
    0 0 20px #ff277e;
}

/* =====================================================
   HEARTS
===================================================== */

.heart{
  position:fixed;

  z-index:99999;

  pointer-events:none;

  font-size:14px;

  animation:
    heartFly 1.3s ease-out forwards;
}

@keyframes heartFly{

  0%{
    opacity:1;

    transform:
      translate(0,0)
      scale(.4);
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(var(--x) * 1px),
        calc(var(--y) * 1px)
      )
      scale(1.5)
      rotate(var(--r));
  }
}

/* =====================================================
   MINI NAV
===================================================== */

#hint{
  position:fixed;

  left:50%;

  bottom:18px;

  transform:translateX(-50%);

  z-index:100;

  padding:9px 15px;

  border-radius:20px;

  background:rgba(4,6,25,.65);

  border:
    1px solid rgba(255,255,255,.12);

  color:#c9c9df;

  font-size:12px;

  pointer-events:none;

  backdrop-filter:blur(8px);
}

/* =====================================================
   LOADING
===================================================== */

#loading{
  position:fixed;

  inset:0;

  z-index:999;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#02030d;

  color:white;

  font-size:15px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .postsArea{
    grid-template-columns:420px;

    width:420px;
  }

  .home{
    width:330px;
  }

  .post{
    width:420px;
  }

  .earth{
    width:200px;
    height:200px;
  }

  .sun{
    width:300px;
    height:300px;
  }

  .jupiter{
    width:280px;
    height:280px;
  }

  .saturn{
    width:220px;
    height:220px;
  }

  .saturnRing{
    width:350px;
  }
}
</style>
</head>

<body>

<div id="loading">
  در حال باز کردن کهکشان...
</div>

<div id="viewport">

  <div id="world">

    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>

    <!-- PLANETS -->

    <div class="planet earth"></div>

    <div class="planet moon"></div>

    <div class="planet mars"></div>

    <div class="planet jupiter"></div>

    <div class="planet saturn">
      <div class="saturnRing"></div>
    </div>

    <div class="planet sun"></div>

    <!-- PROFILE -->

    <div class="home">

      <img
        id="profileImage"
        class="profileCircle"
        alt="profile">

      <h1 id="siteName">
        Minuit côtier
      </h1>

      <p id="siteBio">
        ...
      </p>

    </div>

    <!-- YELLOW STAR -->

    <button
      id="followStar"
      aria-label="دنبال کردن ستاره">
      ⭐️
    </button>

    <div
      class="starLabel"
      style="
        left:3480px;
        top:2590px;
      ">
      دنبال من بیا ✨
    </div>

    <!-- POSTS -->

    <section
      id="posts"
      class="postsArea">

      <div class="post">
        <div class="postText">
          در حال پیدا کردن پست‌ها...
        </div>
      </div>

    </section>

  </div>

</div>

<div id="hint">
  ✋ صفحه را بکش و در کهکشان بگرد
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

/*
  کلید واقعی sb_publishable خودت را اینجا قرار بده.
*/

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   WORLD POSITION
===================================================== */

const world =
document.getElementById(
  "world"
);

let worldX = 0;
let worldY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let startPointerX = 0;
let startPointerY = 0;

let startWorldX = 0;
let startWorldY = 0;


/* =====================================================
   INITIAL POSITION
===================================================== */

function centerWorld(){

  const centerX =
    window.innerWidth/2;

  const centerY =
    window.innerHeight/2;

  worldX =
    centerX -
    3000;

  worldY =
    centerY -
    2800;

  targetX=worldX;
  targetY=worldY;

  updateWorld();
}


/* =====================================================
   UPDATE WORLD
===================================================== */

function updateWorld(){

  world.style.transform=
    `translate(
      calc(-50% + ${worldX}px),
      calc(-50% + ${worldY}px)
    )`;
}


/* =====================================================
   DRAG START
===================================================== */

function pointerDown(e){

  dragging=true;

  const point =
    e.touches
      ? e.touches[0]
      : e;

  startPointerX=
    point.clientX;

  startPointerY=
    point.clientY;

  startWorldX=
    targetX;

  startWorldY=
    targetY;
}


/* =====================================================
   DRAG MOVE
===================================================== */

function pointerMove(e){

  if(!dragging)
    return;

  const point =
    e.touches
      ? e.touches[0]
      : e;

  const dx =
    point.clientX -
    startPointerX;

  const dy =
    point.clientY -
    startPointerY;

  targetX =
    startWorldX+dx;

  targetY =
    startWorldY+dy;

  /* حدود حرکت نقشه */

  const limit=2800;

  targetX=
    Math.max(
      -limit,
      Math.min(
        limit,
        targetX
      )
    );

  targetY=
    Math.max(
      -limit,
      Math.min(
        limit,
        targetY
      )
    );
}


/* =====================================================
   DRAG END
===================================================== */

function pointerUp(){

  dragging=false;
}


/* =====================================================
   TOUCH
===================================================== */

document
  .getElementById("viewport")
  .addEventListener(
    "touchstart",
    pointerDown,
    {passive:true}
  );

document
  .getElementById("viewport")
  .addEventListener(
    "touchmove",
    pointerMove,
    {passive:true}
  );

document
  .getElementById("viewport")
  .addEventListener(
    "touchend",
    pointerUp
  );


/* =====================================================
   MOUSE
===================================================== */

document
  .getElementById("viewport")
  .addEventListener(
    "mousedown",
    pointerDown
  );

window.addEventListener(
  "mousemove",
  pointerMove
);

window.addEventListener(
  "mouseup",
  pointerUp
);


/* =====================================================
   SMOOTH MOVEMENT
===================================================== */

function animateWorld(){

  worldX +=
    (targetX-worldX)*.12;

  worldY +=
    (targetY-worldY)*.12;

  updateWorld();

  requestAnimationFrame(
    animateWorld
  );
}

animateWorld();


/* =====================================================
   CREATE STARS
===================================================== */

const colors=[
  "#ffffff",
  "#ff91c8",
  "#ffb2db",
  "#79c8ff",
  "#879fff",
  "#b88cff",
  "#d9d9ff"
];

for(
  let i=0;
  i<500;
  i++
){

  const star=
    document.createElement(
      "span"
    );

  star.className="star";

  star.textContent="☆";

  star.style.left=
    Math.random()*5900+
    "px";

  star.style.top=
    Math.random()*5900+
    "px";

  star.style.color=
    colors[
      Math.floor(
        Math.random()*
        colors.length
      )
    ];

  star.style.fontSize=
    (Math.random()*8+3)+
    "px";

  star.style.animationDelay=
    (-Math.random()*5)+
    "s";

  star.style.animationDuration=
    (Math.random()*5+4)+
    "s";

  world.appendChild(star);
}


/* =====================================================
   SETTINGS
===================================================== */

async function loadSettings(){

  const result=
    await db
      .from("site_settings")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(1)
      .maybeSingle();

  if(result.error){

    console.error(
      result.error
    );

    return;
  }

  const data=
    result.data;

  if(!data)
    return;

  if(data.site_name){

    document
      .getElementById(
        "siteName"
      )
      .textContent=
      data.site_name;
  }

  if(data.bio){

    document
      .getElementById(
        "siteBio"
      )
      .textContent=
      data.bio;
  }

  if(data.image_url){

    const image=
      document.getElementById(
        "profileImage"
      );

    image.src=
      data.image_url;

    image.style.display=
      "block";
  }
}


/* =====================================================
   POSTS
===================================================== */

async function loadPosts(){

  const box=
    document.getElementById(
      "posts"
    );

  const result=
    await db
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(result.error){

    console.error(
      result.error
    );

    box.innerHTML=
      `<div class="post">
        <div class="postText">
          خطا در دریافت پست‌ها:
          ${escapeHtml(
            result.error.message
          )}
        </div>
      </div>`;

    return;
  }

  const data=
    result.data;

  if(
    !data ||
    data.length===0
  ){

    box.innerHTML=
      `<div class="post">
        <div class="postText">
          هنوز پستی اینجا نیست ✨
        </div>
      </div>`;

    return;
  }

  box.innerHTML="";

  data.forEach(
    post=>{

      const article=
        document.createElement(
          "article"
        );

      article.className="post";

      let html="";

      if(post.title){

        html+=
          `<h2>
            ${escapeHtml(
              post.title
            )}
          </h2>`;
      }

      if(post.content){

        html+=
          `<div class="postText">
            ${escapeHtml(
              post.content
            )}
          </div>`;
      }

      if(post.image_url){

        html+=
          `<img
            src="${safeUrl(
              post.image_url
            )}"
            loading="lazy"
            alt="post">`;
      }

      if(post.video_url){

        html+=
          `<video
            controls
            preload="metadata"
            src="${safeUrl(
              post.video_url
            )}">
          </video>`;
      }

      if(post.audio_url){

        html+=
          `<audio
            controls
            preload="metadata"
            src="${safeUrl(
              post.audio_url
            )}">
          </audio>`;
      }

      html+=
        `<div class="postBottom">
          <button
            class="like"
            aria-label="like">
            ♡
          </button>
        </div>`;

      article.innerHTML=
        html;

      const like=
        article.querySelector(
          ".like"
        );

      like.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          this.classList.toggle(
            "liked"
          );

          createHearts(
            this
          );
        }
      );

      box.appendChild(
        article
      );
    }
  );

  controlMedia();
}


/* =====================================================
   MEDIA CONTROL
===================================================== */

function controlMedia(){

  const media=
    document.querySelectorAll(
      "audio,video"
    );

  media.forEach(
    item=>{

      item.addEventListener(
        "play",
        ()=>{

          media.forEach(
            other=>{

              if(
                other!==item
              ){
                other.pause();
              }

            }
          );

        }
      );

    }
  );
}


/* =====================================================
   HEART EFFECT
===================================================== */

function createHearts(button){

  const rect=
    button.getBoundingClientRect();

  const hearts=[
    "❤️",
    "🩷",
    "💗",
    "💜",
    "💙",
    "🩵",
    "💖"
  ];

  for(
    let i=0;
    i<22;
    i++
  ){

    const heart=
      document.createElement(
        "span"
      );

    heart.className=
      "heart";

    heart.textContent=
      hearts[
        Math.floor(
          Math.random()*
          hearts.length
        )
      ];

    heart.style.left=
      (
        rect.left+
        rect.width/2
      )+"px";

    heart.style.top=
      (
        rect.top+
        rect.height/2
      )+"px";

    heart.style.setProperty(
      "--x",
      Math.random()*220-110
    );

    heart.style.setProperty(
      "--y",
      -(Math.random()*220+40)
    );

    heart.style.setProperty(
      "--r",
      Math.random()*120-60
    );

    document.body.appendChild(
      heart
    );

    setTimeout(
      ()=>{
        heart.remove();
      },
      1400
    );
  }
}

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function safeUrl(value){

  const url=
    String(value || "");

  if(
    url.startsWith(
      "https://"
    ) ||
    url.startsWith(
      "http://"
    )
  ){

    return url;
  }

  return "";
}
