<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Tahoma;
color:white;
background:
radial-gradient(circle at 20% 20%,#493477,transparent 35%),
radial-gradient(circle at 80% 80%,#12355e,transparent 35%),
linear-gradient(135deg,#020312,#10164a,#241044);
overflow-x:hidden;
}


#stars{
position:fixed;
inset:0;
z-index:0;
}


.star{
position:absolute;
font-size:8px;
opacity:.8;
animation:move linear infinite;
}


@keyframes move{
from{
transform:translateY(-20px);
}
to{
transform:translateY(110vh);
}
}


.container{
position:relative;
z-index:2;
width:92%;
max-width:650px;
margin:auto;
padding:25px 0;
}


.profile{
text-align:center;
background:#ffffff12;
padding:20px;
border-radius:25px;
backdrop-filter:blur(10px);
}


.profile img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}


.post{

background:#ffffff12;
margin-top:20px;
padding:18px;
border-radius:22px;
}


.post img,
.post video{

width:100%;
border-radius:15px;
}


audio{
width:100%;
margin-top:10px;
}


button{

border:0;
border-radius:20px;
padding:10px 20px;
background:#ff6fae;
color:white;
font-weight:bold;

}


.heart{

position:fixed;
font-size:25px;
animation:heart 1s forwards;

}


@keyframes heart{

from{
transform:translateY(0);
opacity:1;
}

to{
transform:translateY(-150px);
opacity:0;
}

}


</style>

</head>


<body>


<div id="stars"></div>


<div class="container">


<div class="profile">

<img id="avatar">

<h1>☆ Minuit côtier ☆</h1>

<p id="bio"></p>

</div>


<div id="posts">
در حال دریافت پست‌ها...
</div>


</div>




<script>


const URL=
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const KEY=
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db=
supabase.createClient(URL,KEY);





for(let i=0;i<120;i++){

let s=document.createElement("span");

s.className="star";

s.innerText="☆";

let colors=[
"#ffd1e8",
"#9ed8ff",
"#7ca9ff"
];

s.style.color=
colors[Math.floor(Math.random()*3)];

s.style.left=
Math.random()*100+"%";

s.style.animationDuration=
(Math.random()*10+5)+"s";


document
.getElementById("stars")
.appendChild(s);

}






async function loadSettings(){

let {data}=await db
.from("site_settings")
.select("*")
.limit(1);


if(data && data[0]){

document
.getElementById("avatar")
.src=data[0].image_url;


document
.getElementById("bio")
.innerText=data[0].bio;

}

}






async function loadPosts(){


let box=
document.getElementById("posts");


let {data,error}=await db
.from("posts")
.select("*")
.order("created_at",{ascending:false});



if(error){

box.innerHTML=error.message;
return;

}


box.innerHTML="";


data.forEach(p=>{


let div=
document.createElement("div");


div.className="post";


div.innerHTML=`

<h2>${p.title||""}</h2>

<p>${p.content||""}</p>


${p.image_url?
`<img src="${p.image_url}">`
:""}


${p.video_url?
`<video controls src="${p.video_url}"></video>`
:""}


${p.audio_url?
`<audio controls src="${p.audio_url}"></audio>`
:""}


<br><br>


<button onclick="like(this)">
❤️ لایک
</button>

`;


box.appendChild(div);


});


}







function like(btn){

let h=document.createElement("div");

h.className="heart";

h.innerText="❤️";


h.style.left=
Math.random()*90+"%";


document.body.appendChild(h);


setTimeout(()=>h.remove(),1000);

}






loadSettings();

loadPosts();


</script>


</body>
</html>
