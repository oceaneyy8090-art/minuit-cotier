<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
touch-action:none;
background:#020617;
}

canvas{
display:block;
}

#postBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#071a3d;
color:white;
padding:20px;
border-radius:20px;
z-index:10;
width:80%;
text-align:center;
}

#like{
font-size:35px;
color:white;
}

</style>

</head>

<body>

<canvas id="sky"></canvas>

<audio id="lightMusic" loop>
<source src="light.mp3" type="audio/mpeg">
</audio>


<div id="postBox">
<h2 id="postTitle">پست 🌛</h2>
<p id="postText"></p>

<div id="like">♡</div>

<button onclick="closePost()">بستن</button>

</div>


<script>

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){

W=canvas.width=innerWidth;
H=canvas.height=innerHeight;

}

resize();
onresize=resize;



const lightMusic=document.getElementById("lightMusic");
lightMusic.volume=0.25;



let camX=0;
let camY=0;


let stars=[];

let effects=[];


const colors=[
"#fff",
"#7dd3fc",
"#a78bfa",
"#f9a8d4",
"#c7d2fe"
];



function addStar(x,y){

stars.push({

x:x ?? camX+(Math.random()-0.5)*W*5,

y:y ?? camY+(Math.random()-0.5)*H*5,

vx:(Math.random()-.5)*0.25,

vy:(Math.random()-.5)*0.25,

size:2+Math.random()*7,

color:colors[Math.floor(Math.random()*colors.length)]

});

}


for(let i=0;i<1200;i++){
addStar();
}
// ---------- Supabase ----------

const SUPABASE_URL = "https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY = "sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


let posts=[];


// گرفتن پست‌ها از جدول posts

async function loadPosts(){

try{

let res = await fetch(
SUPABASE_URL + "/rest/v1/posts?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);


posts = await res.json();


// اگر پست جدید آمد، 🌛 ساخته شود

posts.forEach((p,i)=>{


if(!p.x){

p.x=(Math.random()-0.5)*2000;

p.y=(Math.random()-0.5)*2000;

}


});


console.log(posts);


}catch(e){

console.log("خطا در پست‌ها",e);

}

}


loadPosts();



// باز کردن پست

let activePost=null;


function openPost(post){

activePost=post;


document.getElementById("postBox").style.display="block";


document.getElementById("postTitle").innerHTML =
post.title || "پست 🌛";


document.getElementById("postText").innerHTML =
post.content || "";


lightMusic.play();

}



// بستن پست

function closePost(){

document.getElementById("postBox").style.display="none";


lightMusic.pause();

}
// نمایش پست‌های 🌛 و افکت‌ها


function draw(){

// ساخت ستاره‌های جدید

while(stars.length<1500){

addStar();

}



// پاک کردن ستاره‌های دور

stars = stars.filter(s=>{

return(
Math.abs(s.x-camX)<W*5 &&
Math.abs(s.y-camY)<H*5
);

});



// پس زمینه

let bg=ctx.createLinearGradient(0,0,0,H);

bg.addColorStop(0,"#010314");
bg.addColorStop(.5,"#071a3d");
bg.addColorStop(1,"#31486d");

ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);



// ستاره‌ها

stars.forEach(s=>{

s.x+=s.vx;
s.y+=s.vy;


let x=s.x-camX+W/2;
let y=s.y-camY+H/2;


ctx.font=s.size+"px Arial";
ctx.fillStyle=s.color;

ctx.fillText("☆",x,y);


});




// پست‌ها 🌛

posts.forEach(p=>{


let x=p.x-camX+W/2;
let y=p.y-camY+H/2;


ctx.font="22px Arial";

ctx.fillText(
"🌛",
x,
y
);


});



// ستاره‌های لایک

effects.forEach((e,i)=>{


e.x+=e.vx;
e.y+=e.vy;


ctx.font="18px Arial";
ctx.fillStyle=e.color;


ctx.fillText(
"☆",
e.x-camX+W/2,
e.y-camY+H/2
);



e.life--;


if(e.life<=0)
effects.splice(i,1);


});


requestAnimationFrame(draw);

}


draw();





// کلیک روی 🌛

canvas.onclick=e=>{


posts.forEach(p=>{


let x=p.x-camX+W/2;
let y=p.y-camY+H/2;


if(
Math.hypot(e.clientX-x,e.clientY-y)<40
){

openPost(p);

}


});


};





// لایک ♡

document.getElementById("like").onclick=()=>{


document.getElementById("like").style.color="red";



// پرتاب ۲۰۰ ستاره

for(let i=0;i<200;i++){


effects.push({

x:activePost.x,

y:activePost.y,


vx:(Math.random()-0.5)*12,

vy:(Math.random()-0.5)*12,


life:80,


color:
colors[Math.floor(Math.random()*colors.length)]


});


}


};





// حرکت صفحه

let sx=null;
let sy=null;

let ox=0;
let oy=0;



canvas.onpointerdown=e=>{

sx=e.clientX;
sy=e.clientY;

ox=camX;
oy=camY;

};



canvas.onpointermove=e=>{

if(sx===null)return;


camX=ox-(e.clientX-sx);

camY=oy-(e.clientY-sy);


};



canvas.onpointerup=()=>{

sx=null;
sy=null;

};
