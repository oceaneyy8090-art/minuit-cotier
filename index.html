<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#02020d;
}


#space{

position:fixed;
inset:0;

overflow:hidden;

touch-action:none;

background:
radial-gradient(circle,#35205f,#050515 70%);

}



#world{

position:absolute;

width:15000px;
height:15000px;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

will-change:transform;

}




.star{

position:absolute;

text-shadow:
0 0 8px currentColor;

opacity:.85;

}



.post{

position:absolute;

font-size:38px;

cursor:pointer;

filter:
drop-shadow(0 0 12px #ffe86a);

animation:pulse 2s infinite;

}



@keyframes pulse{

50%{
transform:scale(1.25);
}

}




.profile{

position:absolute;

left:7450px;
top:7400px;

text-align:center;

color:white;

}



.profile img{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

box-shadow:
0 0 35px #78ddff;

}



.profile h1{

margin-top:10px;

}




#viewer{

display:none;

position:fixed;

inset:0;

background:#000b;

z-index:20;

align-items:center;

justify-content:center;

}



#viewer.show{

display:flex;

}


.box{

width:90%;
max-width:500px;

background:#171735;

color:white;

padding:20px;

border-radius:25px;

text-align:center;

}



.box img,
.box video{

width:100%;

border-radius:15px;

}


.music{

position:fixed;

bottom:20px;

left:20px;

z-index:50;

width:55px;

height:55px;

border-radius:50%;

background:#765cff;

color:white;

border:0;

font-size:25px;

}


</style>

</head>


<body>


<div id="space">

<div id="world">


<div class="profile">

<img id="avatar">

<h1 id="name">
𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓
</h1>

<p id="bio"></p>

</div>


</div>

</div>


<button class="music" id="musicBtn">
♫
</button>



<div id="viewer">

<div class="box">

<h2 id="title"></h2>

<div id="content"></div>

<button onclick="closePost()">
بستن
</button>

</div>

</div>


<script>
// =======================
// حرکت دنیا
// =======================

const space =
document.getElementById("space");

const world =
document.getElementById("world");


let x = 0;
let y = 0;

let down = false;

let oldX = 0;
let oldY = 0;



space.addEventListener(
"pointerdown",
(e)=>{

down=true;

oldX=e.clientX;
oldY=e.clientY;

});



space.addEventListener(
"pointermove",
(e)=>{

if(!down) return;


x += e.clientX-oldX;
y += e.clientY-oldY;


oldX=e.clientX;
oldY=e.clientY;



world.style.transform =
`
translate(
calc(-50% + ${x}px),
calc(-50% + ${y}px)
)
`;

});



space.addEventListener(
"pointerup",
()=>{

down=false;

});





// =======================
// ستاره های زیاد ولی سبک
// =======================


const colors=[

"#ffffff",
"#8deaff",
"#ffc5e8",
"#d5b7ff",
"#fff18a",
"#aaffd8"

];



for(let i=0;i<700;i++){


let star =
document.createElement("span");


star.className="star";


star.innerHTML =
Math.random()>0.5
?
"☆"
:
"✦";



star.style.left =
Math.random()*14500+"px";


star.style.top =
Math.random()*14500+"px";



star.style.color =
colors[
Math.floor(
Math.random()*colors.length
)
];



star.style.fontSize =
(5+Math.random()*9)+"px";



world.appendChild(star);


}







// =======================
// ساخت 💫 پست
// =======================


function createPost(post,index){


let p =
document.createElement("div");


p.className="post";


p.innerHTML="💫";



p.style.left =
(1000+(index*900)%13000)
+"px";



p.style.top =
(1200+(index*700)%13000)
+"px";



p.onclick=()=>{

openPost(post);

};



world.appendChild(p);


}






function openPost(post){


document
.getElementById("title")
.innerText =
post.title || "💫";



let html="";


if(post.content){

html +=
"<p>"+post.content+"</p>";

}



if(post.image_url){

html +=
`
<img src="${post.image_url}">
`;

}



if(post.video_url){

html +=
`
<video controls src="${post.video_url}">
</video>
`;

}



document
.getElementById("content")
.innerHTML=html;



document
.getElementById("viewer")
.classList.add("show");

}





function closePost(){

document
.getElementById("viewer")
.classList.remove("show");

}
// =======================
// SUPABASE
// =======================

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





// =======================
// پروفایل
// =======================

async function loadProfile(){


const {data,error}=

await db
.from("site_settings")
.select("*")
.limit(1);



if(error){

console.log(error);

return;

}



if(!data[0]) return;


let p=data[0];



if(p.image_url){

document
.getElementById("avatar")
.src=p.image_url;

}


if(p.site_name){

document
.getElementById("name")
.innerText=p.site_name;

}


if(p.bio){

document
.getElementById("bio")
.innerText=p.bio;

}


}






// =======================
// پست ها
// =======================


async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



data.forEach(
(post,index)=>{

createPost(
post,
index
);

});

}



loadProfile();

loadPosts();








// =======================
// موزیک قوی تر
// =======================


let audioContext;

let musicOn=false;


const musicBtn =
document.getElementById(
"musicBtn"
);



musicBtn.onclick=()=>{


if(musicOn)
return;


musicOn=true;


audioContext =
new AudioContext();



playMusic();


};





function playMusic(){


const notes=[

261.6,
329.6,
392,
440,
392,
329

];

let i=0;



setInterval(()=>{


let osc =
audioContext
.createOscillator();


let gain =
audioContext
.createGain();



osc.type="sine";


osc.frequency.value =
notes[i];


i++;

if(i>=notes.length)
i=0;



gain.gain.value =
0.12;   // صدای بیشتر



osc.connect(gain);

gain.connect(
audioContext.destination
);



osc.start();


osc.stop(
audioContext.currentTime+0.7
);



},700);



}
</script>

</body>
</html>
