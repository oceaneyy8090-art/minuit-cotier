<style>

*{

html,body{
margin:0;

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const BUCKET = "Minuit cotier";


/* =========================
   STATE
========================= */

let currentUser = null;
let currentSession = null;

let posts = [];

let videoStyle = "normal";

let worldOffsetX = 0;
let worldOffsetY = 0;

let dragging = false;
let moved = false;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let likeStars = [];

let selectedPost = null;


/* =========================
   HELPERS
========================= */

function toast(text){

const el =
document.getElementById("toast");

el.textContent = text;
el.classList.add("show");

setTimeout(()=>{
el.classList.remove("show");
},2200);

}


function closePages(){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("show"));

}


function goHome(){

closePages();

}


function openCreate(){

closePages();

document
.getElementById("createPage")
.classList.add("show");

if(!currentUser){
toast("اول وارد شو 🌛");
}

}


function openProfile(){

closePages();

document
.getElementById("profilePage")
.classList.add("show");

loadProfileUI();

}


function openSettings(){

closePages();

document
.getElementById("settingsPage")
.classList.add("show");

loadSettingsUI();

}


function openChat(){

closePages();

document
.getElementById("chatPage")
.classList.add("show");

}


/* =========================
   AUTH
========================= */

async function loadAuth(){

const result =
await supabaseClient.auth.getSession();

currentSession =
result.data.session;

currentUser =
currentSession?.user || null;

updateProfileButton();

}


supabaseClient.auth.onAuthStateChange(
async (event,session)=>{

currentSession = session;
currentUser = session?.user || null;

updateProfileButton();

}
);


function updateProfileButton(){

const button =
document.getElementById("profileButton");

if(!currentUser){

button.innerHTML="<span>🌛</span>";

return;

}

const metadata =
currentUser.user_metadata || {};

const avatar =
metadata.avatar_url || "";

const name =
metadata.name ||
currentUser.email?.split("@")[0] ||
"شب‌گرد";

if(avatar){

button.innerHTML=
`<img src="${avatar}" alt="${name}">`;

}else{

button.innerHTML=
`<span>🌛</span>`;

}

}


function openLogin(){

closePages();

document
.getElementById("loginPage")
.classList.add("show");

}


async function emailSignup(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

if(!email || !password){

toast("ایمیل و رمز رو وارد کن");

return;

}

const {error} =
await supabaseClient.auth.signUp({
email,
password
});

if(error){

document.getElementById("loginStatus")
.textContent=error.message;

return;

}

toast("حساب ساخته شد ☆");

}


async function emailLogin(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

if(!email || !password){

toast("ایمیل و رمز رو وارد کن");

return;

}

const {error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

document.getElementById("loginStatus")
.textContent=error.message;

return;

}

toast("خوش اومدی ☆");

closePages();

}


async function googleLogin(){

const {error} =
await supabaseClient.auth.signInWithOAuth({

provider:"google",

options:{
redirectTo:
"https://oceaneyy8090-art.github.io/minuit-cotier/"
}

});

if(error){

toast(error.message);

}

}


async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;
currentSession=null;

updateProfileButton();

toast("فعلاً برم 🌛");

closePages();

}


/* =========================
   PROFILE
========================= */

function loadProfileUI(){

const preview =
document.getElementById("profilePreview");

if(!currentUser){

preview.src="";
preview.style.display="none";

document.getElementById("profileName").value="";
document.getElementById("profileBio").value="";

return;

}

const meta =
currentUser.user_metadata || {};

preview.style.display="block";

preview.src =
meta.avatar_url || "";

document.getElementById("profileName").value =
meta.name || "";

document.getElementById("profileBio").value =
meta.bio || "";

}


async function saveProfile(){

if(!currentUser){

openLogin();

return;

}

const name =
document.getElementById("profileName")
.value.trim();

const bio =
document.getElementById("profileBio")
.value.trim();

let avatarUrl =
currentUser.user_metadata?.avatar_url || "";


const file =
document.getElementById("profileFile")
.files[0];


if(file){

const ext =
file.name.split(".").pop();

const path =
"profiles/" +
currentUser.id +
"-" +
Date.now() +
"." +
ext;


const {error:uploadError} =
await supabaseClient.storage
.from(BUCKET)
.upload(path,file,{
upsert:true,
contentType:file.type
});


if(uploadError){

toast("آپلود عکس نشد");

console.error(uploadError);

return;

}


const {data} =
supabaseClient.storage
.from(BUCKET)
.getPublicUrl(path);

avatarUrl =
data.publicUrl;

}


const {error} =
await supabaseClient.auth.updateUser({

data:{
name:name,
bio:bio,
avatar_url:avatarUrl
}

});


if(error){

toast("ذخیره نشد");

console.error(error);

return;

}

updateProfileButton();

loadProfileUI();

toast("پروفایلت ذخیره شد ☆");

}


/* =========================
   SETTINGS
========================= */

function loadSettingsUI(){

if(!currentUser){

return;

}

const meta =
currentUser.user_metadata || {};

document.getElementById("settingPostEmoji")
.value =
meta.post_emoji || "🌛";

document.getElementById("settingPathEmoji")
.value =
meta.path_emoji || "☆";

document.getElementById("settingTitleEmoji")
.value =
meta.title_emoji || "✦";

}


async function saveSettings(){

if(!currentUser){

openLogin();

return;

}

const postEmoji =
document.getElementById("settingPostEmoji")
.value.trim() || "🌛";

const pathEmoji =
document.getElementById("settingPathEmoji")
.value.trim() || "☆";

const titleEmoji =
document.getElementById("settingTitleEmoji")
.value.trim() || "✦";


const old =
currentUser.user_metadata || {};


const {error} =
await supabaseClient.auth.updateUser({

data:{
...old,
post_emoji:postEmoji,
path_emoji:pathEmoji,
title_emoji:titleEmoji
}

});


if(error){

toast("ذخیره نشد");

return;

}

toast("تنظیمات ذخیره شد ☆");

}


/* =========================
   VIDEO STYLE
========================= */

function setVideoStyle(style){

videoStyle=style;

document.getElementById("videoNormal")
.style.opacity =
style==="normal" ? "1" : ".5";

document.getElementById("videoCircle")
.style.opacity =
style==="circle" ? "1" : ".5";

}


/* =========================
   FILE UPLOAD
========================= */

async function uploadFile(file,folder){

if(!file){

return null;

}

const ext =
file.name.split(".").pop();

const safeName =
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
ext;

const path =
folder + "/" + safeName;


const {error} =
await supabaseClient.storage
.from(BUCKET)
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);


if(error){

console.error(error);

throw error;

}


const {data} =
supabaseClient.storage
.from(BUCKET)
.getPublicUrl(path);

return data.publicUrl;

}


/* =========================
   SEND POST
========================= */

async function sendPost(){

if(!currentUser){

openLogin();

return;

}

const button =
document.getElementById("sendPostBtn");

if(button.disabled){

return;

}

button.disabled=true;
button.textContent="داره می‌فرسته...";

/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

const {data,error} =
await supabaseClient
.from("posts")
.select("*")
.order("created_at",{
ascending:true
});


if(error){

console.error(error);

return;

}

posts =
data || [];

drawWorld();

}


/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("sky");

const ctx =
canvas.getContext("2d");

let W=0;
let H=0;

function resizeCanvas(){

W=canvas.width=
window.innerWidth *
devicePixelRatio;

H=canvas.height=
window.innerHeight *
devicePixelRatio;

canvas.style.width=
window.innerWidth+"px";

canvas.style.height=
window.innerHeight+"px";

ctx.setTransform(
devicePixelRatio,
0,
0,
devicePixelRatio,
0,
0
);

}

window.addEventListener(
"resize",
resizeCanvas
);

resizeCanvas();


const backgroundStars=[];

for(let i=0;i<850;i++){

backgroundStars.push({

x:Math.random()*window.innerWidth,

y:Math.random()*window.innerHeight,

r:Math.random()*1.4+.2,

speed:Math.random()*.25+.03,

phase:Math.random()*Math.PI*2

});

}


function getPostPosition(index){

const total=
Math.max(posts.length,1);

const angle =
index *
(Math.PI*2/total)
+
0.5;

const radius =
Math.min(
window.innerWidth,
window.innerHeight
) *
(.20 + (index%4)*.08);

return{

x:
window.innerWidth/2 +
Math.cos(angle)*radius,

y:
window.innerHeight/2 +
Math.sin(angle)*radius*.72

};

}


function drawBackground(time){

ctx.clearRect(
0,
0,
window.innerWidth,
window.innerHeight
);


for(const s of backgroundStars){

const twinkle =
.35 +
Math.sin(
time*.001*s.speed+
s.phase
)*.35;

ctx.globalAlpha =
Math.max(.05,twinkle);

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}


function drawWorld(time){

drawBackground(time);

if(posts.length===0){

requestAnimationFrame(drawWorld);

return;

}


const positions =
posts.map(
(p,i)=>getPostPosition(i)
);


/* مسیرها */

for(let i=1;i<positions.length;i++){

const a=positions[i-1];
const b=positions[i];

const emoji =
posts[i].path_emoji ||
posts[i-1].path_emoji ||
"☆";


const steps=7;

for(let j=1;j<steps;j++){

const t=j/steps;

const x=
a.x+(b.x-a.x)*t;

const y=
a.y+(b.y-a.y)*t;

ctx.globalAlpha=.65;

ctx.font="15px Arial";

ctx.fillText(
emoji,
x,
y
);

}

}


ctx.globalAlpha=1;


/* پست‌ها */

posts.forEach((post,index)=>{

const p=positions[index];

post._x=p.x;
post._y=p.y;


/* glow */

const glow =
ctx.createRadialGradient(
p.x,
p.y,
3,
p.x,
p.y,
48
);

glow.addColorStop(
0,
"rgba(150,120,255,.22)"
);

glow.addColorStop(
1,
"rgba(150,120,255,0)"
);

ctx.fillStyle=glow;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
48,
0,
Math.PI*2
);

ctx.fill();


/* ایموجی پست */

ctx.font="34px Arial";

ctx.textAlign="center";

ctx.fillText(
post.post_emoji || "🌛",
p.x,
p.y+10
);


/* ایموجی عنوان */

ctx.font="16px Arial";

ctx.fillText(
post.title_emoji || "✦",
p.x,
p.y-28
);


/* like stars */

drawLikeStars(post);

});

ctx.textAlign="start";
ctx.globalAlpha=1;

requestAnimationFrame(drawWorld);

}


/* =========================
   LIKE STARS
========================= */

function createLikeStars(post){

const colors=[
"#ff8fb3",
"#9d8cff",
"#75d9ff",
"#ffffff",
"#d88cff",
"#ffb6d5"
];


/* دقیقاً 100 تا */

for(let i=0;i<100;i++){

likeStars.push({

postId:post.id,

x:post._x || window.innerWidth/2,

y:post._y || window.innerHeight/2,

vx:(Math.random()-.5)*6,

vy:(Math.random()-.5)*6-1,

life:1,

color:
colors[
Math.floor(
Math.random()*colors.length
)
]

});

}

}


function drawLikeStars(post){

for(const s of likeStars){

if(s.postId!==post.id){

continue;

}

ctx.globalAlpha =
Math.max(0,s.life);

ctx.fillStyle=s.color;

ctx.font="14px Arial";

ctx.fillText(
"☆",
s.x,
s.y
);

s.x+=s.vx;
s.y+=s.vy;

s.vx*=.97;
s.vy*=.97;

s.life-=.018;

}

likeStars =
likeStars.filter(
s=>s.life>0
);

ctx.globalAlpha=1;

}


/* =========================
   CANVAS TOUCH
========================= */

canvas.addEventListener(
"pointerdown",
e=>{

dragging=true;
moved=false;

startX=e.clientX;
startY=e.clientY;

lastX=e.clientX;
lastY=e.clientY;

canvas.setPointerCapture(e.pointerId);

}
);


canvas.addEventListener(
"pointermove",
e=>{

if(!dragging)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

if(
Math.abs(e.clientX-startX)>8 ||
Math.abs(e.clientY-startY)>8
){

moved=true;

}

lastX=e.clientX;
lastY=e.clientY;

}
);


canvas.addEventListener(
"pointerup",
e=>{

if(!dragging)return;

dragging=false;

if(moved)return;


let closest=null;
let distance=999;


posts.forEach((post,index)=>{

const p=getPostPosition(index);

const d=
Math.hypot(
e.clientX-p.x,
e.clientY-p.y
);

if(d<distance){

distance=d;
closest=post;

}

});


if(
closest &&
distance<55
){

openPost(closest);

}

});

String(post.user_id)===
String(currentUser.id)
){

currentUser.email?.split("@")[0] ||
"من";

currentUser.user_metadata?.avatar_url ||
"";

avatar
?
`<img class="authorAvatar" src="${avatar}">`
:
`<div class="authorAvatar"

🌛

}

${escapeHtml(authorName)}
</div>

${formatDate(post.created_at)}

</div>

</div>
`;


html+=`
<div class="postTitle">

${escapeHtml(post.title || "")}
</div>
`;

${escapeHtml(post.content)}
</div>
`;

}

html+=`
<img
class="postMedia"
src="${post.image_url}">
`;

}

html+=`

controls
src="${post.music_url}">

}


if(post.video_url){

html+=`
<video
class="postMedia ${
post.video_style==="circle"
?
"circle"
:
""
}"
controls
playsinline
src="${post.video_url}">
</video>

const likes =
await getLikes(post.id);

const comments =
await getComments(post.id);


const myLiked =
currentUser &&
likes.some(
l=>String(l.user_id)===
String(currentUser.id)

html+=`

<div class="actions">

<button
class="likeBtn ${myLiked?"liked":""}"
onclick="likePost()">

${myLiked?"♥":"♡"}
 ${likes.length}

</button>

<span style="font-size:11px;opacity:.6">
${likes.length} قلبک
</span>

${
currentUser &&
String(post.user_id)===
String(currentUser.id)
?
`
<button
class="deletePostBtn"
onclick="deletePost()">
حذف
</button>
`
:
""
}

</div>
`;


if(likes.length){

html+=`
<div
style="font-size:11px;opacity:.6;margin-top:10px">
قلبک‌ها:
${likes.map(
l=>escapeHtml(l.visitor_name || "شب‌گرد")
).join("، ")}
</div>
`;

}


html+=`

<div class="commentBox">

<div
style="font-size:13px;margin-bottom:8px">
گپ‌های این پست 💬
</div>

${
comments.length
?
comments.map(
c=>`
<div class="comment">
<b>
${escapeHtml(c.visitor_name || "شب‌گرد")}
</b>
<br>
${escapeHtml(c.message)}
</div>
`
).join("")
:
`
<div style="opacity:.5;font-size:11px">
هنوز کسی چیزی نگفته ☆
</div>
`

`;

if(currentUser){

html+=`

<div style="display:flex;gap:7px;margin-top:10px">

id="commentInput"
placeholder="یه چیزی بگو..."
style="margin:0">

<button
class="smallBtn"

ارسال
</button>

const {data,error} =
await supabaseClient
.from("likes")
.select("*")
.eq("post_id",postId);

if(error){

}

/* =========================
   DELETE POST
========================= */

async function deletePost(){

if(!selectedPost)return;

if(!currentUser){

return;

}


if(
String(selectedPost.user_id)!==
String(currentUser.id)
){

toast("این پست مال تو نیست");

return;

}


const yes =
confirm(
"این پست رو واقعاً حذف کنم؟"
);

if(!yes){

return;

}


const {error} =
await supabaseClient
.from("posts")
.delete()
.eq("id",selectedPost.id)
.eq("user_id",currentUser.id);


if(error){

console.error(error);

toast(
"حذف نشد: "+
error.message
);

return;

}

/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function formatDate(date){

if(!date){

return "";

}

try{

return new Date(date)
.toLocaleString(
"fa-IR",
{
year:"numeric",
month:"short",
day:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}
