<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#08051f;
touch-action:none;
}

canvas{
width:100%;
height:100%;
display:block;
}

#title{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
color:white;
opacity:.7;
font-size:15px;
font-family:sans-serif;
}

#post{
display:none;
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:80%;
max-width:350px;
background:#11102b;
color:white;
border-radius:18px;
padding:20px;
text-align:center;
font-family:sans-serif;
z-index:5;
}

#post img,
#post video{
width:100%;
border-radius:12px;
}

#close{
position:absolute;
left:8px;
top:8px;
border:0;
border-radius:50%;
background:#33285c;
color:white;
width:30px;
height:30px;
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="title">
𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓
</div>

<div id="post">
<button id="close">×</button>
<div id="postContent"></div>
</div>

<script>
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
}

resize();
onresize=resize;


let camX=0;
let camY=0;

let stars=[];


/* رنگ ستاره‌ها */
const starColors=[
"#ff5ca8",
"#ff6b6b",
"#ffd166",
"#66d9ff",
"#8d7aff",
"#d18cff",
"#ffffff"
];


/* ساخت دنیای ستاره‌ای */
function createObject(){

  let typeRand=Math.random();

  let obj={
    x:(Math.random()-0.5)*6000,
    y:(Math.random()-0.5)*6000,
    move:Math.random()*6,
    speed:.3+Math.random()*.5
  };


  if(typeRand<0.65){

    obj.type="star";
    obj.symbol="☆";
    obj.color=
    starColors[
      Math.floor(
        Math.random()*starColors.length
      )
    ];

    obj.size=13;

  }

  else if(typeRand<0.78){

    obj.type="magic";
    obj.symbol="💫";
    obj.size=22;

  }

  else if(typeRand<0.88){

    obj.type="planet";
    obj.symbol="🪐";
    obj.size=17;

  }

  else{

    obj.type="comet";
    obj.symbol="☄️";
    obj.size=18;

  }


  stars.push(obj);

}


/* تعداد کم برای سرعت */
for(let i=0;i<70;i++){
 createObject();
}



function draw(time){

ctx.clearRect(0,0,W,H);


/* پس زمینه */

let bg=
ctx.createLinearGradient(
0,0,W,H
);

bg.addColorStop(
0,
"#08051f"
);

bg.addColorStop(
.5,
"#16104a"
);

bg.addColorStop(
1,
"#32145b"
);

ctx.fillStyle=bg;

ctx.fillRect(
0,0,W,H
);



ctx.textAlign="center";
ctx.textBaseline="middle";



stars.forEach(o=>{


let x=
o.x+
Math.sin(
time*0.001*o.speed+
o.move
)*12
-
camX+
W/2;


let y=
o.y+
Math.cos(
time*0.001*o.speed+
o.move
)*12
-
camY+
H/2;



if(
x<-50||
x>W+50||
y<-50||
y>H+50
)return;



/* ستاره دنباله دار */

if(o.type==="comet"){

ctx.strokeStyle=
"rgba(120,220,255,.7)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
x-25,
y+15
);

ctx.lineTo(
x,
y
);

ctx.stroke();


ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
x,
y,
4,
0,
Math.PI*2
);

ctx.fill();


return;

}



ctx.font=
o.size+"px Arial";

ctx.fillStyle=
o.color ||
"white";


ctx.fillText(
o.symbol,
x,
y
);


});


requestAnimationFrame(draw);

}

requestAnimationFrame(draw);

/* =====================
   حرکت با انگشت
===================== */

let downX=0;
let downY=0;
let startX=0;
let startY=0;
let moved=false;


canvas.addEventListener(
"pointerdown",
e=>{

downX=e.clientX;
downY=e.clientY;

startX=camX;
startY=camY;

moved=false;

});



canvas.addEventListener(
"pointermove",
e=>{

let dx=e.clientX-downX;
let dy=e.clientY-downY;


if(
Math.abs(dx)>5||
Math.abs(dy)>5
)
moved=true;


camX=startX-dx;
camY=startY-dy;


});



canvas.addEventListener(
"pointerup",
e=>{

if(!moved){

checkMagic(
e.clientX,
e.clientY
);

}

});



/* =====================
   کلیک روی 💫
===================== */


function checkMagic(mx,my){

let worldX=
camX-W/2+mx;

let worldY=
camY-H/2+my;


for(let o of stars){


if(
o.type!=="magic"
)
continue;


let x=o.x-camX+W/2;
let y=o.y-camY+H/2;


let distance=
Math.hypot(
x-mx,
y-my
);


if(distance<35){

showPost();

break;

}

}

}



/* =====================
   پست
===================== */


let posts=[];


async function loadPosts(){

let result=
await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(!result.error){

posts=result.data||[];

}

}


loadPosts();



function showPost(){

let box=
document.getElementById("post");

let content=
document.getElementById("postContent");


if(posts.length===0){

content.innerHTML=
"هنوز پستی نیست 💔";

}
else{


let p=
posts[
Math.floor(
Math.random()*posts.length
)
];


content.innerHTML=
`
<h3>${p.title||""}</h3>

<p>${p.content||""}</p>

${p.image_url?
`<img src="${p.image_url}">`
:""}

${p.video_url?
`<video controls src="${p.video_url}"></video>`
:""}

`;

}


box.style.display=
"block";

}




document
.getElementById("close")
.addEventListener(
"click",
()=>{

document
.getElementById("post")
.style.display="none";

}
);


</script>

</body>
</html>
