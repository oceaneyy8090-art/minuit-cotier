<head>

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030b;
  font-family:Arial,sans-serif;
}

body{
  overscroll-behavior:none;
}

/* =====================================
   فضای اصلی
===================================== */

#space{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  background:
    radial-gradient(
      circle at 50% 50%,
      #19164e 0%,
      #0b0a2c 35%,
      #03040e 70%,
      #010107 100%
    );

  cursor:grab;
}

#space.dragging{
  cursor:grabbing;
}

/* =====================================
   جهان بزرگ
===================================== */

#galaxy{
  position:absolute;

  width:10000px;
  height:10000px;

  left:50%;
  top:50%;

  transform:
    translate(
      calc(-50% - 4300px),
      calc(-50% - 4300px)
    );

  transform-origin:center;
}

/* =====================================
   مه های فضایی
===================================== */

.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(100px);
  opacity:.17;
  pointer-events:none;
}

.n1{
  width:1500px;
  height:900px;
  left:300px;
  top:600px;
  background:#583dff;
}

.n2{
  width:1400px;
  height:1000px;
  left:5000px;
  top:800px;
  background:#ff278f;
}

.n3{
  width:1600px;
  height:1000px;
  left:2200px;
  top:5000px;
  background:#258fff;
}

.n4{
  width:1400px;
  height:1100px;
  left:6500px;
  top:6100px;
  background:#8a32ff;
}

/* =====================================
   ستاره های ریز
===================================== */

.star{
  position:absolute;

  color:white;

  font-size:10px;

  pointer-events:none;

  text-shadow:
    0 0 5px currentColor,
    0 0 12px currentColor;

  animation:
    twinkle var(--speed) ease-in-out infinite alternate,
    floatStar var(--move) ease-in-out infinite alternate;
}

@keyframes twinkle{

  from{
    opacity:.15;
    transform:scale(.5);
  }

  to{
    opacity:1;
    transform:scale(1.4);
  }
}

@keyframes floatStar{

  from{
    margin-left:0;
    margin-top:0;
  }

  to{
    margin-left:var(--dx);
    margin-top:var(--dy);
  }
}

/* =====================================
   ستاره دنباله دار
===================================== */

.comet{
  position:absolute;

  width:9px;
  height:9px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 8px #fff,
    0 0 20px #a9eaff,
    0 0 40px #52caff;

  pointer-events:none;

  z-index:30;
}

.comet::before{

  content:"";

  position:absolute;

  width:230px;
  height:5px;

  right:2px;
  top:2px;

  border-radius:100%;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.95),
      rgba(80,210,255,.5),
      transparent
    );

  filter:blur(2px);

  transform:
    rotate(-12deg);

  transform-origin:right center;
}

/* =====================================
   خورشید
===================================== */

.sun{

  top:1000px;

    radial-gradient(

/* =====================================
   زمین
===================================== */

  position:absolute;

  height:190px;

}

/* =====================================
   ماه
===================================== */

.moon{

    radial-gradient(

}

/* =====================================
   مریخ
===================================== */

.mars{

  position:absolute;

  background:

/* =====================================

===================================== */

.jupiter{

  left:6100px;

      0deg,

      #956e4c 14px 26px,

/* =====================================
   زحل
===================================== */

  position:absolute;

  width:195px;

  top:6000px;

    radial-gradient(

}

.saturn::before{

  content:"";

  width:340px;
  height:90px;

  left:-73px;
  top:53px;

  border:

  transform:rotate(-18deg);

}

/* =====================================
   ستاره راهنما
===================================== */

#guide{

  position:absolute;

  left:4500px;
  top:4300px;

  font-size:38px;

  z-index:100;

  cursor:pointer;

  filter:
    drop-shadow(0 0 8px #ffe600)
    drop-shadow(0 0 25px #ffca00);

  animation:
    guideMove 11s ease-in-out infinite alternate,
    guideGlow 1.5s ease-in-out infinite alternate;
}

@keyframes guideMove{

  0%{
    transform:translate(0,0) scale(.8);
  }

  25%{
    transform:translate(600px,-350px) scale(1.1);
  }

  50%{
    transform:translate(150px,550px) scale(.9);
  }

  75%{
    transform:translate(-500px,300px) scale(1.15);
  }

  100%{
    transform:translate(-800px,-200px) scale(.95);
  }
}

@keyframes guideGlow{

  from{
    filter:
      drop-shadow(0 0 6px #ffe600)
      drop-shadow(0 0 12px #ffcc00);
  }

  to{
    filter:
      drop-shadow(0 0 15px #fff000)
      drop-shadow(0 0 35px #ffb800);
  }
}

/* =====================================
   محل هر پست
===================================== */

.content-point{

  position:absolute;

  width:58px;
  height:58px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #fff 0 8%,
      #9deaff 9% 20%,
      #408cff 21% 42%,
      transparent 70%
    );

  box-shadow:
    0 0 15px #55cfff,
    0 0 40px rgba(60,180,255,.6);

  cursor:pointer;

  z-index:80;

  animation:
    contentPulse 2.5s ease-in-out infinite;
}

.content-point::after{

  content:"";

  position:absolute;

  inset:-15px;

  border:
    1px solid rgba(130,220,255,.3);

  border-radius:50%;

  animation:ringPulse 3s infinite;
}

@keyframes contentPulse{

  0%,100%{
    transform:scale(.8);
    opacity:.65;
  }

  50%{
    transform:scale(1.15);
    opacity:1;
  }
}

@keyframes ringPulse{

  from{
    transform:scale(.6);
    opacity:.8;
  }

  to{
    transform:scale(1.7);
    opacity:0;
  }
}

/* =====================================
   پنجره پست
===================================== */

/* =====================================
   100 قلب رنگی
===================================== */

.heart-particle{

  position:fixed;

  }

/* =====================================
   پروفایل
===================================== */

.profile{

.profile img{

</style>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://oyowhuyzgjvpoeupoegh.supabase.co";

/*
   اینجا کلید Publishable خودت را قرار بده.
*/
const SUPABASE_KEY =
  "sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   حرکت کهکشان
================================================== */

const space =
  document.getElementById("space");

const galaxy =
  document.getElementById("galaxy");

let cameraX = -4300;
let cameraY = -4300;

let targetX = cameraX;
let targetY = cameraY;

let dragging = false;

let startPointerX = 0;
let startPointerY = 0;

let startCameraX = 0;
let startCameraY = 0;


/* شروع کشیدن */

space.addEventListener(
  "pointerdown",
  function(e){

    dragging = true;

    space.classList.add("dragging");

    startPointerX =
      e.clientX;

    startPointerY =
      e.clientY;

    startCameraX =
      targetX;

    startCameraY =
      targetY;

    try{
      space.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

    startMusic();
  }
);


/* حرکت */

space.addEventListener(
  "pointermove",
  function(e){

    if(!dragging)
      return;

    const dx =
      e.clientX -
      startPointerX;

    const dy =
      e.clientY -
      startPointerY;

    targetX =
      startCameraX + dx;

    targetY =
      startCameraY + dy;

    limitCamera();
  }
);


/* پایان */

function stopDragging(e){

  dragging = false;

  space.classList.remove(
    "dragging"
  );

  try{
    space.releasePointerCapture(
      e.pointerId
    );
  }catch(err){}
}


space.addEventListener(
  "pointerup",
  stopDragging
);

space.addEventListener(
  "pointercancel",
  stopDragging
);


/* محدود کردن دوربین */

function limitCamera(){

  const minX =
    -(10000 - window.innerWidth + 100);

  const minY =
    -(10000 - window.innerHeight + 100);

  targetX =
    Math.min(
      100,
      Math.max(
        minX,
        targetX
      )
    );

  targetY =
    Math.min(
      100,
      Math.max(
        minY,
        targetY
      )
    );
}


/* حرکت نرم دوربین */

function animateCamera(){

  cameraX +=
    (targetX-cameraX) * .12;

  cameraY +=
    (targetY-cameraY) * .12;

  galaxy.style.transform =
    `translate(
      calc(-50% + ${cameraX}px),
      calc(-50% + ${cameraY}px)
    )`;

  requestAnimationFrame(
    animateCamera
  );
}

animateCamera();


/* ==================================================
   ستاره های ریز
================================================== */

const starColors = [

  "#ffffff",
  "#79dfff",
  "#b98cff",
  "#ff8fd8",
  "#ffe878",
  "#80ffbd",
  "#8fa7ff"

];


function createStars(){

  const fragment =
    document.createDocumentFragment();

  for(
    let i=0;
    i<700;
    i++
  ){

    const star =
      document.createElement("div");

    star.className =
      "star";

    star.textContent =
      Math.random() > .35
      ? "☆"
      : "✦";

    star.style.left =
      Math.random()*9800 +
      "px";

    star.style.top =
      Math.random()*9800 +
      "px";

    star.style.color =
      starColors[
        Math.floor(
          Math.random() *
          starColors.length
        )
      ];

    star.style.fontSize =
      (5 + Math.random()*8) +
      "px";

    star.style.setProperty(
      "--speed",
      (1.2+Math.random()*4)+"s"
    );

    star.style.setProperty(
      "--move",
      (3+Math.random()*8)+"s"
    );

    star.style.setProperty(
      "--dx",
      (-25+Math.random()*50)+"px"
    );

    star.style.setProperty(
      "--dy",
      (-25+Math.random()*50)+"px"
    );

    fragment.appendChild(star);
  }

  galaxy.appendChild(
    fragment
  );
}

createStars();


/* ==================================================
   ستاره های دنباله دار
================================================== */

function createComet(
  startX,
  startY,
  endX,
  endY,
  duration
){

  const comet =
    document.createElement("div");

  comet.className =
    "comet";

  comet.style.left =
    startX + "px";

  comet.style.top =
    startY + "px";

  galaxy.appendChild(
    comet
  );

  const startTime =
    performance.now();

  function move(now){

    const progress =
      (now-startTime) /
      duration;

    if(progress >= 1){

      comet.remove();

      setTimeout(
        () => {
          createComet(
            startX,
            startY,
            endX,
            endY,
            duration
          );
        },
        2000 +
        Math.random()*5000
      );

      return;
    }

    const ease =
      progress < .5
      ? 2*progress*progress
      : 1-
        Math.pow(
          -2*progress+2,
          2
        )/2;

    comet.style.left =
      (
        startX +
        (endX-startX)*ease
      ) + "px";

    comet.style.top =
      (
        startY +
        (endY-startY)*ease
      ) + "px";

    requestAnimationFrame(
      move
    );
  }

  requestAnimationFrame(
    move
  );
}


/* چند ستاره دنباله دار */

createComet(
  300,
  1200,
  4000,
  300,
  9000
);

createComet(
  7600,
  2500,
  3000,
  500,
  11000
);

createComet(
  800,
  7000,
  6500,
  6000,
  10000
);


/* ==================================================
   موزیک
================================================== */

const lightMusic =
  document.getElementById(
    "lightMusic"
  );

const musicButton =
  document.getElementById(
    "musicButton"
  );

let musicStarted =
  false;


/* صدای خیلی کم */

lightMusic.volume =
  0.12;


function startMusic(){

  if(musicStarted)
    return;

  lightMusic
    .play()
    .then(() => {

      musicStarted =
        true;

      musicButton.textContent =
        "♫";

    })

/* ==================================================
   پاکسازی URL
================================================== */

function safeUrl(url){

  if(
    !url ||
    typeof url !== "string"
  )
    return "";

  try{

    const parsed =
      new URL(url);

    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return parsed.href;
    }

  }catch(e){}

  return "";
}


/* ==================================================
   جلوگیری از HTML خطرناک
================================================== */

function escapeHtml(text){

  if(
    text === null ||
    text === undefined
  )
    return "";

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


/* ==================================================
   باز کردن یک پست
================================================== */

function openPost(post){

  const viewer =
    document.getElementById(
      "viewer"
    );

  const title =
    document.getElementById(
      "viewerTitle"
    );

  const content =
    document.getElementById(
      "viewerContent"
    );


  title.textContent =
    post.title || "";


  let html = "";


  if(post.content){

    html +=
      `<p>${escapeHtml(
        post.content
      )}</p>`;
  }


  const imageUrl =
    safeUrl(
      post.image_url
    );

  const videoUrl =
    safeUrl(
      post.video_url
    );

  const audioUrl =
    safeUrl(
      post.audio_url
    );


  if(imageUrl){

    html +=
      `<img
        src="${imageUrl}"
        alt=""
        loading="lazy">`;
  }


  if(videoUrl){

    html +=
      `<video
        controls
        playsinline
        src="${videoUrl}">
      </video>`;
  }


  if(audioUrl){

    html +=
      `<audio
        controls
        src="${audioUrl}">
      </audio>`;
  }


  content.innerHTML =
    html;


  viewer.classList.add(
    "show"
  );
}


/* ==================================================
   بستن پست
================================================== */

function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("show");

  document
    .getElementById("viewerContent")
    .innerHTML = "";
}

document

/* ==================================================
   100 قلب رنگی
================================================== */

function explodeHearts(event){

  const button =
    event.currentTarget;

  const rect =
    button.getBoundingClientRect();

  const startX =
    rect.left +
    rect.width/2;

  const startY =
    rect.top +
    rect.height/2;


  const colors = [

    "#ff3b81",
    "#ff4f4f",
    "#ff9f1c",
    "#ffe600",
    "#62e6ff",
    "#7c5cff",
    "#ff72ff",
    "#55ff9a",
    "#ffffff",
    "#ff68c4"

  ];


  for(
    let i=0;
    i<100;
    i++
  ){

    const heart =
      document.createElement(
        "span"
      );

    heart.className =
      "heart-particle";

    heart.textContent =
      "♥";


    heart.style.left =
      startX + "px";

    heart.style.top =
      startY + "px";


    heart.style.color =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    const angle =
      Math.random() *
      Math.PI *
      2;


    const distance =
      45 +
      Math.random()*260;


    const moveX =
      Math.cos(angle) *
      distance;


    const moveY =
      Math.sin(angle) *
      distance;


    heart.style.setProperty(
      "--x",
      moveX + "px"
    );


    heart.style.setProperty(
      "--y",
      moveY + "px"
    );


    heart.style.setProperty(
      "--r",
      (
        -180 +
        Math.random()*360
      ) + "deg"
    );


    heart.style.fontSize =
      (
        7 +
        Math.random()*9
      ) + "px";


    heart.style.animationDuration =
      (
        1.1 +
        Math.random()*.9
      ) + "s";


    document.body.appendChild(
      heart
    );


    setTimeout(
      () => {
        heart.remove();
      },
      2200
    );
  }
}
