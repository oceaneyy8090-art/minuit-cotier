<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   دوربین
========================================== */

const space =
document.getElementById("space");

const galaxy =
document.getElementById("galaxy");

let cameraX = 0;
let cameraY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let originalX = 0;
let originalY = 0;

function limitCamera(){

  const max = 4100;

  targetX =
    Math.max(
      -max,
      Math.min(max,targetX)
    );

  targetY =
    Math.max(
      -max,
      Math.min(max,targetY)
    );
}

function animateCamera(){

  cameraX +=
    (targetX-cameraX)*.12;

  cameraY +=
    (targetY-cameraY)*.12;

  galaxy.style.transform =
    `translate(
      calc(-50% + ${cameraX}px),
      calc(-50% + ${cameraY}px)
    )`;

  requestAnimationFrame(
    animateCamera
  );
}

animateCamera();


/* کشیدن با انگشت */

space.addEventListener(
  "pointerdown",
  e=>{

    dragging=true;

    space.classList.add("dragging");

    startX=e.clientX;
    startY=e.clientY;

    originalX=targetX;
    originalY=targetY;

    try{
      space.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

    startSweetMusic();
  }
);

space.addEventListener(
  "pointermove",
  e=>{

    if(!dragging) return;

    targetX =
      originalX+
      e.clientX-startX;

    targetY =
      originalY+
      e.clientY-startY;

    limitCamera();
  }
);

function stopDrag(e){

  dragging=false;

  space.classList.remove(
    "dragging"
  );

  try{
    space.releasePointerCapture(
      e.pointerId
    );
  }catch(err){}
}

space.addEventListener(
  "pointerup",
  stopDrag
);

space.addEventListener(
  "pointercancel",
  stopDrag
);


/* ==========================================
   ستاره ها
========================================== */

const colors=[
  "#ffffff",
  "#73ddff",
  "#b77cff",
  "#ff8fd9",
  "#ffe56a",
  "#6dffad",
  "#8eaaff"
];

for(let i=0;i<1000;i++){

  const star =
    document.createElement("div");

  star.className="star";

  star.textContent =
    Math.random()>.35
    ? "☆"
    : "✦";

  star.style.left =
    Math.random()*8800+"px";

  star.style.top =
    Math.random()*8800+"px";

  star.style.color =
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  star.style.fontSize =
    4+Math.random()*8+"px";

  star.style.setProperty(
    "--speed",
    1.5+Math.random()*5+"s"
  );

  star.style.setProperty(
    "--drift",
    4+Math.random()*9+"s"
  );

  star.style.setProperty(
    "--dx",
    -30+Math.random()*60+"px"
  );

  star.style.setProperty(
    "--dy",
    -30+Math.random()*60+"px"
  );

  galaxy.appendChild(star);
}


/* ==========================================
   شهاب ها
========================================== */

function comet(
  sx,sy,ex,ey,duration
){

  const el =
    document.createElement("div");

  el.className="comet";

  galaxy.appendChild(el);

  const start =
    performance.now();

  function move(now){

    const p =
      (now-start)/duration;

    if(p>=1){

      el.remove();

      setTimeout(
        ()=>{
          comet(
            sx,sy,ex,ey,duration
          );
        },
        3000+
        Math.random()*5000
      );

      return;
    }

    el.style.left =
      sx+(ex-sx)*p+"px";

    el.style.top =
      sy+(ey-sy)*p+"px";

    requestAnimationFrame(move);
  }

  requestAnimationFrame(move);
}

comet(
  200,900,
  4000,300,
  9000
);

comet(
  8500,1200,
  4500,800,
  10500
);

comet(
  300,7000,
  7000,4500,
  12000
);


/* ==========================================
   پخش پست ها
========================================== */

/*
   این مختصات مخصوص فضای باز هستند.
   هر پست یک جای متفاوت می‌گیرد.
*/

const postLocations=[

  {x:900,y:500},
  {x:2200,y:800},
  {x:3700,y:600},
  {x:5100,y:1100},
  {x:6500,y:1800},
  {x:1500,y:2200},
  {x:3100,y:1800},
  {x:4500,y:2300},
  {x:6000,y:2700},
  {x:800,y:3400},
  {x:2400,y:3300},
  {x:3900,y:3000},
  {x:5400,y:3800},
  {x:6800,y:4300},
  {x:1300,y:4800},
  {x:3000,y:4700},
  {x:4400,y:5000},
  {x:5800,y:5400},
  {x:7600,y:5800},
  {x:1800,y:6500},
  {x:3500,y:6400},
  {x:5000,y:6900},
  {x:6800,y:7100}

];

let posts=[];
let postPoints=[];

async function loadPosts(){

  const result =
    await db
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(result.error){

    console.log(
      "خطای posts:",
      result.error
    );

    return;
  }

  posts =
    result.data || [];

  postPoints=[];

  posts.forEach(
    (post,index)=>{

      const position =
        postLocations[
          index%postLocations.length
        ];

      const point =
        document.createElement(
          "div"
        );

      point.className=
        "post-point";

      point.style.left=
        position.x+"px";

      point.style.top=
        position.y+"px";

      point.dataset.index=index;

      point.addEventListener(
        "pointerdown",
        e=>{
          e.stopPropagation();
        }
      );

      point.addEventListener(
        "click",
        e=>{

          e.stopPropagation();

          openPost(post);

          currentGuideIndex=index;

          setGuide(
            position.x,
            position.y
          );
        }
      );

      galaxy.appendChild(point);

      postPoints.push({
        x:position.x,
        y:position.y,
        element:point,
        post:post
      });
    }
  );

  /*
    اگر پست وجود داشته باشد،
    ستاره راهنما از اولین پست شروع می‌کند.
  */

  if(postPoints.length){

    setGuide(
      postPoints[0].x,
      postPoints[0].y
    );

    setTimeout(
      guideJourney,
      1800
    );
  }
}


/* ==========================================
   ستاره راهنما
========================================== */

const guide =
document.getElementById("guide");

let currentGuideIndex=0;

function setGuide(x,y){

  guide.style.left=
    (x-35)+"px";

  guide.style.top=
    (y-35)+"px";
}


/*
   ⭐ به صورت خودکار
   از یک پست به پست بعدی می‌رود.
*/

function guideJourney(){

  if(!postPoints.length)
    return;

  postPoints.forEach(
    p=>{
      p.element.classList.remove(
        "active"
      );
    }
  );

  const current =
    postPoints[
      currentGuideIndex
    ];

  if(!current) return;

  current.element.classList.add(
    "active"
  );

  setGuide(
    current.x,
    current.y
  );

  showMessage(
    "⭐ یک پست جدید پیدا کردم"
  );

  setTimeout(
    ()=>{

      currentGuideIndex++;

      if(
        currentGuideIndex>=
        postPoints.length
      ){
        currentGuideIndex=0;
      }

      guideJourney();

    },
    6500
  );
}


/*
   با زدن ⭐
   دوربین به سمت همان پست می‌رود.
*/

guide.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    if(!postPoints.length)
      return;

    const current =
      postPoints[
        currentGuideIndex
      ];

    if(!current) return;

    centerOn(
      current.x,
      current.y
    );

    openPost(
      current.post
    );
  }
);


/* ==========================================
   بردن دوربین روی یک نقطه
========================================== */

function centerOn(x,y){

  const worldCenter=4500;

  targetX =
    worldCenter-x;

  targetY =
    worldCenter-y;

  limitCamera();
}


/* ==========================================
   پنجره پست
========================================== */

function safeUrl(value){

  if(!value)
    return "";

  try{

    const url=
      new URL(value);

    if(
      url.protocol==="https:" ||
      url.protocol==="http:"
    ){
      return url.href;
    }

  }catch(e){}

  return "";
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function openPost(post){

  const viewer =
    document.getElementById(
      "viewer"
    );

  const title =
    document.getElementById(
      "viewerTitle"
    );

  const content =
    document.getElementById(
      "viewerContent"
    );

  title.textContent =
    post.title || "✦";

  let html="";

  if(post.content){

    html +=
      `<p>${escapeHtml(
        post.content
      )}</p>`;
  }

  const image =
    safeUrl(post.image_url);

  const video =
    safeUrl(post.video_url);

  const audio =
    safeUrl(post.audio_url);

  if(image){

    html +=
      `<img
        src="${image}"
        alt="">`;
  }

  if(video){

    html +=
      `<video
        controls
        playsinline
        src="${video}">
      </video>`;
  }

  if(audio){

    html +=
      `<audio
        controls
        src="${audio}">
      </audio>`;
  }

  content.innerHTML=html;

  viewer.classList.add("show");
}

function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove(
      "show"
    );
}

document
  .getElementById("viewer")
  .addEventListener(
    "click",
    e=>{

      if(
        e.target.id==="viewer"
      ){
        closeViewer();
      }
    }
  );

function explodeHearts(event){

  const rect =
    event.currentTarget
      .getBoundingClientRect();

  const x =
    rect.left+
    rect.width/2;

  const y =
    rect.top+
    rect.height/2;

  const colors=[
    "#ff3b81",
    "#ff5a5a",
    "#ffb000",
    "#ffe600",
    "#61eaff",
    "#8a6cff",
    "#ff72e8",
    "#62ffad",
    "#fff"
  ];

  for(let i=0;i<100;i++){

    const h =
      document.createElement(
        "span"
      );

    h.className="heart";

    h.textContent="♥";

    h.style.left=x+"px";
    h.style.top=y+"px";

    h.style.color=
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    const angle=
      Math.random()*Math.PI*2;

    const distance=
      50+
      Math.random()*260;

    h.style.setProperty(
      "--x",
      Math.cos(angle)*distance+"px"
    );

    h.style.setProperty(
      "--y",
      Math.sin(angle)*distance+"px"
    );

    h.style.setProperty(
      "--r",
      -180+
      Math.random()*360+
      "deg"
    );

    h.style.fontSize=
      7+
      Math.random()*10+
      "px";

    document.body.appendChild(h);

    setTimeout(
      ()=>{
        h.remove();
      },
      1800
    );
  }
}

async function loadSettings(){

  const result =
    await db
      .from("site_settings")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(1);

  if(result.error){

    console.log(
      "settings:",
      result.error
    );

    return;
  }

  const data =
    result.data?.[0];

  if(!data)
    return;

  if(data.site_name){

    document.getElementById(
      "siteName"
    ).textContent=
      data.site_name;
  }

  if(data.bio){

    document.getElementById(
      "siteBio"
    ).textContent=
      data.bio;
  }

  if(data.image_url){

    document.getElementById(
      "profileImage"
    ).src=
      data.image_url;
  }
}


/* ==========================================
   موزیک شیرین و رویایی
========================================== */

let audioCtx=null;
let musicGain=null;
let musicTimer=null;
let musicStarted=false;

const melody=[
  261.63,
  329.63,
  392.00,
  329.63,
  293.66,
  349.23,
  440.00,
  349.23
];

let noteIndex=0;

function startSweetMusic(){

  if(musicStarted)
    return;

  musicStarted=true;

  try{

    audioCtx=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    musicGain=
      audioCtx.createGain();

    musicGain.gain.value=.025;

    musicGain.connect(
      audioCtx.destination
    );

    sweetNote();

    musicTimer=
      setInterval(
        sweetNote,
        900
      );

  }catch(e){

    console.log(e);
  }
}

function sweetNote(){

  if(!audioCtx || !musicGain)
    return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.value=
    melody[
      noteIndex%
      melody.length
    ];

  noteIndex++;

  const now=
    audioCtx.currentTime;

  gain.gain.setValueAtTime(
    0,
    now
  );

  gain.gain.linearRampToValueAtTime(
    .12,
    now+.12
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+.8
  );

  osc.connect(gain);
  gain.connect(musicGain);

  osc.start(now);

  osc.stop(
    now+.85
  );
}

document
  .getElementById("musicBtn")
  .addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      if(!musicStarted){

        startSweetMusic();

      }else{

        if(
          musicGain &&
          audioCtx
        ){

          if(
            musicGain.gain.value>0
          ){

            musicGain.gain.value=0;

            document
              .getElementById(
                "musicBtn"
              )
              .textContent="🔇";

          }else{

            musicGain.gain.value=.025;

            document
              .getElementById(
                "musicBtn"
              )
              .textContent="♫";
          }
        }
      }
    }
  );
