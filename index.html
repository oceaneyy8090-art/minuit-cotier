<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
font-family:tahoma;

background:#02020d;

}


/* فضای اصلی */

#space{

position:fixed;
inset:0;

overflow:hidden;

touch-action:none;

background:

radial-gradient(
circle at 30% 30%,
#38205f,
transparent 35%
),

radial-gradient(
circle at 80% 70%,
#251052,
transparent 40%
),

linear-gradient(
135deg,
#02020d,
#080827
);

}



/* جهان */

#galaxy{

position:absolute;

width:10000px;
height:10000px;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}



/* نورهای کهکشان */

.cloud{

position:absolute;

border-radius:50%;

filter:blur(100px);

opacity:.2;

}


.cloud.one{

width:2000px;
height:1200px;

left:500px;
top:600px;

background:#7b3cff;

}


.cloud.two{

width:1800px;
height:1200px;

left:5000px;
top:4000px;

background:#ff63c8;

}


.cloud.three{

width:1600px;
height:1000px;

left:2500px;
top:7000px;

background:#47dfff;

}




/* پنجره پست */


#viewer{

position:fixed;

inset:0;

display:none;

align-items:center;

justify-content:center;

background:

rgba(0,0,20,.85);

z-index:1000;

}



#viewer.show{

display:flex;

}



.card{

width:90%;

max-width:500px;

background:#151538;

padding:25px;

border-radius:25px;

color:white;

text-align:center;

}



.card img,
.card video{

width:100%;

border-radius:15px;

margin-top:15px;

}


.card audio{

width:100%;

margin-top:15px;

}


.close{

position:absolute;

top:20px;

right:20px;

font-size:30px;

color:white;

background:none;

border:0;

}



.like{

background:none;

border:0;

font-size:40px;

color:white;

margin-top:15px;

}



</style>

</head>


<body>


<div id="space">


<div id="galaxy">


<div class="cloud one"></div>

<div class="cloud two"></div>

<div class="cloud three"></div>


</div>


</div>



<div id="viewer">


<div class="card">


<button class="close">
×
</button>


<h2 id="postTitle">
💫
</h2>


<div id="postContent"></div>


<button class="like">
♡
</button>


</div>


</div>



<script>
// ===== حرکت داخل دنیا =====

const space = document.getElementById("space");
const galaxy = document.getElementById("galaxy");

let camX = 0;
let camY = 0;

let move = false;
let startX = 0;
let startY = 0;


space.addEventListener("pointerdown", e=>{

move = true;

startX = e.clientX;
startY = e.clientY;

});



space.addEventListener("pointermove", e=>{

if(!move) return;


camX += e.clientX - startX;
camY += e.clientY - startY;


startX = e.clientX;
startY = e.clientY;



galaxy.style.transform =

`translate(
calc(-50% + ${camX}px),
calc(-50% + ${camY}px)
)`;

});



space.addEventListener("pointerup",()=>{

move=false;

});





// ===== ستاره های رنگی =====

const starColors=[

"#bcecff",
"#ffd1ea",
"#d9c5ff",
"#fff0a5",
"#baffdd"

];


for(let i=0;i<1200;i++){


let star=document.createElement("div");


star.innerText =
Math.random()>0.5
?"☆"
:"✦";


star.style.position="absolute";

star.style.left =
Math.random()*9500+"px";


star.style.top =
Math.random()*9500+"px";


star.style.color =
starColors[
Math.floor(
Math.random()*starColors.length
)
];


star.style.fontSize =
(4+Math.random()*10)+"px";


star.style.textShadow =
"0 0 12px currentColor";


star.style.animation =
"blink "+(2+Math.random()*4)+"s infinite alternate";


galaxy.appendChild(star);


}





// ===== شهاب کوچک =====


function createComet(){


let c=document.createElement("div");


c.style.position="absolute";

c.style.width="8px";

c.style.height="8px";

c.style.borderRadius="50%";

c.style.background="white";


c.style.boxShadow=
"0 0 20px white,0 0 50px #5eeaff";



let x =
Math.random()*8000;


let y =
Math.random()*8000;


c.style.left=x+"px";

c.style.top=y+"px";


galaxy.appendChild(c);



let n=0;


let timer=setInterval(()=>{


n+=12;


c.style.transform=
`translate(${n}px,${n/2}px)`;


if(n>2500){

clearInterval(timer);

c.remove();

}


},30);


}



setInterval(
createComet,
5000
);





// ===== ظاهر شدن 💫 پست ها =====

function createPostStar(x,y,data){


let p=document.createElement("div");


p.innerHTML="💫";


p.style.position="absolute";

p.style.left=x+"px";

p.style.top=y+"px";

p.style.fontSize="30px";

p.style.cursor="pointer";


p.style.filter=
"drop-shadow(0 0 15px #ffe600)";



p.onclick=()=>{

showPost(data);

};



galaxy.appendChild(p);


}




// فعلاً تستی
// قسمت ۳ این را به Supabase وصل می‌کند
// ===== SUPABASE =====

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// ===== نمایش پست =====

function showPost(post){


document.getElementById("postTitle")
.innerText =
post.title || "💫";



let html="";


if(post.content){

html +=
`<p>${post.content}</p>`;

}



if(post.image_url){

html +=
`
<img src="${post.image_url}">
`;

}



if(post.video_url){

html +=
`
<video controls src="${post.video_url}">
</video>
`;

}



if(post.audio_url){

html +=
`
<audio controls src="${post.audio_url}">
</audio>
`;

}



document.getElementById("postContent")
.innerHTML =
html;



document
.getElementById("viewer")
.classList.add("show");


}



// بستن پست

document
.querySelector(".close")
.onclick=()=>{

document
.getElementById("viewer")
.classList.remove("show");

};





// ===== گرفتن پست ها =====

async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



data.forEach((post,index)=>{


// جای هر 💫 در دنیا

let x =
1000 +
(index*650);


let y =
900 +
((index%5)*900);



createPostStar(
x,
y,
post
);



});


}



loadPosts();



// ===== افکت قلب =====

document
.querySelector(".like")
.onclick=()=>{


for(let i=0;i<100;i++){


let h=document.createElement("span");


h.innerText="♥";


h.className="heart";


h.style.position="fixed";

h.style.left="50%";

h.style.top="50%";


h.style.color=
[
"#ff8fcf",
"#ffd36a",
"#8fe9ff",
"#c7a0ff"
]
[
Math.floor(Math.random()*4)
];



h.style.fontSize=
(8+Math.random()*15)+"px";


h.style.setProperty(
"--x",
(-200+Math.random()*400)+"px"
);


h.style.setProperty(
"--y",
(-200+Math.random()*400)+"px"
);


document.body.appendChild(h);


setTimeout(()=>{

h.remove();

},1500);



}


};
</script>

</body>
</html>
