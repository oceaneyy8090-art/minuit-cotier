<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☆ Minuit côtier ☆</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#30206b,transparent 35%),
    radial-gradient(circle at 80% 80%,#182d67,transparent 35%),
    linear-gradient(135deg,#050716,#0d1230,#17104a);
}

#stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  color:white;
  opacity:.7;
  text-shadow:0 0 8px #fff;
  animation:fall linear infinite;
}

@keyframes fall{
  from{
    transform:translateY(-30px) rotate(0deg);
  }
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

.container{
  position:relative;
  z-index:2;
  width:min(94%,700px);
  margin:auto;
  padding:30px 0 60px;
}

.profile{
  text-align:center;
  padding:25px 15px;
}

.profile img{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid rgba(255,255,255,.7);
  box-shadow:0 0 30px rgba(150,100,255,.5);
}

.profile h1{
  margin:15px 0 5px;
  font-size:28px;
  font-style:italic;
}

.profile p{
  color:#c9c5e8;
  margin:8px 0;
}

.card{
  background:rgba(12,15,45,.78);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
  backdrop-filter:blur(12px);
}

.post-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.post-text{
  color:#ddd;
  line-height:2;
}

.post img{
  width:100%;
  border-radius:16px;
  margin-top:12px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:30px 10px;
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container">

  <div class="profile">
    <img id="profileImage" src="" alt="Minuit côtier">
    <h1 id="siteName">☆ Minuit côtier ☆</h1>
    <p id="siteBio">ساحلِ نیمه‌شب</p>
  </div>

  <div id="posts">
    <div class="empty">در حال دریافت پست‌ها... ☆</div>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ستاره‌ها */

const starsBox =
document.getElementById("stars");

for(let i=0;i<90;i++){

  const star =
  document.createElement("span");

  star.className="star";
  star.innerText="☆";

  star.style.left =
  Math.random()*100+"%";

  star.style.top =
  Math.random()*100+"%";

  star.style.fontSize =
  (Math.random()*7+5)+"px";

  star.style.animationDuration =
  (Math.random()*8+7)+"s";

  star.style.animationDelay =
  Math.random()*8+"s";

  starsBox.appendChild(star);
}


/* تنظیمات سایت */

async function loadSettings(){

  const {data,error} =
  await db
  .from("site_settings")
  .select("site_name,bio,image_url")
  .limit(1);

  if(error){
    console.log(error.message);
    return;
  }

  if(!data || !data.length){
    return;
  }

  const settings =
  data[0];

  if(settings.site_name){
    document.getElementById("siteName")
      .innerText =
      "☆ "+settings.site_name+" ☆";
  }

  if(settings.bio){
    document.getElementById("siteBio")
      .innerText =
      settings.bio;
  }

  if(settings.image_url){
    document.getElementById("profileImage")
      .src =
      settings.image_url;
  }
}


/* پست‌ها */

async function loadPosts(){

  const box =
  document.getElementById("posts");

  const {data,error} =
  await db
  .from("posts")
  .select("*")
  .order("created_at",{
    ascending:false
  });

  if(error){

    box.innerHTML =
      '<div class="empty">خطا در دریافت پست‌ها ❌</div>';

    console.log(error.message);

    return;
  }

  if(!data || !data.length){

    box.innerHTML =
      '<div class="empty">هنوز پستی منتشر نشده ☆</div>';

    return;
  }

  box.innerHTML="";

  data.forEach(post=>{

    const div =
    document.createElement("div");

    div.className="card post";

    let html="";

    html +=
      '<div class="post-title">'+
      escapeHtml(post.title || "بدون عنوان")+
      '</div>';

    if(post.content){

      html +=
        '<div class="post-text">'+
        escapeHtml(post.content)
          .replace(/\n/g,"<br>")+
        '</div>';
    }

    if(post.image_url){

      html +=
        '<img src="'+
        escapeHtml(post.image_url)+
        '" alt="post">';
    }

    div.innerHTML=html;

    box.appendChild(div);
  });
}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* شروع */

loadSettings();
loadPosts();

</script>

</body>
</html>
