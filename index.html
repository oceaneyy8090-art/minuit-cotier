<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const SITE_URL =
"https://oceaneyy8090-art.github.io/minuit-cotier/";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   CANVAS
===================================== */

const canvas =
document.getElementById("sky");

const ctx =
canvas.getContext("2d",{alpha:false});

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(
            devicePixelRatio || 1,
            1.25
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* =====================================
   تنظیمات پیش‌فرض
===================================== */

let settings = {

    pathEmoji:"☆",

    postEmoji:"🌛",

    titleEmoji:"💫"
};


/* =====================================
   دوربین
===================================== */

let camX = 0;
let camY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let startCamX = 0;
let startCamY = 0;

let downX = 0;
let downY = 0;


/* =====================================
   رنگ ستاره‌ها
===================================== */

const colors = [

    "#ffffff",
    "#ffd5ef",
    "#ff9ed6",
    "#ffb8e5",
    "#d3baff",
    "#b59cff",
    "#a9d9ff",
    "#78c8ff",
    "#9df3ff",
    "#e3c8ff",
    "#f4b9ff",
    "#c5ffe3"
];


/* =====================================
   ستاره‌های پس‌زمینه
===================================== */

const WORLD = 24000;

const stars = [];

for(let i=0;i<850;i++){

    stars.push({

        x:
            (Math.random()-.5) *
            WORLD,

        y:
            (Math.random()-.5) *
            WORLD,

        size:
            10 +
            Math.random()*4,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ],

        vx:
            (Math.random()-.5)*.4,

        vy:
            (Math.random()-.5)*.4,

        phase:
            Math.random() *
            Math.PI * 2
    });
}


/* =====================================
   پست‌ها
===================================== */

let posts = [];

let activePost = null;


/* =====================================
   جای پست
===================================== */

function getPostPosition(
    id,
    index
){

    const n =
        Number(id) ||
        index+1;

    const angle =
        n *
        2.399963229728653;

    const radius =
        480 +
        Math.sqrt(index) *
        650;

    return {

        x:
            Math.cos(angle) *
            radius,

        y:
            Math.sin(angle) *
            radius
    };
}


/* =====================================
   بارگذاری پست‌ها
===================================== */

async function loadPosts(){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts?select=*&order=created_at.asc",

                {
                    headers:{
                        apikey:
                            SUPABASE_KEY,

                        Authorization:
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );

        if(!response.ok)
            return;

        const data =
            await response.json();

        posts =
            data.map(
                (item,index)=>{

                    const pos =
                        getPostPosition(
                            item.id,
                            index
                        );

                    return {

                        id:
                            item.id,

                        x:
                            pos.x,

                        y:
                            pos.y,

                        title:
                            item.title ||
                            item.Title ||
                            "بدون عنوان",

                        text:
                            item.content ||
                            "",

                        image_url:
                            item.image_url ||
                            "",

                        video_url:
                            item.video_url ||
                            "",

                        music_url:
                            item.music_url ||
                            ""
                    };
                }
            );

    }catch(error){

        console.error(error);
    }
}


/* =====================================
   مسیر بین پست‌ها
   بدون هیچ حلقه‌ای دور ماه
===================================== */

function drawMoonPath(time){

    if(posts.length === 0)
        return;

    const points = [

        {
            x:W/2,
            y:H/2
        }

    ];

    for(let i=0;i<posts.length;i++){

        points.push({

            x:
                posts[i].x -
                camX +
                W/2,

            y:
                posts[i].y -
                camY +
                H/2
        });
    }

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for(
        let p=0;
        p<points.length-1;
        p++
    ){

        const a =
            points[p];

        const b =
            points[p+1];

        const dx =
            b.x-a.x;

        const dy =
            b.y-a.y;

        const distance =
            Math.hypot(
                dx,
                dy
            );

        const count =
            Math.max(
                7,
                Math.floor(
                    distance/34
                )
            );

        const len =
            distance || 1;

        const nx =
            -dy/len;

        const ny =
            dx/len;

        for(
            let j=1;
            j<count;
            j++
        ){

            const t =
                j/count;

            let x =
                a.x + dx*t;

            let y =
                a.y + dy*t;

            const wave =
                Math.sin(
                    t*Math.PI*3 +
                    p +
                    time*.001
                ) * 10;

            x += nx*wave;
            y += ny*wave;

            ctx.globalAlpha =
                .7 +
                Math.sin(
                    time*.002+j
                )*.15;

            ctx.fillStyle =
                colors[
                    (j+p) %
                    colors.length
                ];

            ctx.font =
                "13px Arial";

            ctx.fillText(
                settings.pathEmoji || "☆",
                x,
                y
            );
        }
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   پروفایل کوچک وسط
   فقط یک نمایش کوچک
===================================== */

function drawProfile(){

    const x =
        W/2;

    const y =
        H/2;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    const avatar =
        window.currentAvatar;

    if(
        avatar &&
        window.profileImage &&
        window.profileImage.complete
    ){

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            27,
            0,
            Math.PI*2
        );

        ctx.clip();

        ctx.drawImage(
            window.profileImage,
            x-27,
            y-27,
            54,
            54
        );

        ctx.restore();

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.65)";

        ctx.lineWidth = 2;

        ctx.stroke();

    }else{

        ctx.font =
            "28px Arial";

        ctx.fillText(
            "🌛",
            x,
            y
        );
    }

    ctx.font =
        "14px Arial";

    ctx.fillStyle =
        "#fff";

    ctx.globalAlpha =
        .85;

    ctx.fillText(
        "Minuit côtier",
        x,
        y+48
    );

    ctx.globalAlpha = 1;
}


/* =====================================
   پست‌ها
   هیچ ستاره‌ای دورشان نیست
===================================== */

function drawPosts(){

    ctx.textAlign =

    ctx.textBaseline =
        "middle";

    for(
        const post of posts

        const x =
            post.x -
            camX +

        const y =
            post.y -
            camY +
            H/2;

        if(
            x < -70 ||
            x > W+70 ||
            y < -70 ||
            y > H+70
        )
            continue;

        ctx.font =
            "30px Arial";

        ctx.shadowColor =
            "rgba(255,255,255,.7)";

        ctx.shadowBlur = 8;

        ctx.fillText(
            settings.postEmoji || "🌛",
            x,
            y
        );

        ctx.shadowBlur = 0;

        /* عنوان کوچک زیر پست */

        ctx.font =
            "12px Arial";

        ctx.fillStyle =
            "#fff";

        ctx.globalAlpha =
            .8;

        ctx.fillText(

            (settings.titleEmoji || "💫") +
            " " +
            post.title,

            x,
            y+30
        );

        ctx.globalAlpha = 1;
    }
}


/* =====================================
   ستاره‌های لایک
   دقیقاً 100 تا
===================================== */

const likeStars = [];

function createLikeStars(){

    if(!activePost)
        return;

    const x =
        activePost.x -
        camX +
        W/2;

    const y =
        activePost.y -
        camY +
        H/2;

    for(let i=0;i<100;i++){

        const angle =
            Math.random() *
            Math.PI*2;

        const speed =
            1.5 +
            Math.random()*4;

        likeStars.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                12 +
                Math.random()*5,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],

            life:
                100 +
                Math.random()*100
        });
    }
}

function drawLikeStars(){

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for(
        let i=likeStars.length-1;
        i>=0;
        i--
    ){

        const s =
            likeStars[i];

        s.x += s.vx;
        s.y += s.vy;

        s.vx *= .998;
        s.vy *= .998;

        s.life--;

        if(s.life<=0){

            likeStars.splice(
                i,
                1
            );

            continue;
        }

        ctx.globalAlpha =
            Math.min(
                1,
                s.life/35
            );

        ctx.fillStyle =
            s.color;

        ctx.shadowColor =
            s.color;

        ctx.shadowBlur = 5;

        ctx.font =
            `${s.size}px Arial`;

        ctx.fillText(
            "☆",
            s.x,
            s.y
        );

        ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   پس‌زمینه
===================================== */

function drawBackground(){

    ctx.fillStyle =
        "#02020a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================
   ستاره‌های زمینه
===================================== */

function drawStars(time){

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for(
        const s of stars
    ){

        s.x += s.vx;
        s.y += s.vy;

        if(s.x>WORLD/2)
            s.x=-WORLD/2;

        if(s.x<-WORLD/2)
            s.x=WORLD/2;

        if(s.y>WORLD/2)
            s.y=-WORLD/2;

        if(s.y<-WORLD/2)
            s.y=WORLD/2;

        const x =
            s.x -
            camX +
            W/2;

        const y =
            s.y -
            camY +
            H/2;

        if(
            x<-30 ||
            x>W+30 ||
            y<-30 ||
            y>H+30
        )
            continue;

        ctx.globalAlpha =
            .78 +
            Math.sin(
                time*.002+s.phase
            )*.12;

        ctx.fillStyle =
            s.color;

        ctx.font =
            `${s.size}px Arial`;

        ctx.fillText(
            "☆",
            x,
            y
        );
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   لمس پست
===================================== */

function findPost(x,y){

    for(
        let i=posts.length-1;
        i>=0;
        i--
    ){

        const p =
            posts[i];

        const px =
            p.x -
            camX +
            W/2;

        const py =
            p.y -
            camY +
            H/2;

        if(
            Math.hypot(
                x-px,
                y-py
            ) < 65
        )
            return p;
    }

    return null;
}


canvas.addEventListener(
    "pointerdown",
    e=>{

        downX =
            e.clientX;

        downY =
            e.clientY;

        dragging = true;

        startX =
            e.clientX;

        startY =
            e.clientY;

        startCamX =
            camX;

        startCamY =
            camY;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;

        const dx =
            e.clientX-startX;

        const dy =
            e.clientY-startY;

        targetX =
            startCamX -
            dx*1.5;

        targetY =
            startCamY -
            dy*1.5;
    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const distance =
            Math.hypot(
                e.clientX-downX,
                e.clientY-downY
            );

        dragging=false;

        if(distance<12){

            const post =
                findPost(
                    e.clientX,
                    e.clientY
                );

            if(post)
                openPost(post);
        }
    }
);

/* =====================================

===================================== */

document.getElementById(
    "saveProfile"
).onclick =
async function(){

    const {data} =
        await supabaseClient.auth.getUser();

    const user =
        data.user;

    if(!user)
        return;

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();

    const bio =
        document.getElementById(
            "bioInput"
        ).value.trim();

    const fileInput =
        document.getElementById(
            "avatarFile"
        );

    const message =
        document.getElementById(
            "avatarMessage"
        );

    let avatar =
        user.user_metadata?.avatar_url ||
        "";

    if(
        fileInput.files &&
        fileInput.files.length
    ){

        const file =
            fileInput.files[0];

        if(
            !file.type.startsWith("image/")
        ){

            message.textContent =
                "این فایل عکس نیست.";

            return;
        }

        if(
            file.size >
            5*1024*1024
        ){

            message.textContent =
                "حجم عکس باید کمتر از ۵ مگابایت باشد.";

            return;
        }

        message.textContent =
            "در حال آپلود عکس...";

        const extension =
            (
                file.name.split(".").pop() ||
                "jpg"
            ).toLowerCase();

        const path =
            "profiles/" +
            user.id +
            "_" +
            Date.now() +
            "." +
            extension;

        const {error} =
            await supabaseClient
            .storage
            .from("Minuit cotier")
            .upload(
                path,
                file,
                {
                    upsert:true,
                    contentType:
                        file.type
                }
            );

        if(error){

            message.textContent =
                "آپلود نشد: " +
                error.message;

            return;
        }

        const {data:urlData} =
            supabaseClient
            .storage
            .from("Minuit cotier")
            .getPublicUrl(path);

        avatar =
            urlData.publicUrl;
    }

    const {error} =
        await supabaseClient.auth.updateUser({

            data:{

                name,
                bio,

                avatar_url:
                    avatar
            }
        });

    if(error){

        message.textContent =
            error.message;

        return;
    }

    await loadProfile();

    fileInput.value = "";

    message.textContent =
        "پروفایل ذخیره شد ☆";
};

/* تغییر زبان */

function setLanguage(language){

    if(
        language !== "fa" &&
        language !== "en"
    )
        return;

    currentLanguage =
        language;

    localStorage.setItem(
        "minuit_language",
        language
    );

    applyLanguage();
}

/* =========================
   ❤️ لایک + 💬 کامنت
========================= */

const engagementBox = document.createElement("div");

engagementBox.id = "engagementBox";

engagementBox.style.cssText = `
    margin-top:15px;
    padding:12px;
    border-radius:18px;
    background:rgba(10,8,35,.75);
    color:white;
    font-family:Arial;
`;

async function loadEngagement(post){

    engagementBox.innerHTML = `
        <div style="display:flex;gap:10px;align-items:center">

            <button id="realLikeButton"
            style="
                border:0;
                background:rgba(255,255,255,.1);
                color:white;
                border-radius:14px;
                padding:9px 14px;
                font-size:17px;
            ">
            ❤️ لایک
            </button>

            <span id="likeCount">0 لایک</span>

        </div>

        <div style="margin-top:15px">
            <input id="commentInput"
            placeholder="یه چیزی بگو..."
            style="
                width:70%;
                padding:10px;
                border:0;
                border-radius:12px;
                outline:none;
            ">

            <button id="sendComment"
            style="
                padding:10px;
                border:0;
                border-radius:12px;
                background:#6d5cff;
                color:white;
            ">
            بفرست
            </button>
        </div>

        <div id="commentsList"
        style="margin-top:15px"></div>
    `;

    const postWindow =
        document.getElementById("postWindow");

    if(postWindow){
        postWindow.appendChild(engagementBox);
    }

    await refreshLikes(post);
    await refreshComments(post);

    document.getElementById("realLikeButton").onclick =
    async function(){

        const user =
            supabaseClient.auth.getUser
            ? (await supabaseClient.auth.getUser()).data.user
            : null;

        if(!user){
            alert("اول وارد حسابت شو ❤️");
            return;
        }

        const name =
            user.user_metadata?.full_name ||
            user.user_metadata?.name ||
            user.email?.split("@")[0] ||
            "کاربر";

        const { error } =
            await supabaseClient
            .from("likes")
            .insert({
                post_id: post.id,
                user_id: user.id,
                visitor_name: name
            });

        if(!error){

            /*
              ❤️ افکت ستاره‌ای قبلیت دست‌نخورده می‌مونه.
              اگر تابع افکت قبلی‌ات موجود باشه اجرا میشه.
            */

            if(typeof createLikeStars === "function"){
                createLikeStars(post);
            }

            await refreshLikes(post);

        }else{

            if(
                error.code === "23505"
            ){
                alert("قبلاً این پست رو لایک کردی ❤️");
            }else{
                console.log(error);
            }
        }
    };

    document.getElementById("sendComment").onclick =
    async function(){

        const input =
            document.getElementById("commentInput");

        const message =
            input.value.trim();

        if(!message) return;

        const user =
            supabaseClient.auth.getUser
            ? (await supabaseClient.auth.getUser()).data.user
            : null;

        if(!user){
            alert("اول وارد حسابت شو ❤️");
            return;
        }

        const name =
            user.user_metadata?.full_name ||
            user.user_metadata?.name ||
            user.email?.split("@")[0] ||
            "کاربر";

        const { error } =
            await supabaseClient
            .from("comments")
            .insert({
                post_id: post.id,
                user_id: user.id,
                message: message,
                visitor_name: name
            });

        if(!error){

            input.value = "";

            await refreshComments(post);

        }else{

            console.log(error);
            alert("کامنت ارسال نشد 😭");
        }
    };
}


/* ❤️ تعداد لایک‌ها */

async function refreshLikes(post){

    const { data, error } =
        await supabaseClient
        .from("likes")
        .select("id,visitor_name")
        .eq("post_id", post.id);

    if(error) return;

    const count =
        document.getElementById("likeCount");

    if(count){
        count.innerText =
            `${data.length} لایک`;
    }
}


/* 💬 نمایش کامنت‌ها */

async function refreshComments(post){

    const list =
        document.getElementById("commentsList");

    if(!list) return;

    const { data, error } =
        await supabaseClient
        .from("comments")
        .select("visitor_name,message,created_at")
        .eq("post_id", post.id)
        .order("created_at",{ascending:true});

    if(error) return;

    list.innerHTML = "";

    data.forEach(comment => {

        const item =
            document.createElement("div");

        item.style.cssText = `
            margin-bottom:8px;
            padding:9px;
            border-radius:12px;
            background:rgba(255,255,255,.07);
        `;

        item.innerHTML = `
            <b>♡ ${escapeHtml(comment.visitor_name || "کاربر")}</b>
            <div style="margin-top:4px">
                ${escapeHtml(comment.message)}
            </div>
        `;

        list.appendChild(item);
    });
}


/* جلوگیری از HTML داخل کامنت */

function escapeHtml(text){

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* وصل کردن لایک و کامنت به پست بازشده */

const oldOpenPost =
    window.openPost;

window.openPost =
async function(post){

    oldOpenPost(post);

    setTimeout(function(){

        loadEngagement(post);

    },100);
};
