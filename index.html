<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    background:#000;
}

/* پنجره پست */
#postWindow{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(88%,420px);
    max-height:80vh;
    overflow:auto;
    background:rgba(8,8,15,.97);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:22px;
    box-sizing:border-box;
    color:white;
    text-align:center;
    z-index:20;
    box-shadow:0 0 35px rgba(160,120,255,.25);
}

#postWindow h2{
    margin:5px 0 15px;
    font-size:23px;
}

#postText{
    color:#ddd;
    line-height:1.8;
    white-space:pre-wrap;
}

#postMedia img{
    max-width:100%;
    max-height:300px;
    border-radius:16px;
    margin-top:15px;
}

#postMedia video{
    width:100%;
    max-height:300px;
    border-radius:16px;
    margin-top:15px;
}

#postMedia audio{
    width:100%;
    margin-top:15px;
}

#closePost{
    position:absolute;
    top:10px;
    right:12px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#171722;
    color:white;
    font-size:20px;
}

#likeButton{
    margin-top:20px;
    width:64px;
    height:52px;
    border:0;
    border-radius:18px;
    background:#15151f;
    color:white;
    font-size:30px;
}

#likeButton.liked{
    color:#ff4fa3;
    text-shadow:0 0 12px #ff4fa3,0 0 25px #ff4fa3;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<div id="postWindow">

    <button id="closePost">×</button>

    <h2 id="postTitle"></h2>

    <div id="postText"></div>

    <div id="postMedia"></div>

    <button id="likeButton">♡</button>

</div>

<script>

/* ==================================================
   Supabase
================================================== */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


/* ==================================================
   Canvas
================================================== */

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    const dpr=Math.min(devicePixelRatio||1,1.5);

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


/* ==================================================
   دوربین
================================================== */

let camX=0;
let camY=0;

let targetX=0;
let targetY=0;

let dragging=false;

let startX=0;
let startY=0;

let startCamX=0;
let startCamY=0;


/* ==================================================
   رنگ‌ها
================================================== */

const colors=[
    "#ffffff",
    "#ffd5ef",
    "#ff9ed6",
    "#ffb8e5",
    "#d3baff",
    "#b59cff",
    "#a9d9ff",
    "#78c8ff",
    "#9df3ff",
    "#e3c8ff",
    "#f4b9ff",
    "#c5ffe3"
];


/* ==================================================
   آسمان
================================================== */

const WORLD=24000;
const stars=[];

for(let i=0;i<3000;i++){

    stars.push({

        x:(Math.random()-.5)*WORLD,
        y:(Math.random()-.5)*WORLD,

        size:13+Math.random()*4,

        color:
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ],

        vx:(Math.random()-.5)*.8,
        vy:(Math.random()-.5)*.8,

        phase:
            Math.random()*Math.PI*2
    });
}


/* ==================================================
   پست‌ها
================================================== */

let posts=[];


/* ==================================================
   جای پست‌ها
   هر پست یک جای ثابت در آسمان دارد
================================================== */

function getPostPosition(id,index){

    const n=Number(id)||index+1;

    const angle=
        n*2.399963229728653;

    const radius=
        500+
        Math.sqrt(index)*650;

    return {

        x:
            Math.cos(angle)*radius,

        y:
            Math.sin(angle)*radius

    };
}


/* ==================================================
   گرفتن پست‌ها از Supabase
================================================== */

async function loadPosts(){

    try{

        const response=await fetch(
            SUPABASE_URL+
            "/rest/v1/posts?select=*&order=created_at.asc",
            {
                method:"GET",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer "+SUPABASE_KEY
                }
            }
        );


        if(!response.ok){

            const errorText=
                await response.text();

            console.error(
                "Supabase error:",
                errorText
            );

            return;
        }


        const data=
            await response.json();


        posts=data.map(
            (item,index)=>{

                const position=
                    getPostPosition(
                        item.id,
                        index
                    );


                return {

                    id:item.id,

                    x:position.x,

                    y:position.y,

                    title:
                        item.title ||
                        item.Title ||
                        "بدون عنوان 🌛",

                    text:
                        item.content ||
                        "",

                    image_url:
                        item.image_url ||
                        "",

                    video_url:
                        item.video_url ||
                        "",

                    music_url:
                        item.music_url ||
                        "",

                    created_at:
                        item.created_at || ""
                };
            }
        );


        createButterflies();


        console.log(
            "Posts loaded:",
            posts
        );

    }catch(error){

        console.error(
            "خطا در دریافت پست‌ها:",
            error
        );
    }
}


/* ==================================================
   پروانه‌ها
================================================== */

const butterflies=[];


function createButterflies(){

    butterflies.length=0;

    for(const post of posts){

        const formation=[

            {x:0,y:-175},

            {x:-85,y:-85},
            {x:85,y:-85},

            {x:-150,y:15},
            {x:-50,y:15},
            {x:50,y:15},
            {x:150,y:15}

        ];


        for(let i=0;i<formation.length;i++){

            butterflies.push({

                postId:post.id,

                index:i,

                baseX:formation[i].x,
                baseY:formation[i].y,

                phase:
                    Math.random()*Math.PI*2,

                phase2:
                    Math.random()*Math.PI*2,

                speed:
                    0.000025+
                    Math.random()*0.000015,

                size:
                    17+
                    Math.random()*3,

                color:[
                    "#ffd6f6",
                    "#ff9edc",
                    "#c9a8ff",
                    "#9edcff",
                    "#b8f5ff",
                    "#f4c8ff",
                    "#ffffff"
                ][i]
            });
        }
    }
}


/* ==================================================
   رسم پروانه‌ها
================================================== */

function drawButterflies(time){

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const b of butterflies){

        const post=posts.find(
            p=>p.id===b.postId
        );

        if(!post) continue;


        const orbit=
            time*b.speed+
            b.phase;


        const radius=115;


        let centerX=
            Math.cos(orbit)*radius;

        let centerY=
            Math.sin(orbit)*radius;


        centerX+=
            Math.sin(
                time*0.00045+
                b.phase2
            )*15;


        centerY+=
            Math.cos(
                time*0.0004+
                b.phase
            )*15;


        const rotation=
            Math.sin(
                time*0.00025+
                b.phase
            )*0.18;


        const cosR=Math.cos(rotation);
        const sinR=Math.sin(rotation);


        const localX=
            b.baseX+
            Math.sin(
                time*0.0007+
                b.phase
            )*9;


        const localY=
            b.baseY+
            Math.cos(
                time*0.0006+
                b.phase2
            )*8;


        const rotatedX=
            localX*cosR-
            localY*sinR;

        const rotatedY=
            localX*sinR+
            localY*cosR;


        const worldX=
            post.x+
            centerX+
            rotatedX;

        const worldY=
            post.y+
            centerY+
            rotatedY;


        const x=
            worldX-
            camX+
            W/2;

        const y=
            worldY-
            camY+
            H/2;


        if(
            x<-100 ||
            x>W+100 ||
            y<-100 ||
            y>H+100
        ){
            continue;
        }


        const flap=
            Math.sin(
                time*0.006+
                b.phase
            );


        const size=
            b.size+
            flap*1.2;


        ctx.globalAlpha=.9;

        ctx.fillStyle=b.color;

        ctx.shadowColor=b.color;

        ctx.shadowBlur=7;

        ctx.font=
            `${size}px Arial`;

        ctx.fillText(
            "🦋",
            x,
            y
        );

        ctx.shadowBlur=0;
    }

    ctx.globalAlpha=1;
}


/* ==================================================
   ماه‌های پست
================================================== */

function drawPosts(){

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const post of posts){

        const x=
            post.x-
            camX+
            W/2;

        const y=
            post.y-
            camY+
            H/2;


        if(
            x<-80 ||
            x>W+80 ||
            y<-80 ||
            y>H+80
        ){
            continue;
        }


        ctx.font="34px Arial";

        ctx.shadowColor="#fff";

        ctx.shadowBlur=9;

        ctx.fillText(
            "🌛",
            x,
            y
        );

        ctx.shadowBlur=0;
    }
}


/* ==================================================
   ستاره‌های لایک — دقیقاً 100 عدد
================================================== */

const likeStars=[];


function createLikeStars(){

    if(!activePost) return;


    const startX=
        activePost.x-
        camX+
        W/2;


    const startY=
        activePost.y-
        camY+
        H/2;


    for(let i=0;i<100;i++){

        const angle=
            Math.random()*Math.PI*2;


        const speed=
            1.5+
            Math.random()*4;


        likeStars.push({

            x:startX,
            y:startY,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            size:
                13+
                Math.random()*5,

            color:
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ],

            life:
                100+
                Math.random()*100
        });
    }
}


function drawLikeStars(){

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    for(
        let i=likeStars.length-1;
        i>=0;
        i--
    ){

        const s=likeStars[i];

        s.x+=s.vx;
        s.y+=s.vy;

        s.vx*=.998;
        s.vy*=.998;

        s.life--;


        if(s.life<=0){

            likeStars.splice(i,1);

            continue;
        }


        ctx.globalAlpha=
            Math.min(1,s.life/35);

        ctx.fillStyle=s.color;

        ctx.shadowColor=s.color;

        ctx.shadowBlur=5;

        ctx.font=
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            s.x,
            s.y
        );


        ctx.shadowBlur=0;
    }


    ctx.globalAlpha=1;
}


/* ==================================================
   پس‌زمینه
================================================== */

function drawBackground(){

    ctx.fillStyle="#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* ==================================================
   ستاره‌ها
================================================== */

function drawStars(time){

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    for(const s of stars){

        s.x+=s.vx;
        s.y+=s.vy;


        if(s.x>WORLD/2)
            s.x=-WORLD/2;

        if(s.x<-WORLD/2)
            s.x=WORLD/2;

        if(s.y>WORLD/2)
            s.y=-WORLD/2;

        if(s.y<-WORLD/2)
            s.y=WORLD/2;


        const x=
            s.x-
            camX+
            W/2;


        const y=
            s.y-
            camY+
            H/2;


        if(
            x<-40 ||
            x>W+40 ||
            y<-40 ||
            y>H+40
        ){
            continue;
        }


        const alpha=
            .88+
            Math.sin(
                time*.002+
                s.phase
            )*.10;


        ctx.globalAlpha=alpha;

        ctx.fillStyle=s.color;

        ctx.shadowColor=s.color;

        ctx.shadowBlur=5;

        ctx.font=
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            x,
            y
        );


        ctx.shadowBlur=0;
    }


    ctx.globalAlpha=1;
}


/* ==================================================
   پیدا کردن پست
================================================== */

let activePost=null;


function findPost(x,y){

    for(
        let i=posts.length-1;
        i>=0;
        i--
    ){

        const post=posts[i];


        const px=
            post.x-
            camX+
            W/2;


        const py=
            post.y-
            camY+
            H/2;


        if(
            Math.hypot(
                x-px,
                y-py
            )<52
        ){
            return post;
        }
    }


    return null;
}


/* ==================================================
   لمس
================================================== */

let downX=0;
let downY=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        downX=e.clientX;
        downY=e.clientY;

        dragging=true;

        startX=e.clientX;
        startY=e.clientY;

        startCamX=camX;
        startCamY=camY;


        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging) return;


        const dx=
            e.clientX-startX;


        const dy=
            e.clientY-startY;


        targetX=
            startCamX-
            dx*1.5;


        targetY=
            startCamY-
            dy*1.5;
    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const distance=
            Math.hypot(
                e.clientX-downX,
                e.clientY-downY
            );


        dragging=false;


        if(distance<12){

            const post=
                findPost(
                    e.clientX,
                    e.clientY
                );


            if(post)
                openPost(post);
        }


        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}
    }
);


/* ==================================================
   باز کردن پست
================================================== */

function openPost(post){

    activePost=post;


    document.getElementById(
        "postTitle"
    ).textContent=
        post.title;


    document.getElementById(
        "postText"
    ).textContent=
        post.text;


    const media=
        document.getElementById(
            "postMedia"
        );


    media.innerHTML="";


    /* عکس */

    if(post.image_url){

        const img=
            document.createElement("img");

        img.src=post.image_url;

        img.alt="تصویر پست";

        media.appendChild(img);
    }


    /* ویدیو */

    if(post.video_url){

        const video=
            document.createElement("video");

        video.src=post.video_url;

        video.controls=true;

        video.playsInline=true;

        media.appendChild(video);
    }


    /* موسیقی */

    if(post.music_url){

        const audio=
            document.createElement("audio");

        audio.src=post.music_url;

        audio.controls=true;

        media.appendChild(audio);
    }


    const like=
        document.getElementById(
            "likeButton"
        );


    like.classList.remove("liked");

    like.textContent="♡";


    document.getElementById(
        "postWindow"
    ).style.display="block";
}


/* ==================================================
   بستن پست
================================================== */

document.getElementById(
    "closePost"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "postWindow"
        ).style.display="none";

        activePost=null;
    }
);


/* ==================================================
   لایک
================================================== */

document.getElementById(
    "likeButton"
).addEventListener(
    "click",
    function(){

        if(!activePost) return;


        this.classList.add("liked");

        this.textContent="♥";


        createLikeStars();
    }
);


/* ==================================================
   شروع
================================================== */

loadPosts();


/* ==================================================
   انیمیشن
================================================== */

function animate(time){

    if(!dragging){

        targetX+=.10;

        targetY+=.04;
    }


    camX+=
        (targetX-camX)*.06;


    camY+=
        (targetY-camY)*.06;


    drawBackground();

    drawStars(time);

    drawButterflies(time);

    drawPosts();

    drawLikeStars();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
