<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;
overflow:hidden;

}


#space{

position:fixed;
inset:0;

overflow:hidden;

background:

radial-gradient(
circle at center,
#332060,
#07071c 65%,
#010107
);

touch-action:none;

}



#world{

position:absolute;

width:20000px;
height:20000px;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}



/* ستاره ها */

.star{

position:absolute;

font-size:10px;

animation:
moveStar 6s infinite alternate;

text-shadow:
0 0 10px currentColor;

}



@keyframes moveStar{

from{

transform:translate(0,0);

opacity:.4;

}

to{

transform:
translate(30px,50px);

opacity:1;

}

}



/* 💫 پست */

.post{

position:absolute;

font-size:38px;

cursor:pointer;

animation:
pulse 2s infinite;

filter:
drop-shadow(0 0 15px #ffe96b);

}



@keyframes pulse{

50%{

transform:scale(1.3);

}

}




/* پروفایل */


.profile{

position:absolute;

left:9940px;

top:9900px;

color:white;

text-align:center;

}



.profile img{

width:140px;

height:140px;

border-radius:50%;

object-fit:cover;

box-shadow:
0 0 40px #69dfff;

}



.profile h1{

margin-top:10px;

font-size:22px;

}


.profile p{

opacity:.7;

}





/* نمایش پست */


#viewer{

display:none;

position:fixed;

inset:0;

background:#000b;

z-index:50;

align-items:center;

justify-content:center;

}



#viewer.show{

display:flex;

}



.box{

width:90%;

max-width:500px;

background:#151535;

color:white;

border-radius:25px;

padding:20px;

text-align:center;

}



.box img,
.box video{

width:100%;

border-radius:15px;

}



button{

margin-top:15px;

padding:12px 25px;

border:0;

border-radius:20px;

background:#8265ff;

color:white;

}

</style>

</head>


<body>


<div id="space">

<div id="world">


<div class="profile">

<img id="avatar">

<h1 id="name">
𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓
</h1>

<p id="bio"></p>

</div>


</div>

</div>



<div id="viewer">

<div class="box">

<h2 id="title"></h2>

<div id="content"></div>


<button onclick="closePost()">
بستن
</button>


</div>

</div>



<script>
// =======================
// حرکت در دنیای بزرگ
// =======================

const space =
document.getElementById("space");

const world =
document.getElementById("world");


let posX=0;
let posY=0;

let startX=0;
let startY=0;

let moving=false;


space.addEventListener(
"pointerdown",
(e)=>{

moving=true;

startX=e.clientX;
startY=e.clientY;

});



space.addEventListener(
"pointermove",
(e)=>{

if(!moving)return;


posX += e.clientX-startX;
posY += e.clientY-startY;


startX=e.clientX;
startY=e.clientY;



world.style.transform=
`
translate(
calc(-50% + ${posX}px),
calc(-50% + ${posY}px)
)
`;

});



space.addEventListener(
"pointerup",
()=>{

moving=false;

});






// =======================
// ساخت ستاره ها
// =======================


const starColors=[

"#ffffff",
"#8eeaff",
"#ffb9e8",
"#d4b5ff",
"#fff38a",
"#a7ffdc"

];



for(let i=0;i<1200;i++){


let star =
document.createElement("div");


star.className="star";


star.innerHTML =
Math.random()>0.4
?"☆"
:"✦";



star.style.left =
Math.random()*19500+"px";


star.style.top =
Math.random()*19500+"px";



star.style.color =
starColors[
Math.floor(
Math.random()*starColors.length
)
];



star.style.fontSize =
(5+Math.random()*10)+"px";



star.style.animationDuration =
(3+Math.random()*8)+"s";



world.appendChild(star);


}






// =======================
// ساخت 💫 پست ها
// =======================


function addPostPoint(post,index){


let p =
document.createElement("div");


p.className="post";

p.innerHTML="💫";



p.style.left =
(1500+(index*900)%17000)
+"px";



p.style.top =
(1200+(index*1300)%17000)
+"px";



p.onclick=()=>{

openPost(post);

};



world.appendChild(p);


}





function openPost(post){


document
.getElementById("title")
.innerText =
post.title || "💫";



let html="";



if(post.content){

html+=
`<p>${post.content}</p>`;

}



if(post.image_url){

html+=
`
<img src="${post.image_url}">
`;

}



if(post.video_url){

html+=
`
<video controls src="${post.video_url}">
</video>
`;

}



document
.getElementById("content")
.innerHTML=html;



document
.getElementById("viewer")
.classList.add("show");


}





function closePost(){

document
.getElementById("viewer")
.classList.remove("show");

}
// =======================
// اتصال Supabase
// =======================

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// =======================
// گرفتن پروفایل
// =======================

async function loadProfile(){


const {data,error}=

await db
.from("site_settings")
.select("*")
.order(
"created_at",
{
ascending:false
}
)
.limit(1);



if(error){

console.log(error);

return;

}



if(!data || !data[0])
return;



let profile=data[0];



if(profile.image_url){

document
.getElementById("avatar")
.src =
profile.image_url;

}



if(profile.site_name){

document
.getElementById("name")
.innerText =
profile.site_name;

}



if(profile.bio){

document
.getElementById("bio")
.innerText =
profile.bio;

}


}






// =======================
// گرفتن پست ها
// =======================


async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



data.forEach(
(post,index)=>{


addPostPoint(
post,
index
);


});


}






// شروع

loadProfile();

loadPosts();

</script>
</body>
</html>
