<script>

/* =====================================

const SUPABASE_URL =

/* =====================================
   CANVAS
===================================== */

const canvas =
document.getElementById("sky");

const ctx =
canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(
            devicePixelRatio || 1,
            1.5
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* =====================================
   دوربین
===================================== */

let camX = 0;
let camY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let startCamX = 0;
let startCamY = 0;

let downX = 0;
let downY = 0;


/* =====================================
   رنگ‌ها
===================================== */

const colors = [

    "#ffffff",
    "#ffd5ef",
    "#ff9ed6",
    "#ffb8e5",

    "#d3baff",
    "#b59cff",

    "#a9d9ff",
    "#78c8ff",

    "#9df3ff",

    "#e3c8ff",
    "#f4b9ff",

    "#c5ffe3"
];


/* =====================================
   جهان
===================================== */

const WORLD = 24000;


/* =====================================
   ستاره‌ها
===================================== */

const stars = [];

for(let i = 0; i < 3000; i++){

    stars.push({

        x:
            (Math.random() - .5) *
            WORLD,

        y:
            (Math.random() - .5) *
            WORLD,

        size:
            13 +
            Math.random() * 4,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ],

        vx:
            (Math.random() - .5) * .8,

        vy:
            (Math.random() - .5) * .8,

        phase:
            Math.random() *
            Math.PI * 2
    });
}


/* =====================================
   پست‌ها
===================================== */

let posts = [];

let activePost = null;


function getPostPosition(
    id,
    index
){

    const n =
        Number(id) ||
        index + 1;

    const angle =
        n *
        2.399963229728653;

    const radius =
        500 +
        Math.sqrt(index) *
        650;

    return {

        x:
            Math.cos(angle) *
            radius,

        y:
            Math.sin(angle) *
            radius
    };
}


/* =====================================
   دریافت پست‌ها
===================================== */

async function loadPosts(){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/posts?select=*&order=created_at.asc",

                {

                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );

        if(!response.ok){

            console.error(
                await response.text()
            );

            return;
        }

        const data =
            await response.json();

        posts =
            data.map(
                (item,index)=>{

                    const position =
                        getPostPosition(
                            item.id,
                            index
                        );

                    return {

                        id:
                            item.id,

                        x:
                            position.x,

                        y:
                            position.y,

                        title:
                            item.title ||
                            item.Title ||
                            "بدون عنوان 🌛",

                        text:
                            item.content ||
                            "",

                        image_url:
                            item.image_url ||
                            "",

                        video_url:
                            item.video_url ||
                            "",

                        music_url:
                            item.music_url ||
                            "",

                        created_at:
                            item.created_at ||
                            ""
                    };
                }
            );

    }catch(error){

        console.error(error);
    }
}


/* =====================================
   ستاره‌های اطراف ماه
===================================== */

function drawMoonStars(
    post,
    time
){

    const count = 18;

    const orbitRadius = 70;

    for(
        let i = 0;
        i < count;
        i++
    ){

        const angle =
            (i / count) *
            Math.PI * 2 +
            time * .00035;

        const wave =
            Math.sin(
                time * .001 + i
            ) * 5;

        const worldX =
            post.x +
            Math.cos(angle) *
            (orbitRadius + wave);

        const worldY =
            post.y +
            Math.sin(angle) *
            (orbitRadius + wave);

        const x =
            worldX -
            camX +
            W / 2;

        const y =
            worldY -
            camY +
            H / 2;

        if(
            x < -80 ||
            x > W + 80 ||
            y < -80 ||
            y > H + 80
        )
            continue;

        const size =
            12 +
            Math.sin(
                time * .002 + i
            ) * 2;

        ctx.globalAlpha =
            .75 +
            Math.sin(
                time * .002 + i
            ) * .2;

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur = 7;

        ctx.font =
            `${size}px Arial`;

        ctx.fillText(
            "☆",
            x,
            y
        );

        ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   زنجیره دفرمه
   پروفایل → ماه‌ها
===================================== */

function drawMoonPath(time){

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    const profileX =
        W / 2;

    const profileY =
        195;

    const points = [];


    points.push({

        x:profileX,

        y:profileY
    });


    for(
        let i = 0;
        i < posts.length;
        i++
    ){

        const post =
            posts[i];

        points.push({

            x:
                post.x -
                camX +
                W / 2,

            y:
                post.y -
                camY +
                H / 2
        });
    }


    if(points.length < 2)
        return;


    for(
        let p = 0;
        p < points.length - 1;
        p++
    ){

        const a =
            points[p];

        const b =
            points[p + 1];

        const dx =
            b.x - a.x;

        const dy =
            b.y - a.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const count =
            Math.max(
                12,
                Math.floor(
                    distance / 22
                )
            );

        const length =
            distance || 1;


        const nx =
            -dy / length;

        const ny =
            dx / length;


        for(
            let j = 1;
            j < count;
            j++
        ){

            const t =
                j / count;

            let x =
                a.x +
                dx * t;

            let y =
                a.y +
                dy * t;


            const wave =
                Math.sin(
                    t *
                    Math.PI *
                    3 +
                    p * 1.7 +
                    time * .001
                ) * 24;

            const wave2 =
                Math.sin(
                    t *
                    Math.PI *
                    7 +
                    p
                ) * 9;


            x +=
                nx *
                (wave + wave2);

            y +=
                ny *
                (wave + wave2);


            const float =
                Math.sin(
                    time * .002 +
                    j * .8 +
                    p
                ) * 3;

            x +=
                nx * float;

            y +=
                ny * float;


            ctx.globalAlpha =
                .65 +
                Math.sin(
                    time * .003 +
                    j
                ) * .25;

            ctx.fillStyle =
                colors[
                    (j + p) %
                    colors.length
                ];

            ctx.shadowColor =
                ctx.fillStyle;

            ctx.shadowBlur = 6;

            const size =
                8 +
                Math.sin(
                    time * .002 +
                    j
                ) * 2;

            ctx.font =
                `${size}px Arial`;

            ctx.fillText(
                "☆",
                x,
                y
            );

            ctx.shadowBlur = 0;
        }
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   پروفایل داخل جهان
===================================== */

function drawProfile(){

    const x =
        W / 2;

    const y =
        120;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        45,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#15151f";

    ctx.fill();

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.font =
        "35px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "🌛",
        x,
        y
    );

    ctx.font =
        "18px Arial";

    ctx.fillStyle =
        "#fff";

    ctx.fillText(
        "Minuit côtier",
        x,
        y + 75
    );
}


/* =====================================
   ماه‌های پست
===================================== */

function drawPosts(time){

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    for(
        const post of posts
    ){

        const x =
            post.x -
            camX +
            W / 2;

        const y =
            post.y -
            camY +
            H / 2;

        if(
            x < -120 ||
            x > W + 120 ||
            y < -120 ||
            y > H + 120
        )
            continue;


        drawMoonStars(
            post,
            time
        );


        ctx.font =
            "36px Arial";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur = 15;

        ctx.fillText(
            "🌛",
            x,
            y
        );

        ctx.shadowBlur = 0;
    }
}


/* =====================================
   ستاره‌های لایک
===================================== */

const likeStars = [];


function createLikeStars(){

    if(!activePost)
        return;

    const startX =
        activePost.x -
        camX +
        W / 2;

    const startY =
        activePost.y -
        camY +
        H / 2;


    for(
        let i = 0;
        i < 100;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            1.5 +
            Math.random() * 4;

        likeStars.push({

            x:startX,

            y:startY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                13 +
                Math.random() * 5,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],

            life:
                100 +
                Math.random() * 100
        });
    }
}


function drawLikeStars(){

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    for(
        let i =
            likeStars.length - 1;

        i >= 0;

        i--
    ){

        const s =
            likeStars[i];

        s.x += s.vx;

        s.y += s.vy;

        s.vx *= .998;

        s.vy *= .998;

        s.life--;


        if(s.life <= 0){

            likeStars.splice(
                i,
                1
            );

            continue;
        }


        ctx.globalAlpha =
            Math.min(
                1,
                s.life / 35
            );

        ctx.fillStyle =
            s.color;

        ctx.shadowColor =
            s.color;

        ctx.shadowBlur = 5;

        ctx.font =
            `normal ${s.size}px Arial`;

        ctx.fillText(
            "☆",
            s.x,
            s.y
        );

        ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   پس‌زمینه
===================================== */

function drawBackground(){

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================
   ستاره‌های اصلی
===================================== */

function drawStars(time){

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    for(
        const s of stars
    ){

        s.x += s.vx;

        s.y += s.vy;


        if(
            s.x >
            WORLD / 2
        )
            s.x =
                -WORLD / 2;


        if(
            s.x <
            -WORLD / 2
        )
            s.x =
                WORLD / 2;


        if(
            s.y >
            WORLD / 2
        )
            s.y =
                -WORLD / 2;


        if(
            s.y <
            -WORLD / 2
        )
            s.y =
                WORLD / 2;


        const x =
            s.x -
            camX +
            W / 2;

        const y =
            s.y -
            camY +
            H / 2;


        if(
            x < -40 ||
            x > W + 40 ||
            y < -40 ||
            y > H + 40
        )
            continue;


        const alpha =
            .88 +
            Math.sin(
                time * .002 +
                s.phase
            ) * .10;


        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            s.color;

        ctx.shadowColor =
            s.color;

        ctx.shadowBlur = 5;

        ctx.font =
            `normal ${s.size}px Arial`;

        ctx.fillText(
            "☆",
            x,
            y
        );

        ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
}


/* =====================================
   پیدا کردن پست
===================================== */

function findPost(x,y){

    for(
        let i =
            posts.length - 1;

        i >= 0;

        i--
    ){

        const post =
            posts[i];

        const px =
            post.x -
            camX +
            W / 2;

        const py =
            post.y -
            camY +
            H / 2;


        if(
            Math.hypot(
                x - px,
                y - py
            ) < 70
        )
            return post;
    }

    return null;
}


/* =====================================
   لمس
===================================== */

canvas.addEventListener(
    "pointerdown",
    e=>{

        downX =
            e.clientX;

        downY =
            e.clientY;

        dragging =
            true;

        startX =
            e.clientX;

        startY =
            e.clientY;

        startCamX =
            camX;

        startCamY =
            camY;


        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx =
            e.clientX -
            startX;

        const dy =
            e.clientY -
            startY;


        targetX =
            startCamX -
            dx * 1.5;

        targetY =
            startCamY -
            dy * 1.5;
    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const distance =
            Math.hypot(
                e.clientX - downX,
                e.clientY - downY
            );


        dragging =
            false;


        if(
            distance < 12
        ){

            const post =
                findPost(
                    e.clientX,
                    e.clientY
                );


            if(post)
                openPost(post);
        }


        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}
    }
);

/* =====================================
   انیمیشن
===================================== */

function animate(time){

    if(!dragging){

        targetX += .10;

        targetY += .04;
    }


    camX +=
        (
            targetX - camX
        ) * .06;


    camY +=
        (
            targetY - camY
        ) * .06;


    drawBackground();

    drawStars(time);

    drawProfile();

    drawMoonPath(time);

    drawPosts(time);

    drawLikeStars();


    requestAnimationFrame(
        animate
    );
}

    animate
