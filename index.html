<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 20%,rgba(103,75,180,.35),transparent 28%),
    radial-gradient(circle at 85% 70%,rgba(48,105,170,.3),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(82,42,130,.3),transparent 35%),
    linear-gradient(135deg,#02030d,#080d25,#130d2e,#050817);
  overflow-x:hidden;
}

/* کهکشان */

#space{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  font-size:6px;
  opacity:.75;
  animation:fall linear infinite;
  text-shadow:0 0 8px currentColor;
}

@keyframes fall{
  0%{
    transform:translateY(-30px);
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  85%{
    opacity:.7;
  }

  100%{
    transform:translateY(110vh);
    opacity:0;
  }
}

/* سیاره‌ها */

.planet{
  position:absolute;
  border-radius:50%;
  opacity:.45;
  filter:blur(.5px);
}

.planet.one{
  width:110px;
  height:110px;
  top:15%;
  left:-45px;
  background:radial-gradient(circle at 30% 30%,#9dbfff,#354e91,#121b48);
  box-shadow:0 0 45px #526db5;
}

.planet.two{
  width:75px;
  height:75px;
  right:-25px;
  top:48%;
  background:radial-gradient(circle at 35% 30%,#ffc2e2,#854d85,#28163d);
  box-shadow:0 0 40px #9a579b;
}

.planet.three{
  width:45px;
  height:45px;
  left:18%;
  bottom:8%;
  background:radial-gradient(circle at 30% 25%,#b8ddff,#315d85,#101d35);
  box-shadow:0 0 30px #4d83aa;
}

/* صفحه */

.container{
  position:relative;
  z-index:2;
  width:min(94%,680px);
  margin:auto;
  padding:25px 0 80px;
}

/* پروفایل */

.profile{
  text-align:center;
  padding:28px 18px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  background:rgba(7,10,32,.65);
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 0 35px rgba(145,120,255,.5);
}

.profile h1{
  margin:15px 0 7px;
  font-size:27px;
  font-style:italic;
}

#bio{
  margin:0;
  opacity:.78;
  line-height:1.8;
}

/* ستاره دنبال کردن */

.follow-area{
  text-align:center;
  margin:22px 0;
}

.follow-star{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:75px;
  height:75px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:38px;
  cursor:pointer;
  box-shadow:0 0 30px rgba(255,255,255,.12);
}

.follow-star.followed{
  background:rgba(255,190,225,.16);
  box-shadow:
    0 0 20px #ff9dca,
    0 0 50px rgba(150,190,255,.3);
}

.follow-text{
  margin-top:8px;
  opacity:.75;
}

/* پست */

.post{
  margin-top:20px;
  padding:20px;
  border-radius:25px;
  background:rgba(8,11,35,.72);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.post-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.post-content{
  line-height:1.9;
  opacity:.9;
  white-space:pre-wrap;
}

.post-image,
.post-video{
  display:block;
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:18px;
  margin-top:15px;
  background:#000;
}

.post audio{
  width:100%;
  margin-top:15px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.like-btn{
  border:0;
  padding:10px 18px;
  border-radius:16px;
  background:rgba(255,255,255,.09);
  color:white;
  cursor:pointer;
  font-size:15px;
}

.like-btn.liked{
  background:rgba(255,80,145,.2);
}

/* قلب‌ها */

.floating-heart{
  position:fixed;
  z-index:20;
  pointer-events:none;
  font-size:20px;
  animation:heartUp 1.2s ease-out forwards;
}

@keyframes heartUp{
  0%{
    transform:translateY(0) scale(.7);
    opacity:1;
  }

  100%{
    transform:translateY(-160px) translateX(var(--x)) scale(1.3);
    opacity:0;
  }
}

/* پیام */

.message{
  text-align:center;
  padding:25px 10px;
  opacity:.7;
}

.error{
  color:#ff9ebf;
  line-height:1.8;
}
</style>
</head>

<body>

<div id="space"></div>

<div class="planet one"></div>
<div class="planet two"></div>
<div class="planet three"></div>

<div class="container">

  <section class="profile">

    <img
      id="avatar"
      class="avatar"
      src=""
      alt="Minuit côtier"
    >

    <h1 id="siteName">☆ Minuit côtier ☆</h1>

    <p id="bio"></p>

  </section>


  <div class="follow-area">

    <button
      id="followStar"
      class="follow-star"
      onclick="toggleFollow()"
    >
      ⭐️
    </button>

    <div
      id="followText"
      class="follow-text"
    >
      برای دنبال کردن بزن
    </div>

  </div>


  <section id="posts">

    <div class="message">
      در حال دریافت پست‌ها...
    </div>

  </section>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

/*
  اینجا کلید واقعی Supabase را بگذار
  باید با sb_publishable_ شروع شود
*/

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ستاره‌های کهکشان
========================= */

const space =
document.getElementById("space");

const starColors = [
  "#ffd1e8",
  "#b8ddff",
  "#91aaff",
  "#c8cfff"
];

for(let i=0;i<140;i++){

  const star =
  document.createElement("span");

  star.className="star";

  star.textContent="☆";

  star.style.left =
  Math.random()*100+"%";

  star.style.top =
  Math.random()*100+"%";

  star.style.color =
  starColors[
    Math.floor(
      Math.random()*starColors.length
    )
  ];

  star.style.fontSize =
  (Math.random()*4+4)+"px";

  star.style.animationDuration =
  (Math.random()*12+8)+"s";

  star.style.animationDelay =
  (Math.random()*10)+"s";

  space.appendChild(star);
}


/* =========================
   تنظیمات سایت
========================= */

async function loadSettings(){

  const result =
  await db
  .from("site_settings")
  .select("*")
  .limit(1);

  if(result.error){

    showError(
      "خطا در دریافت تنظیمات: "+
      result.error.message
    );

    return;
  }

  if(!result.data || !result.data.length){

    return;
  }

  const settings =
  result.data[0];

  if(settings.site_name){

    document
    .getElementById("siteName")
    .textContent =
    "☆ "+settings.site_name+" ☆";

  }

  if(settings.bio){

    document
    .getElementById("bio")
    .textContent =
    settings.bio;

  }

  if(settings.image_url){

    document
    .getElementById("avatar")
    .src =
    settings.image_url;

  }
}


/* =========================
   پست‌ها
========================= */

async function loadPosts(){

  const box =
  document.getElementById("posts");

  box.innerHTML =
  `<div class="message">
    در حال دریافت پست‌ها...
  </div>`;


  const result =
  await db
  .from("posts")
  .select(
    "id,created_at,title,content,image_url,video_url,audio_url"
  )
  .order(
    "created_at",
    {ascending:false}
  );


  if(result.error){

    box.innerHTML =
    `<div class="message error">
      دریافت پست‌ها انجام نشد ❌<br><br>
      ${escapeHtml(result.error.message)}
    </div>`;

    return;
  }


  const posts =
  result.data || [];


  if(posts.length===0){

    box.innerHTML =
    `<div class="message">
      هنوز پستی منتشر نشده ☆
    </div>`;

    return;
  }


  box.innerHTML="";


  posts.forEach(post=>{

    const article =
    document.createElement("article");

    article.className="post";


    let html="";


    if(post.title){

      html +=
      `<div class="post-title">
        ${escapeHtml(post.title)}
      </div>`;

    }


    if(post.content){

      html +=
      `<div class="post-content">
        ${escapeHtml(post.content)}
      </div>`;

    }


    if(post.image_url){

      html +=
      `<img
        class="post-image"
        src="${escapeAttr(post.image_url)}"
        alt="تصویر پست"
      >`;

    }


    if(post.video_url){

      html +=
      `<video
        class="post-video media-file"
        controls
        preload="metadata"
        src="${escapeAttr(post.video_url)}"
      ></video>`;

    }


    if(post.audio_url){

      html +=
      `<audio
        class="media-file"
        controls
        preload="metadata"
        src="${escapeAttr(post.audio_url)}"
      ></audio>`;

    }


    html +=
    `<div class="actions">

      <button
        class="like-btn"
        onclick="likePost(this)"
      >
        ❤️ لایک
      </button>

    </div>`;


    article.innerHTML=html;

    box.appendChild(article);

  });


  setupMediaControl();
}


/* =========================
   وقتی ویدیو یا آهنگ پخش شد
   سایر صداها متوقف شوند
========================= */

function setupMediaControl(){

  const media =
  document.querySelectorAll(
    "audio,video"
  );


  media.forEach(item=>{

    item.addEventListener(
      "play",
      function(){

        media.forEach(other=>{

          if(other !== item){

            other.pause();

          }

        });

      }
    );

  });

}


/* =========================
   لایک + قلب رنگی
========================= */

function likePost(button){

  if(
    button.classList.contains("liked")
  ){

    return;

  }


  button.classList.add("liked");

  button.textContent =
  "❤️ لایک شد";


  const colors = [
    "❤️",
    "💗",
    "💖",
    "💙",
    "💜",
    "🩷"
  ];


  for(let i=0;i<12;i++){

    const heart =
    document.createElement("span");

    heart.className =
    "floating-heart";

    heart.textContent =
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];


    heart.style.left =
    (40+Math.random()*20)+"%";

    heart.style.bottom =
    "90px";

    heart.style.setProperty(
      "--x",
      (Math.random()*120-60)+"px"
    );


    document.body.appendChild(
      heart
    );


    setTimeout(
      ()=>heart.remove(),
      1300
    );

  }

}


/* =========================
   دنبال کردن ⭐️
========================= */

function toggleFollow(){

  const button =
  document.getElementById(
    "followStar"
  );

  const text =
  document.getElementById(
    "followText"
  );


  const followed =
  button.classList.toggle(
    "followed"
  );


  if(followed){

    text.textContent =
    "دنبال شد ⭐️";

  }else{

    text.textContent =
    "دنبال کردن";

  }

}


/* =========================
   HTML امنیتی
========================= */

function escapeHtml(text){

  return String(text ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttr(text){

  return escapeHtml(text);

}


function showError(message){

  document.getElementById("posts")
  .innerHTML =
  `<div class="message error">
    ${escapeHtml(message)}
  </div>`;

}


/* =========================
   شروع
========================= */

loadSettings();
loadPosts();

</script>

</body>
</html>
