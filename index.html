<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
touch-action:none;
background:#020617;
}

canvas{
display:block;
}

</style>

</head>

<body>

<canvas id="sky"></canvas>


<script>

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");


let W,H;

function resize(){

W=canvas.width=innerWidth;
H=canvas.height=innerHeight;

}

resize();
onresize=resize;



let camX=0;
let camY=0;


let stars=[];



const colors=[
"#ffffff",
"#bae6fd",
"#c4b5fd",
"#f9a8d4"
];




// ساخت ستاره‌های جهان

function newStar(){

return {

x:(Math.random()-0.5)*12000,

y:(Math.random()-0.5)*12000,

size:3+Math.random()*5,

color:colors[Math.floor(Math.random()*colors.length)],

alpha:Math.random()*10

};

}



for(let i=0;i<1800;i++){

stars.push(newStar());

}





function loop(){



let bg=ctx.createLinearGradient(0,0,0,H);

bg.addColorStop(0,"#010314");

bg.addColorStop(.5,"#071a3d");

bg.addColorStop(1,"#312e81");


ctx.fillStyle=bg;

ctx.fillRect(0,0,W,H);





for(let i=0;i<stars.length;i++){


let s=stars[i];


let x=s.x-camX+W/2;

let y=s.y-camY+H/2;



if(
x>-30 &&
x<W+30 &&
y>-30 &&
y<H+30
){


s.alpha+=0.03;


ctx.globalAlpha=
0.6+Math.sin(s.alpha)*0.3;


ctx.font=s.size+"px Arial";

ctx.fillStyle=s.color;

ctx.fillText("☆",x,y);


}


}


ctx.globalAlpha=1;


requestAnimationFrame(loop);

}


loop();





// حرکت آسمان

let sx=null;
let sy=null;

let oldX=0;
let oldY=0;



canvas.onpointerdown=e=>{

sx=e.clientX;
sy=e.clientY;

oldX=camX;
oldY=camY;

};



canvas.onpointermove=e=>{

if(sx===null)return;


camX=oldX-(e.clientX-sx);

camY=oldY-(e.clientY-sy);


};



canvas.onpointerup=()=>{

sx=null;
sy=null;

};



</script>


</body>
</html>
