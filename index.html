<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}


/* =========================
   پنجره پست
========================= */

#post{
    display:none;

    position:fixed;
    z-index:50;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(88vw,420px);
    max-height:82vh;

    overflow:auto;

    padding:24px 20px 20px;

    background:rgba(5,5,10,.97);

    border:1px solid rgba(255,255,255,.18);

    border-radius:24px;

    color:#fff;

    text-align:center;

    box-shadow:
        0 0 35px rgba(150,100,255,.25);
}

#post h2{
    margin:8px 35px 15px;
    font-size:23px;
}

#postText{
    color:#ddd;
    line-height:1.9;
    white-space:pre-wrap;
}

#close{
    position:absolute;

    top:10px;
    right:10px;

    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#181820;

    color:white;

    font-size:25px;
}

#like{
    margin:20px auto 0;

    width:68px;
    height:55px;

    border:0;
    border-radius:18px;

    background:#15151d;

    color:white;

    font-size:32px;
}

#like.liked{
    color:#ff55aa;

    text-shadow:
        0 0 10px #ff55aa,
        0 0 25px #ff55aa;
}
</style>
</head>


<body>

<canvas id="sky"></canvas>


<div id="post">

    <button id="close">×</button>

    <h2 id="postTitle"></h2>

    <div id="postText"></div>

    <button id="like">♡</button>

</div>


<script>

/* ==================================================
   CANVAS
================================================== */

const canvas=
    document.getElementById("sky");

const ctx=
    canvas.getContext("2d");


let W=innerWidth;
let H=innerHeight;


function resize(){

    W=innerWidth;
    H=innerHeight;

    const dpr=
        Math.min(
            devicePixelRatio||1,
            1.5
        );

    canvas.width=
        W*dpr;

    canvas.height=
        H*dpr;

    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


addEventListener(
    "resize",
    resize
);

resize();


/* ==================================================
   رنگ‌ها
================================================== */

const COLORS=[

    "#ffffff",
    "#ffd1ec",
    "#ff8fce",
    "#ffb4df",

    "#bda7ff",
    "#9275ff",
    "#c9b8ff",

    "#8ccfff",
    "#5dbaff",
    "#9eeeff",

    "#e8c7ff",
    "#f7b9ff",

    "#c6ffe5"
];


/* ==================================================
   آسمان بزرگ
================================================== */

const WORLD=24000;


/* ==================================================
   ستاره‌های اصلی
================================================== */

const STAR_COUNT=3000;

const stars=[];


for(
    let i=0;
    i<STAR_COUNT;
    i++
){

    stars.push({

        x:
            (Math.random()-.5)*
            WORLD,

        y:
            (Math.random()-.5)*
            WORLD,

        /*
           ☆ بزرگ
        */

        size:
            13+
            Math.random()*5,

        color:
            COLORS[
                Math.floor(
                    Math.random()*
                    COLORS.length
                )
            ],

        vx:
            (Math.random()-.5)*
            .65,

        vy:
            (Math.random()-.5)*
            .65,

        phase:
            Math.random()*
            Math.PI*2
    });
}


/* ==================================================
   پست‌ها

   فعلاً یک پست واقعی برای تست داریم.
   بعداً همین آرایه از Supabase پر می‌شود.
================================================== */

const posts=[

    {
        id:1,

        /*
           جای 🌛
        */

        x:0,
        y:0,

        title:
            "پست اول 🌙",

        text:
            "به Minuit côtier خوش اومدی ✨\n\n"+
            "این یک پست آزمایشی است."
    }

];


/* ==================================================
   ستاره‌های افکت لایک
================================================== */

const likeStars=[];


/* ==================================================
   دوربین
================================================== */

let camX=0;
let camY=0;

let targetX=0;
let targetY=0;


/* ==================================================
   حرکت انگشت
================================================== */

let dragging=false;

let downX=0;
let downY=0;

let startX=0;
let startY=0;

let startCamX=0;
let startCamY=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        downX=e.clientX;
        downY=e.clientY;

        startX=e.clientX;
        startY=e.clientY;

        startCamX=camX;
        startCamY=camY;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;

        const dx=
            e.clientX-startX;

        const dy=
            e.clientY-startY;


        targetX=
            startCamX-
            dx*1.5;

        targetY=
            startCamY-
            dy*1.5;
    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const moved=
            Math.hypot(
                e.clientX-downX,
                e.clientY-downY
            );


        dragging=false;


        /*
           فقط اگر ضربه بود،
           نه کشیدن
        */

        if(moved<15){

            checkPost(
                e.clientX,
                e.clientY
            );
        }


        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}
    }
);


canvas.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* ==================================================
   پس‌زمینه
================================================== */

function drawBackground(){

    ctx.fillStyle="#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* ==================================================
   ستاره‌های آسمان
================================================== */

function drawStars(time){

    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";


    for(
        const s of stars
    ){

        /*
           حرکت مداوم
        */

        s.x+=s.vx;
        s.y+=s.vy;


        /*
           برگشت از طرف دیگر جهان
        */

        if(
            s.x>WORLD/2
        )
            s.x=-WORLD/2;

        if(
            s.x<-WORLD/2
        )
            s.x=WORLD/2;


        if(
            s.y>WORLD/2
        )
            s.y=-WORLD/2;

        if(
            s.y<-WORLD/2
        )
            s.y=WORLD/2;


        /*
           تبدیل مختصات جهان
           به صفحه
        */

        const x=
            s.x-
            camX+
            W/2;

        const y=
            s.y-
            camY+
            H/2;


        /*
           خارج صفحه
        */

        if(
            x<-50 ||
            x>W+50 ||
            y<-50 ||
            y>H+50
        )
            continue;


        /*
           چشمک خیلی کم
        */

        const alpha=
            .90+
            Math.sin(
                time*.002+
                s.phase
            )*.08;


        ctx.globalAlpha=
            alpha;


        ctx.fillStyle=
            s.color;


        ctx.shadowColor=
            s.color;

        ctx.shadowBlur=
            5;


        /*
           خود ☆
        */

        ctx.font=
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            x,
            y
        );


        ctx.shadowBlur=0;
    }


    ctx.globalAlpha=1;
}


/* ==================================================
   🌛 برای هر پست
================================================== */

function drawPosts(){

    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";


    for(
        const p of posts
    ){

        const x=
            p.x-
            camX+
            W/2;

        const y=
            p.y-
            camY+
            H/2;


        if(
            x<-80 ||
            x>W+80 ||
            y<-80 ||
            y>H+80
        )
            continue;


        /*
           ماه فقط اینجاست.
           بدون پست هیچ ماهی وجود ندارد.
        */

        ctx.font=
            "34px Arial";

        ctx.shadowColor=
            "#fff";

        ctx.shadowBlur=
            8;


        ctx.fillText(
            "🌛",
            x,
            y
        );


        ctx.shadowBlur=0;
    }
}


/* ==================================================
   پیدا کردن ماه
================================================== */

function checkPost(x,y){

    for(
        let i=posts.length-1;
        i>=0;
        i--
    ){

        const p=
            posts[i];


        const px=
            p.x-
            camX+
            W/2;

        const py=
            p.y-
            camY+
            H/2;


        const distance=
            Math.hypot(
                x-px,
                y-py
            );


        if(
            distance<55
        ){

            openPost(p);

            return;
        }
    }
}


/* ==================================================
   باز کردن پست
================================================== */

let activePost=null;


function openPost(p){

    activePost=p;


    document.getElementById(
        "postTitle"
    ).textContent=
        p.title;


    document.getElementById(
        "postText"
    ).textContent=
        p.text;


    const like=
        document.getElementById(
            "like"
        );


    like.textContent=
        "♡";

    like.classList.remove(
        "liked"
    );


    document.getElementById(
        "post"
    ).style.display=
        "block";
}


/* ==================================================
   بستن پست
================================================== */

document.getElementById(
    "close"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "post"
        ).style.display=
            "none";

        activePost=null;
    }
);


/* ==================================================
   ♡ لایک
================================================== */

document.getElementById(
    "like"
).addEventListener(
    "click",
    function(){

        if(!activePost)
            return;


        /*
           ♡ → ♥
        */

        this.textContent=
            "♥";

        this.classList.add(
            "liked"
        );


        /*
           پر شدن صفحه
        */

        createLikeStars();
    }
);


/* ==================================================
   ساخت ستاره‌های لایک
================================================== */

function createLikeStars(){

    /*
       900 ستاره
    */

    for(
        let i=0;
        i<900;
        i++
    ){

        /*
           از چهار طرف صفحه
        */

        const side=
            Math.floor(
                Math.random()*4
            );


        let x;
        let y;


        if(side===0){

            x=
                Math.random()*W;

            y=-40;

        }

        else if(side===1){

            x=W+40;

            y=
                Math.random()*H;

        }

        else if(side===2){

            x=
                Math.random()*W;

            y=H+40;

        }

        else{

            x=-40;

            y=
                Math.random()*H;
        }


        /*
           حرکت به داخل صفحه
        */

        const dx=
            W/2-x;

        const dy=
            H/2-y;


        const speed=
            .003+
            Math.random()*.009;


        likeStars.push({

            x:x,
            y:y,

            vx:
                dx*speed+
                (Math.random()-.5)*1.2,

            vy:
                dy*speed+
                (Math.random()-.5)*1.2,

            size:
                13+
                Math.random()*5,

            color:
                COLORS[
                    Math.floor(
                        Math.random()*
                        COLORS.length
                    )
                ],

            life:
                220+
                Math.random()*130
        });
    }
}


/* ==================================================
   رسم ستاره‌های لایک
================================================== */

function drawLikeStars(){

    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";


    for(
        let i=likeStars.length-1;
        i>=0;
        i--
    ){

        const s=
            likeStars[i];


        s.x+=s.vx;
        s.y+=s.vy;


        s.vx*=.998;
        s.vy*=.998;


        s.life--;


        if(
            s.life<=0
        ){

            likeStars.splice(
                i,
                1
            );

            continue;
        }


        ctx.globalAlpha=
            Math.min(
                1,
                s.life/45
            );


        ctx.fillStyle=
            s.color;


        ctx.shadowColor=
            s.color;

        ctx.shadowBlur=
            6;


        ctx.font=
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            s.x,
            s.y
        );


        ctx.shadowBlur=0;
    }


    ctx.globalAlpha=1;
}


/* ==================================================
   انیمیشن
================================================== */

function animate(time){

    /*
       حرکت خیلی آرام دوربین
    */

    if(!dragging){

        targetX+=.08;
        targetY+=.03;
    }


    /*
       حرکت نرم
    */

    camX+=
        (targetX-camX)*
        .06;

    camY+=
        (targetY-camY)*
        .06;


    drawBackground();

    drawStars(time);

    drawPosts();

    drawLikeStars();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
