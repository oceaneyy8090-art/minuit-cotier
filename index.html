<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>


<style>

html,body{

margin:0;

height:100%;

overflow:hidden;

background:#020617;

touch-action:none;

}


canvas{

display:block;

}



#postBox{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:#071a3d;

color:white;

width:80%;

padding:20px;

border-radius:20px;

text-align:center;

z-index:10;

}



#postImage{

max-width:100%;

border-radius:15px;

}



#like{

font-size:40px;

}



#musicBtn{

position:fixed;

right:20px;

bottom:20px;

width:55px;

height:55px;

border:0;

border-radius:50%;

background:#071a3d;

color:white;

font-size:22px;

z-index:20;

}


</style>

</head>


<body>


<canvas id="sky"></canvas>


<audio id="music" loop>

<source src="music.mp3">

</audio>


<button id="musicBtn" onclick="toggleMusic()">🎵</button>



<div id="postBox">

<button onclick="closePost()">بستن</button>

<h2 id="postTitle"></h2>


<img id="postImage">


<p id="postContent"></p>


<div id="like">♡</div>


</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




const canvas=document.getElementById("sky");

const ctx=canvas.getContext("2d");


let W,H;


function resize(){

W=canvas.width=innerWidth;

H=canvas.height=innerHeight;

}

resize();

onresize=resize;




let camX=0;

let camY=0;



let stars=[];

let effects=[];

let posts=[];


let activePost=null;




const colors=[

"#ffffff",
"#7dd3fc",
"#a78bfa",
"#f9a8d4",
"#c7d2fe"

];





// ساخت ستاره در اطراف محل حرکت

function addStar(x,y){


stars.push({

x:x ?? camX+(Math.random()-0.5)*W*4,

y:y ?? camY+(Math.random()-0.5)*H*4,


vx:(Math.random()-.5)*0.2,

vy:(Math.random()-.5)*0.2,


size:2+Math.random()*6,


color:
colors[
Math.floor(Math.random()*colors.length)
]


});


}




for(let i=0;i<1500;i++){

addStar();

}







// گرفتن پست ها از Supabase


async function loadPosts(){


const {data,error}=await supabaseClient

.from("posts")

.select("*");



if(error){

console.log(error);

return;

}



posts=data.map((p,i)=>({


x:i*500-500,

y:i*350-300,


icon:"🌛",


title:p.title || "پست جدید",


content:p.content || "",


image:p.image_url || ""


}));


}


loadPosts();







function draw(){



ctx.fillStyle="#020617";

ctx.fillRect(0,0,W,H);




while(stars.length<2000){

addStar();

}






stars.forEach(s=>{


s.x+=s.vx;

s.y+=s.vy;


let x=s.x-camX+W/2;

let y=s.y-camY+H/2;



ctx.fillStyle=s.color;

ctx.font=s.size+"px Arial";


ctx.fillText("☆",x,y);



});





posts.forEach(p=>{


let x=p.x-camX+W/2;

let y=p.y-camY+H/2;



ctx.font="32px Arial";

ctx.fillText(
"🌛",
x,
y
);



});




effects.forEach((e,i)=>{


e.x+=e.vx;

e.y+=e.vy;


ctx.font="20px Arial";

ctx.fillStyle=e.color;


ctx.fillText(
"☆",
e.x-camX+W/2,
e.y-camY+H/2
);


e.life--;


if(e.life<=0)

effects.splice(i,1);


});



requestAnimationFrame(draw);


}


draw();
// باز شدن پست با 🌛

canvas.onclick=e=>{


posts.forEach(p=>{


let x=p.x-camX+W/2;

let y=p.y-camY+H/2;



if(Math.hypot(e.clientX-x,e.clientY-y)<60){


activePost=p;



document.getElementById("postTitle").innerHTML=p.title;


document.getElementById("postContent").innerHTML=p.content;



let img=document.getElementById("postImage");



if(p.image){

img.src=p.image;

img.style.display="block";

}

else{

img.style.display="none";

}



document.getElementById("postBox").style.display="block";


}


});


};





function closePost(){

document.getElementById("postBox").style.display="none";

}






// لایک با انفجار ستاره

document.getElementById("like").onclick=()=>{


if(!activePost)return;


document.getElementById("like").innerHTML="♥";



for(let i=0;i<200;i++){


effects.push({


x:activePost.x,

y:activePost.y,


vx:(Math.random()-0.5)*10,

vy:(Math.random()-0.5)*10,


life:80,


color:
colors[Math.floor(Math.random()*colors.length)]


});


}


};







// حرکت در فضا

let sx=null;

let sy=null;

let ox=0;

let oy=0;



canvas.onpointerdown=e=>{


sx=e.clientX;

sy=e.clientY;


ox=camX;

oy=camY;


};




canvas.onpointermove=e=>{


if(sx===null)return;



camX=ox-(e.clientX-sx);

camY=oy-(e.clientY-sy);



// ساخت ستاره های جدید در مسیر

while(stars.length<2500){

addStar();

}


};




canvas.onpointerup=()=>{


sx=null;


};






// موزیک

const music=document.getElementById("music");

let playing=false;



function toggleMusic(){


if(playing){


music.pause();

document.getElementById("musicBtn").innerHTML="🔇";


playing=false;


}

else{


music.play();

document.getElementById("musicBtn").innerHTML="🎵";


playing=true;


}


}





// شروع موزیک بعد از اولین لمس

document.body.addEventListener("click",()=>{


if(!playing){


music.play().catch(()=>{});


playing=true;


}


},{once:true});



</script>


</body>

</html>
