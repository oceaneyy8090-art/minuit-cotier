<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
touch-action:none;
background:#020617;
}

canvas{
display:block;
}

</style>

</head>

<body>

<canvas id="sky"></canvas>


<script>

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");


let W,H;

function resize(){

W=canvas.width=innerWidth;
H=canvas.height=innerHeight;

}

resize();
onresize=resize;



let camX=0;
let camY=0;


let stars=[];


const colors=[
"#ffffff",
"#bae6fd",
"#ddd6fe",
"#fbcfe8"
];




// ساخت ستاره

function makeStar(){

return {

x:Math.random()*10000-5000,

y:Math.random()*10000-5000,

size:2+Math.random()*4,

color:colors[Math.floor(Math.random()*colors.length)]

};

}




// فقط ۸۰۰ ستاره سبک

for(let i=0;i<800;i++){

stars.push(makeStar());

}




function draw(){



// پس زمینه

let bg=ctx.createLinearGradient(0,0,0,H);

bg.addColorStop(0,"#020617");

bg.addColorStop(1,"#1e1b4b");


ctx.fillStyle=bg;

ctx.fillRect(0,0,W,H);





// ستاره‌ها

for(let s of stars){


let x=s.x-camX+W/2;

let y=s.y-camY+H/2;



if(
x>-20 &&
x<W+20 &&
y>-20 &&
y<H+20
){


ctx.font=s.size+"px Arial";

ctx.fillStyle=s.color;

ctx.fillText("☆",x,y);


}


}



requestAnimationFrame(draw);


}


draw();





// حرکت آسمان

let startX=null;
let startY=null;

let saveX=0;
let saveY=0;



canvas.onpointerdown=e=>{

startX=e.clientX;
startY=e.clientY;

saveX=camX;
saveY=camY;

};



canvas.onpointermove=e=>{

if(startX===null)return;


camX=saveX-(e.clientX-startX);

camY=saveY-(e.clientY-startY);


};



canvas.onpointerup=()=>{

startX=null;
startY=null;

};


</script>

</body>
</html>
