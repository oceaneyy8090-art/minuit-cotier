<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
touch-action:none;
background:#020617;
}

canvas{
display:block;
}


#musicBtn{

position:fixed;

right:20px;

bottom:20px;

width:55px;

height:55px;

border-radius:50%;

border:none;

background:#ffffff22;

color:white;

font-size:25px;

z-index:20;

}



#postBox{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:#071a3d;

color:white;

width:80%;

padding:20px;

border-radius:20px;

text-align:center;

z-index:10;

}



#like{

font-size:35px;

color:white;

}

</style>

</head>


<body>


<canvas id="sky"></canvas>


<audio id="lightMusic" loop>

<source src="light.mp3" type="audio/mpeg">

</audio>


<button id="musicBtn">🔇</button>



<div id="postBox">

<button onclick="closePost()">بستن</button>

<h2 id="postTitle">🌛 پست</h2>

<p id="postText">
محتوای پست
</p>


<div id="like">
♡
</div>


</div>



<script>


const canvas=document.getElementById("sky");

const ctx=canvas.getContext("2d");



let W,H;


function resize(){

W=canvas.width=innerWidth;

H=canvas.height=innerHeight;

}


resize();

onresize=resize;




const music=document.getElementById("lightMusic");

music.volume=0.25;



let musicOn=false;


document.getElementById("musicBtn").onclick=()=>{


if(musicOn){

music.pause();

musicOn=false;

musicBtn.innerHTML="🔇";


}else{


music.play();

musicOn=true;

musicBtn.innerHTML="🎵";


}


};




let camX=0;

let camY=0;



let stars=[];

let effects=[];



const colors=[

"#ffffff",
"#7dd3fc",
"#a78bfa",
"#f9a8d4",
"#c7d2fe"

];




function addStar(x,y){


stars.push({


x:x,

y:y,


vx:(Math.random()-.5)*0.25,

vy:(Math.random()-.5)*0.25,


size:2+Math.random()*7,


color:
colors[
Math.floor(Math.random()*colors.length)
]


});


}




for(let i=0;i<3000;i++){


addStar(

(Math.random()-0.5)*10000,

(Math.random()-0.5)*10000

);


}
let posts=[

{
x:300,
y:200,
title:"اولین پست 🌛",
text:"اینجا متن پست قرار می‌گیرد ✨"
},

{
x:-500,
y:600,
title:"پست دوم 🌛",
text:"یک پست دیگر در آسمان شب"
}

];


let activePost=null;



function draw(){



// ساخت ستاره در هرجای جدیدی که می‌ری

while(stars.length<4000){

addStar(

camX+(Math.random()-0.5)*W*6,

camY+(Math.random()-0.5)*H*6

);

}





let bg=ctx.createLinearGradient(0,0,0,H);


bg.addColorStop(0,"#010314");

bg.addColorStop(.5,"#071a3d");

bg.addColorStop(1,"#31486d");


ctx.fillStyle=bg;

ctx.fillRect(0,0,W,H);





// ستاره‌ها

stars.forEach(s=>{


s.x+=s.vx;

s.y+=s.vy;



let x=s.x-camX+W/2;

let y=s.y-camY+H/2;



ctx.font=s.size+"px Arial";

ctx.fillStyle=s.color;


ctx.fillText("☆",x,y);



});






// پست‌ها 🌛

posts.forEach(p=>{


let x=p.x-camX+W/2;

let y=p.y-camY+H/2;


ctx.font="25px Arial";


ctx.fillText(
"🌛",
x,
y
);


});






// انفجار لایک

effects.forEach((e,i)=>{


e.x+=e.vx;

e.y+=e.vy;



ctx.font="18px Arial";

ctx.fillStyle=e.color;


ctx.fillText(
"☆",
e.x-camX+W/2,
e.y-camY+H/2
);



e.life--;



if(e.life<=0){

effects.splice(i,1);

}



});



requestAnimationFrame(draw);


}



draw();






// لمس 🌛

canvas.onclick=e=>{


posts.forEach(p=>{


let x=p.x-camX+W/2;

let y=p.y-camY+H/2;



if(

Math.hypot(
e.clientX-x,
e.clientY-y
)<45

){


activePost=p;


document.getElementById("postTitle").innerHTML=p.title;


document.getElementById("postText").innerHTML=p.text;


document.getElementById("postBox").style.display="block";


// پخش موزیک

music.play();


}



});


};





function closePost(){


document.getElementById("postBox").style.display="none";


music.pause();


}






// لایک ♡


document.getElementById("like").onclick=()=>{


document.getElementById("like").style.color="red";



for(let i=0;i<200;i++){


effects.push({


x:activePost.x,

y:activePost.y,


vx:(Math.random()-0.5)*12,

vy:(Math.random()-0.5)*12,


life:90,


color:
colors[
Math.floor(Math.random()*colors.length)
]


});


}



};
// حرکت در آسمان

let sx=null;
let sy=null;

let ox=0;
let oy=0;



canvas.onpointerdown=e=>{

sx=e.clientX;
sy=e.clientY;

ox=camX;
oy=camY;

};




canvas.onpointermove=e=>{


if(sx===null)return;



camX=ox-(e.clientX-sx);

camY=oy-(e.clientY-sy);



};




canvas.onpointerup=()=>{

sx=null;
sy=null;

};





// ---------- آماده برای Supabase ----------


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";




// گرفتن پست‌های واقعی

async function getPosts(){


try{


let result=await fetch(

SUPABASE_URL+
"/rest/v1/posts?select=*",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY

}

}

);



let data=await result.json();




// تبدیل هر پست به 🌛

posts=data.map((p,i)=>{


return{


x:(Math.random()-0.5)*5000,

y:(Math.random()-0.5)*5000,


title:p.title || "پست 🌛",


text:p.content || ""


};


});



}catch(err){


console.log(err);


}


}




getPosts();

</script>

</body>
</html>
