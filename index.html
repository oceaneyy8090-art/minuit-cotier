<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  margin:0;
  color:#fff;
  font-family:tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,#29205f 0,transparent 35%),
    linear-gradient(145deg,#03030d,#0b0930,#17104a);
  overflow-x:hidden;
}


/* ستاره‌های سبک */

.stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  bottom:-20px;
  font-size:8px;
  opacity:0;
  animation:rise linear infinite;
  will-change:transform,opacity;
}

@keyframes rise{

  0%{
    transform:translate3d(0,0,0);
    opacity:0;
  }

  12%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:translate3d(25px,-115vh,0);
    opacity:0;
  }

}


/* صفحه */

.page{
  position:relative;
  z-index:1;
  width:100%;
  max-width:620px;
  margin:auto;
  padding:25px 15px 50px;
}


/* پروفایل */

.profile{
  text-align:center;
  padding-top:15px;
}

.profile img{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.75);
  background:#111;
  box-shadow:0 0 25px rgba(115,95,255,.7);
}

.profile h1{
  margin:13px 0 6px;
  font-size:25px;
  text-shadow:0 0 18px #7565ff;
}

.profile p{
  margin:0;
  color:#aaa6cc;
  font-size:13px;
}


/* دکمه مدیریت */

.admin{
  display:block;
  width:max-content;
  margin:18px auto 25px;
  padding:10px 18px;
  border-radius:20px;
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  font-size:12px;
}


/* عنوان */

.posts-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 2px 13px;
}

.posts-title h2{
  margin:0;
  font-size:18px;
}

.posts-title span{
  color:#7bdfff;
  font-size:11px;
}


/* پست */

.post{
  margin-bottom:15px;
  padding:16px;
  border-radius:22px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.post h3{
  margin:0 0 8px;
  font-size:17px;
}

.post p{
  margin:0 0 10px;
  color:#c8c4dd;
  font-size:13px;
  line-height:1.8;
  white-space:pre-wrap;
}

.post img,
.post video{
  display:block;
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:15px;
  margin-top:10px;
  background:#000;
}

.post audio{
  display:block;
  width:100%;
  margin-top:12px;
}

.date{
  margin-top:9px;
  color:#716d8c;
  font-size:10px;
}

.empty,
.loading{
  padding:30px 15px;
  text-align:center;
  color:#aaa6c5;
  background:rgba(255,255,255,.05);
  border-radius:20px;
}


/* موبایل */

@media(max-width:380px){

  .profile img{
    width:95px;
    height:95px;
  }

  .profile h1{
    font-size:22px;
  }

}

</style>
</head>


<body>

<span class="star" style="left:47%;animation-duration:19s;animation-delay:2s;color:#80eaff;">☆</span>
<span class="star" style="left:53%;animation-duration:15s;animation-delay:8s;color:#ff8fd8;">☆</span>
<span class="star" style="left:60%;animation-duration:13s;animation-delay:4s;color:#fff;">☆</span>
<span class="star" style="left:66%;animation-duration:18s;animation-delay:1s;color:#9d8cff;">☆</span>
<span class="star" style="left:72%;animation-duration:14s;animation-delay:6s;color:#72dfff;">☆</span>
<span class="star" style="left:78%;animation-duration:17s;animation-delay:3s;color:#ff9ddd;">☆</span>
<span class="star" style="left:83%;animation-duration:12s;animation-delay:7s;color:#b09cff;">☆</span>

<main class="page">


<!-- پروفایل -->

<section class="profile">

<img
id="profileImage"
src="https://oyowhuyzgjvpoeupoegh.supabase.co/storage/v1/object/public/Minuit%20cotier/InShot_20261002_144159070.jpg"
alt="پروفایل">

<h1 id="siteName">

</h1>

<p id="siteBio">
ساحلِ نیمه‌شب ☆
</p>

<h2>💫 پست‌ها</h2>

<span>☆ Minuit côtier ☆</span>

</div>

در حال دریافت پست‌ها... ✨
</div>

</section>


</main>


<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const postsBox =
document.getElementById("posts");

const siteName =
document.getElementById("siteName");

const siteBio =
document.getElementById("siteBio");

const profileImage =
document.getElementById("profileImage");


/* تنظیمات سایت */

async function loadSettings(){

  const {data,error} =
    await db
      .from("site_settings")
      .select("site_name,bio,image_url")
      .order("created_at",{ascending:false})
      .limit(1);

  if(error){

    console.log(error);

    return;
  }

  if(!data || !data.length){
    return;
  }

  const s=data[0];

  if(s.site_name){
    siteName.textContent=s.site_name;
  }

  if(s.bio){
    siteBio.textContent=s.bio;
  }

  if(s.image_url){
    profileImage.src=s.image_url;
  }

}


/* پست‌ها */

async function loadPosts(){

  const {data,error} =
    await db
      .from("posts")
      .select(
        "id,created_at,title,content,image_url,video_url,music_url"
      )
      .order("created_at",{ascending:false});


  if(error){

    console.log(error);

    postsBox.innerHTML=`
      <div class="empty">
        خطا در دریافت پست‌ها ❌
      </div>
    `;

    return;
  }


  if(!data || !data.length){

    postsBox.innerHTML=`
      <div class="empty">
        هنوز پستی منتشر نشده ☆
      </div>
    `;

    return;
  }


  let html="";


  data.forEach(function(post){

    html+=`

      <article class="post">

        ${
          post.title
          ? `<h3>${escapeHtml(post.title)}</h3>`
          : ""
        }

        ${
          post.content
          ? `<p>${escapeHtml(post.content)}</p>`
          : ""
        }

        ${
          post.image_url
          ? `
            <img
              src="${post.image_url}"
              alt="تصویر پست"
              loading="lazy">
          `
          : ""
        }

        ${
          post.video_url
          ? `
            <video
              src="${post.video_url}"
              controls
              preload="metadata">
            </video>
          `
          : ""
        }

        ${
          post.music_url
          ? `
            <audio
              src="${post.music_url}"
              controls>
            </audio>
          `
          : ""
        }

        ${
          post.created_at
          ? `
            <div class="date">
              ${formatDate(post.created_at)}
            </div>
          `
          : ""
        }

      </article>

    `;

  });


  postsBox.innerHTML=html;

}


/* جلوگیری از خراب شدن HTML */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* تاریخ */

function formatDate(date){

  try{

    return new Date(date)
      .toLocaleDateString("fa-IR");

  }catch{

    return "";

  }

}


/* اجرا */

loadSettings();

loadPosts();

</script>

</body>
