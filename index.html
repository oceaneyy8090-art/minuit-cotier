<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:tahoma,Arial,sans-serif;
  color:white;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 20% 10%,rgba(111,80,255,.28),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,200,255,.18),transparent 30%),
    linear-gradient(135deg,#03030d,#0b0930,#1a1050);
}

/* ستاره‌ها */

.stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  font-size:9px;
  animation:moveStar linear infinite;
  opacity:0;
  text-shadow:
    0 0 6px currentColor,
    0 0 13px currentColor;
}

@keyframes moveStar{

  0%{
    transform:translateY(110vh) translateX(0) scale(.5);
    opacity:0;
  }

  15%{
    opacity:.9;
  }

  80%{
    opacity:.9;
  }

  100%{
    transform:translateY(-15vh) translateX(35px) scale(1);
    opacity:0;
  }

}

/* صفحه */

.page{
  position:relative;
  z-index:1;

  width:100%;
  max-width:650px;

  margin:auto;
  padding:20px 15px 50px;
}

/* پروفایل */

.profile{
  text-align:center;
  padding-top:20px;
}

.profile img{
  width:115px;
  height:115px;

  border-radius:50%;

  object-fit:cover;

  border:2px solid rgba(255,255,255,.8);

  box-shadow:
    0 0 20px #7c6cff,
    0 0 45px rgba(99,75,255,.5);

  background:#111;
}

.profile h1{
  margin:15px 0 6px;

  font-size:26px;

  text-shadow:
    0 0 10px #8b7cff,
    0 0 25px #624cff;
}

.profile p{
  margin:0;

  color:#bdb8dd;

  font-size:13px;
}

/* دکمه پنل */

.admin{
  display:block;

  width:max-content;

  margin:18px auto 25px;

  padding:10px 18px;

  border-radius:20px;

  color:white;
  text-decoration:none;

  background:rgba(255,255,255,.09);

  border:1px solid rgba(255,255,255,.14);

  font-size:12px;
}

/* عنوان پست‌ها */

.posts-title{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin:20px 2px 12px;
}

.posts-title h2{
  margin:0;

  font-size:18px;
}

.posts-title span{
  color:#8edfff;

  font-size:12px;
}

/* پست */

.post{
  margin-top:15px;

  padding:17px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.045)
    );

  border:1px solid rgba(255,255,255,.11);

  box-shadow:
    0 15px 40px rgba(0,0,0,.28);
}

.post h3{
  margin:0 0 8px;

  font-size:17px;
}

.post p{
  margin:0 0 12px;

  color:#c8c4df;

  font-size:13px;

  line-height:1.8;

  white-space:pre-wrap;
}

.post img,
.post video{
  width:100%;

  max-height:430px;

  object-fit:contain;

  border-radius:17px;

  display:block;

  margin-top:10px;

  background:#020208;
}

.post audio{
  width:100%;

  margin-top:12px;
}

.date{
  margin-top:10px;

  color:#777493;

  font-size:10px;
}

.empty{
  text-align:center;

  padding:35px 15px;

  color:#aaa6c5;

  background:rgba(255,255,255,.05);

  border-radius:22px;
}

.loading{
  text-align:center;

  padding:30px;

  color:#aaa6c5;
}

/* موبایل */

@media(max-width:380px){

  .profile img{
    width:100px;
    height:100px;
  }

  .profile h1{
    font-size:22px;
  }

}

<script>

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const postsBox =
document.getElementById("posts");

const siteName =
document.getElementById("siteName");

const siteBio =
document.getElementById("siteBio");

const profileImage =
document.getElementById("profileImage");


/* گرفتن تنظیمات */

async function loadSettings(){

  const {data,error} =
    await db
      .from("site_settings")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(1);

  if(error){

    console.log(error);

    return;
  }

  if(!data || !data.length){

    return;
  }

  const s=data[0];

  if(s.site_name){

    siteName.textContent =
      s.site_name;

  }

  if(s.bio){

    siteBio.textContent =
      s.bio;

  }

  if(s.image_url){

    profileImage.src =
      s.image_url;

  }

}


/* نمایش پست‌ها */

async function loadPosts(){

  const {data,error} =
    await db
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    console.error(error);

    postsBox.innerHTML=`
      <div class="empty">
        خطا در دریافت پست‌ها ❌
      </div>
    `;

    return;
  }


  if(!data || !data.length){

    postsBox.innerHTML=`
      <div class="empty">
        هنوز پستی منتشر نشده ☆
      </div>
    `;

    return;
  }


  let html="";


  data.forEach(function(post){

    html+=`

      <article class="post">

        ${
          post.title
          ?
          `<h3>${escapeHtml(post.title)}</h3>`
          :
          ""
        }

        ${
          post.content
          ?
          `<p>${escapeHtml(post.content)}</p>`
          :
          ""
        }

        ${
          post.image_url
          ?
          `<img
             src="${post.image_url}"
             alt="تصویر پست"
             loading="lazy">
          `
          :
          ""
        }

        ${
          post.video_url
          ?
          `<video
             src="${post.video_url}"
             controls
             preload="metadata">
          </video>
          `
          :
          ""
        }

        ${
          post.music_url
          ?
          `<audio
             src="${post.music_url}"
             controls>
          </audio>
          `
          :
          ""
        }

        ${
          post.created_at
          ?
          `<div class="date">
             ${formatDate(post.created_at)}
           </div>`
          :
          ""
        }

      </article>

    `;

  });


  postsBox.innerHTML=html;

}


/* امنیت متن */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* تاریخ */

function formatDate(date){

  try{

    return new Date(date)
      .toLocaleDateString("fa-IR");

  }catch{

    return "";

  }

}


/* اجرا */

loadSettings();

loadPosts();

</script>
