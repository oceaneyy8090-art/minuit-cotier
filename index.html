<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  color:white;
}

#sky{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  touch-action:none;
}

#postWindow{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(88%,420px);
  max-height:80vh;
  overflow:auto;
  padding:24px;
  border-radius:24px;
  background:rgba(7,7,25,.96);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 0 50px rgba(90,70,255,.25);
  display:none;
  z-index:20;
}

#postTitle{
  margin:0 0 12px;
  font-size:22px;
}

#postText{
  white-space:pre-wrap;
  line-height:1.8;
  color:#ddd;
}

#closePost{
  position:absolute;
  right:14px;
  top:10px;
  border:0;
  background:none;
  color:white;
  font-size:26px;
}

#likeButton{
  margin-top:20px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:30px;
  padding:10px 20px;
  font-size:20px;
}

#hint{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.45);
  font-size:12px;
  z-index:5;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<div id="hint">کشیدن صفحه = حرکت در آسمان ✦</div>

<div id="postWindow">
  <button id="closePost">×</button>
  <h2 id="postTitle"></h2>
  <div id="postText"></div>
  <button id="likeButton">♡</button>
</div>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

/* =========================
   CAMERA
========================= */

let cameraX = 0;
let cameraY = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown",e=>{
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;

  cameraX += e.clientX-lastX;
  cameraY += e.clientY-lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("pointerup",()=>{
  dragging=false;
});

canvas.addEventListener("pointercancel",()=>{
  dragging=false;
});

/* =========================
   STARS
========================= */

const WORLD = 24000;
const STAR_COUNT = 3000;

const starColors = [
  "#ffffff",
  "#ffd6f6",
  "#b9d8ff",
  "#d5b8ff",
  "#8ffcff",
  "#ffb9e8"
];

const stars=[];

for(let i=0;i<STAR_COUNT;i++){
  stars.push({
    x:(Math.random()-.5)*WORLD,
    y:(Math.random()-.5)*WORLD,
    size:13+Math.random()*4,
    color:starColors[Math.floor(Math.random()*starColors.length)],
    phase:Math.random()*Math.PI*2,
    speed:.0005+Math.random()*.0015
  });
}

/* =========================
   POSTS
========================= */

const posts=[
  {
    id:1,
    x:0,
    y:0,
    title:"پست اول 🌛",
    text:"به Minuit côtier خوش اومدی ✨\n\nاین اولین پست آزمایشی کاناله."
  }
];

/* =========================
   BUTTERFLIES
   FORMATION:
   1 → 2 → 4 → 5
========================= */

function createButterflies(post){

  /*
     هر پروانه یک جای ثابت نسبت به
     مسیر مشترک دارد.

     جلو:
             🦋

     پشت:
          🦋   🦋

     پشت‌تر:
       🦋  🦋  🦋  🦋

     انتها:
    🦋 🦲 🦲 🦲 🦲
  */

  return [

    // ردیف اول: 1
    {side:0, row:0, gap:0},

    // ردیف دوم: 2
    {side:-1, row:1, gap:1},
    {side:1, row:1, gap:1},

    // ردیف سوم: 4
    {side:-3, row:2, gap:2},
    {side:-1, row:2, gap:2},
    {side:1, row:2, gap:2},
    {side:3, row:2, gap:2},

    // ردیف چهارم: 5
    {side:-4, row:3, gap:3},
    {side:-2, row:3, gap:3},
    {side:0, row:3, gap:3},
    {side:2, row:3, gap:3},
    {side:4, row:3, gap:3}

  ].map((b,i)=>({
    ...b,
    index:i,
    phase:Math.random()*Math.PI*2
  }));
}

for(const post of posts){
  post.butterflies=createButterflies(post);
  post.pathOffset=Math.random()*Math.PI*2;
}

/* =========================
   BUTTERFLY PATH
========================= */

function butterflyPosition(post,time,b){

  /*
     یک مسیر مشترک و خمیده دور ماه.

     هیچ پروانه‌ای مسیر جداگانه ندارد.
     همه همان مسیر را دنبال می‌کنند.
  */

  const baseSpeed=.000035;

  const progress =
    time*baseSpeed +
    post.pathOffset;

  /*
     مسیر خمیده:
     اول جلو می‌رود،
     بعد آرام برمی‌گردد.
  */

  const wave =
    Math.sin(progress)*0.95;

  const centerAngle =
    wave*1.15;

  /*
     فاصله بین ردیف‌ها
  */

  const rowDistance = 55;

  /*
     فاصله بین دو پروانه کنار هم
  */

  const sideDistance = 58;

  /*
     مسیر اصلی دور ماه
  */

  const rx = 210;
  const ry = 145;

  const centerX =
    post.x +
    Math.cos(centerAngle)*rx;

  const centerY =
    post.y +
    Math.sin(centerAngle)*ry;

  /*
     جهت مسیر برای خم شدن صف
  */

  const tangentX =
    -Math.sin(centerAngle)*rx;

  const tangentY =
    Math.cos(centerAngle)*ry;

  const tangentLength =
    Math.hypot(tangentX,tangentY)||1;

  const tx=tangentX/tangentLength;
  const ty=tangentY/tangentLength;

  /*
     بردار عمودی نسبت به مسیر
  */

  const nx=-ty;
  const ny=tx;

  /*
     هر ردیف کمی عقب‌تر از ردیف جلویی.
     بنابراین شکل ۱→۲→۴→۵ حفظ می‌شود.
  */

  const behind =
    b.row*rowDistance;

  const side =
    b.side*sideDistance;

  return {
    x:centerX - tx*behind + nx*side,
    y:centerY - ty*behind + ny*side
  };
}

/* =========================
   DRAW
========================= */

let activePost=null;
let likedPosts=new Set();

function drawStars(time){

  for(const s of stars){

    const x =
      s.x +
      cameraX +
      Math.sin(time*s.speed+s.phase)*2;

    const y =
      s.y +
      cameraY +
      Math.cos(time*s.speed+s.phase)*2;

    if(
      x < -30 ||
      x > W+30 ||
      y < -30 ||
      y > H+30
    ) continue;

    const twinkle =
      .65+
      Math.sin(time*.002+s.phase)*.25;

    ctx.save();

    ctx.globalAlpha=twinkle;

    ctx.shadowBlur=7;
    ctx.shadowColor=s.color;

    ctx.fillStyle=s.color;

    ctx.font=
      `${s.size}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText("☆",x,y);

    ctx.restore();
  }
}

/* =========================
   BUTTERFLIES
========================= */

function drawButterflies(time){

  for(const post of posts){

    if(!post.butterflies) continue;

    for(const b of post.butterflies){

      const p =
        butterflyPosition(post,time,b);

      const sx =
        p.x + cameraX;

      const sy =
        p.y + cameraY;

      if(
        sx < -50 ||
        sx > W+50 ||
        sy < -50 ||
        sy > H+50
      ) continue;

      /*
         حرکت خیلی ظریف بال‌ها،
         ولی خود دسته کاملاً یکپارچه است.
      */

      const flutter =
        Math.sin(time*.004+b.index*.3)*2;

      ctx.save();

      ctx.translate(
        sx,
        sy+flutter
      );

      ctx.font="19px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";

      ctx.shadowBlur=8;
      ctx.shadowColor="#d9a8ff";

      ctx.fillText("🦋",0,0);

      ctx.restore();
    }
  }
}

/* =========================
   POSTS
========================= */

function drawPosts(){

  for(const post of posts){

    const x=post.x+cameraX;
    const y=post.y+cameraY;

    if(
      x<-100 ||
      x>W+100 ||
      y<-100 ||
      y>H+100
    ) continue;

    /*
       پروانه‌ها اول رسم می‌شوند
       و ماه بعد از آن‌ها می‌آید.
       پس 🌛 همیشه واضح دیده می‌شود.
    */

    ctx.save();

    ctx.font="40px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.shadowBlur=18;
    ctx.shadowColor="#b59cff";

    ctx.fillText("🌛",x,y);

    ctx.restore();
  }
}

/* =========================
   LIKE STARS
========================= */

const flyingStars=[];

function createLikeStars(post){

  const sx=post.x+cameraX;
  const sy=post.y+cameraY;

  for(let i=0;i<100;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      1.5+Math.random()*3;

    flyingStars.push({
      x:sx,
      y:sy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      size:10+Math.random()*8,
      color:
        starColors[
          Math.floor(
            Math.random()*starColors.length
          )
        ]
    });
  }
}

function drawLikeStars(){

  for(let i=flyingStars.length-1;i>=0;i--){

    const s=flyingStars[i];

    s.x+=s.vx;
    s.y+=s.vy;

    s.vx*=.985;
    s.vy*=.985;

    s.life-=.012;

    if(s.life<=0){
      flyingStars.splice(i,1);
      continue;
    }

    ctx.save();

    ctx.globalAlpha=s.life;

    ctx.fillStyle=s.color;

    ctx.shadowBlur=8;
    ctx.shadowColor=s.color;

    ctx.font=`${s.size}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
      "☆",
      s.x,
      s.y
    );

    ctx.restore();
  }
}

/* =========================
   ANIMATION
========================= */

function animate(time){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawStars(time);

  drawButterflies(time);

  drawPosts();

  drawLikeStars();

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

/* =========================
   POST CLICK
========================= */

function findPostAt(x,y){

  for(const post of posts){

    const px=post.x+cameraX;
    const py=post.y+cameraY;

    const d=
      Math.hypot(
        x-px,
        y-py
      );

    if(d<55){
      return post;
    }
  }

  return null;
}

let moved=false;

canvas.addEventListener("pointerdown",()=>{
  moved=false;
});

canvas.addEventListener("pointermove",()=>{
  moved=true;
});

canvas.addEventListener("click",e=>{

  if(moved) return;

  const post=
    findPostAt(
      e.clientX,
      e.clientY
    );

  if(post){

    activePost=post;

    document.getElementById(
      "postTitle"
    ).textContent=post.title;

    document.getElementById(
      "postText"
    ).textContent=post.text;

    document.getElementById(
      "likeButton"
    ).textContent=
      likedPosts.has(post.id)
      ?"♥"
      :"♡";

    document.getElementById(
      "postWindow"
    ).style.display="block";
  }
});

/* =========================
   CLOSE
========================= */

document.getElementById(
  "closePost"
).onclick=()=>{

  document.getElementById(
    "postWindow"
  ).style.display="none";
};

/* =========================
   LIKE
========================= */

document.getElementById(
  "likeButton"
).onclick=()=>{

  if(!activePost) return;

  if(likedPosts.has(activePost.id))
    return;

  likedPosts.add(activePost.id);

  document.getElementById(
    "likeButton"
  ).textContent="♥";

  createLikeStars(activePost);
};
</script>

</body>
</html>
