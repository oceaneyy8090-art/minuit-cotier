<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   حرکت کهکشان
========================================= */

const space =
document.getElementById("space");

const galaxy =
document.getElementById("galaxy");

let cameraX = 0;
let cameraY = 0;

let targetX = 0;
let targetY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let originalX = 0;
let originalY = 0;


/* کشیدن */

space.addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    space.classList.add("dragging");

    startX = e.clientX;
    startY = e.clientY;

    originalX = targetX;
    originalY = targetY;

    try{
      space.setPointerCapture(e.pointerId);
    }catch(err){}

    startAmbient();
  }
);


space.addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    targetX =
      originalX +
      (e.clientX - startX);

    targetY =
      originalY +
      (e.clientY - startY);

    limitCamera();
  }
);


function stopDrag(e){

  dragging = false;

  space.classList.remove("dragging");

  try{
    space.releasePointerCapture(e.pointerId);
  }catch(err){}
}


space.addEventListener(
  "pointerup",
  stopDrag
);

space.addEventListener(
  "pointercancel",
  stopDrag
);


/* محدودیت */

function limitCamera(){

  const maxX =
    3500;

  const maxY =
    3500;

  targetX =
    Math.max(
      -maxX,
      Math.min(maxX,targetX)
    );

  targetY =
    Math.max(
      -maxY,
      Math.min(maxY,targetY)
    );
}


/* حرکت نرم */

function animate(){

  cameraX +=
    (targetX-cameraX)*.13;

  cameraY +=
    (targetY-cameraY)*.13;

  galaxy.style.transform =
    `translate(
      calc(-50% + ${cameraX}px),
      calc(-50% + ${cameraY}px)
    )`;

  requestAnimationFrame(animate);
}

animate();


/* =========================================
   ستاره های زیاد
========================================= */

const starColors = [
  "#ffffff",
  "#79ddff",
  "#b887ff",
  "#ff8ed9",
  "#ffe875",
  "#70ffb0",
  "#91a9ff"
];


for(let i=0;i<800;i++){

  const star =
    document.createElement("div");

  star.className = "star";

  star.textContent =
    Math.random()>.35
    ? "☆"
    : "✦";

  star.style.left =
    Math.random()*6800+"px";

  star.style.top =
    Math.random()*6800+"px";

  star.style.color =
    starColors[
      Math.floor(
        Math.random()*starColors.length
      )
    ];

  star.style.fontSize =
    5+Math.random()*8+"px";

  star.style.setProperty(
    "--speed",
    1.5+Math.random()*4+"s"
  );

  star.style.setProperty(
    "--drift",
    3+Math.random()*8+"s"
  );

  star.style.setProperty(
    "--dx",
    -30+Math.random()*60+"px"
  );

  star.style.setProperty(
    "--dy",
    -30+Math.random()*60+"px"
  );

  galaxy.appendChild(star);
}


/* =========================================
   ستاره دنباله دار
========================================= */

function makeComet(
  sx,sy,ex,ey,time
){

  const comet =
    document.createElement("div");

  comet.className="comet";

  comet.style.left=sx+"px";
  comet.style.top=sy+"px";

  galaxy.appendChild(comet);

  const started =
    performance.now();

  function move(now){

    let p =
      (now-started)/time;

    if(p>=1){

      comet.remove();

      setTimeout(
        ()=>{
          makeComet(
            sx,sy,ex,ey,time
          );
        },
        3000+
        Math.random()*5000
      );

      return;
    }

    const x =
      sx+(ex-sx)*p;

    const y =
      sy+(ey-sy)*p;

    comet.style.left=x+"px";
    comet.style.top=y+"px";

    requestAnimationFrame(move);
  }

  requestAnimationFrame(move);
}


makeComet(
  100,
  900,
  3200,
  300,
  9000
);

makeComet(
  6500,
  1700,
  3600,
  700,
  10000
);

makeComet(
  400,
  6000,
  6000,
  4700,
  11000
);


/* =========================================
   موزیک لایت بدون فایل خارجی
========================================= */

let audioContext = null;
let master = null;
let musicOn = false;
let musicTimer = null;

function startAmbient(){

  if(musicOn) return;

  musicOn = true;

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    master =
      audioContext.createGain();

    master.gain.value=.035;

    master.connect(
      audioContext.destination
    );

    playAmbientNote();

    musicTimer =
      setInterval(
        playAmbientNote,
        2600
      );

    document.getElementById(
      "musicBtn"
    ).textContent="♫";

  }catch(err){

    console.log(err);
  }
}


function playAmbientNote(){

  if(!audioContext || !master)
    return;

  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  const frequencies =
    [
      174.61,
      220,
      261.63,
      329.63,
      392
    ];

  const frequency =
    frequencies[
      Math.floor(
        Math.random()*frequencies.length
      )
    ];

  osc.frequency.value =
    frequency;

  osc.type="sine";

  gain.gain.setValueAtTime(
    0,
    audioContext.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    .08,
    audioContext.currentTime+.8
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+3
  );

  osc.connect(gain);
  gain.connect(master);

  osc.start();

  osc.stop(
    audioContext.currentTime+3.1
  );
}


document.getElementById(
  "musicBtn"
).addEventListener(
  "click",
  e => {

    e.stopPropagation();

    if(!musicOn){

      startAmbient();

    }else{

      musicOn=false;

      clearInterval(musicTimer);

      if(master){
        master.gain.value=0;
      }

      document.getElementById(
        "musicBtn"
      ).textContent="🔇";
    }
  }
);


/* =========================================
   تنظیمات
========================================= */

async function loadSettings(){

  const result =
    await supabaseClient
      .from("site_settings")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(1);

  if(result.error){
    console.log(result.error);
    return;
  }

  if(!result.data?.length)
    return;

  const s =
    result.data[0];

  if(s.site_name){

    document.getElementById(
      "siteName"
    ).textContent =
      s.site_name;
  }

  if(s.bio){

    document.getElementById(
      "siteBio"
    ).textContent =
      s.bio;
  }

  if(s.image_url){

    document.getElementById(
      "profileImage"
    ).src =
      s.image_url;
  }
}


/* =========================================
   URL امن
========================================= */

function safeUrl(value){

  if(!value)
    return "";

  try{

    const u =
      new URL(value);

    if(
      u.protocol==="https:" ||
      u.protocol==="http:"
    )
      return u.href;

  }catch(e){}

  return "";
}


/* =========================================
   متن امن
========================================= */

function escapeHtml(text){

  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================
   باز کردن پست
========================================= */

function openPost(post){

  const viewer =
    document.getElementById("viewer");

  const title =
    document.getElementById("viewerTitle");

  const content =
    document.getElementById("viewerContent");

  title.textContent =
    post.title || "";

  let html="";

  if(post.content){

    html +=
      `<p>${escapeHtml(
        post.content
      )}</p>`;
  }

  const image =
    safeUrl(post.image_url);

  const video =
    safeUrl(post.video_url);

  const audio =
    safeUrl(post.audio_url);

  if(image){

    html +=
      `<img
        src="${image}"
        alt="">`;
  }

  if(video){

    html +=
      `<video
        controls
        playsinline
        src="${video}">
      </video>`;
  }

  if(audio){

    html +=
      `<audio
        controls
        src="${audio}">
      </audio>`;
  }

  content.innerHTML=html;

  viewer.classList.add("show");
}


/* =========================================
   بستن
========================================= */

function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("show");

  document
    .getElementById("viewerContent")
    .innerHTML="";
}


document
  .getElementById("viewer")
  .addEventListener(

    e => {

      if(
        e.target.id==="viewer"
      ){
        closeViewer();
      }
    }
  );


/* =========================================
   100 قلب رنگی
========================================= */

function explodeHearts(event){

  const rect =
    event.currentTarget
      .getBoundingClientRect();

  const x =
    rect.left+
    rect.width/2;

  const y =
    rect.top+
    rect.height/2;

  const colors=[
    "#ff3b81",
    "#ff4f4f",
    "#ff9f1c",
    "#ffe600",
    "#62e6ff",
    "#7c5cff",
    "#ff72ff",
    "#55ff9a",
    "#ffffff",
    "#ff68c4"
  ];

  for(let i=0;i<100;i++){

    const heart =
      document.createElement("span");

    heart.className=
      "heart-particle";

    heart.textContent="♥";

    heart.style.left=x+"px";
    heart.style.top=y+"px";

    heart.style.color =
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    const angle =
      Math.random()*Math.PI*2;

    const distance =
      40+
      Math.random()*260;

    heart.style.setProperty(
      "--x",
      Math.cos(angle)*distance+"px"
    );

    heart.style.setProperty(
      "--y",
      Math.sin(angle)*distance+"px"
    );

    heart.style.setProperty(
      "--r",
      -180+
      Math.random()*360+
      "deg"
    );

    heart.style.fontSize =
      7+
      Math.random()*9+
      "px";

    document.body.appendChild(
      heart
    );

    setTimeout(
      ()=>{
        heart.remove();
      },
      2000
    );
  }
}

async function loadPosts(){

  const result =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(result.error){

    console.log(
      "posts:",
      result.error
    );

    return;
  }

  const posts =
    result.data || [];

  posts.forEach(
    (post,index)=>{

      const pos =
        locations[
          index%locations.length
        ];

      const point =
        document.createElement(
          "div"
        );

      point.className=
        "content-point";

      point.style.left=
        pos[0]+"px";

      point.style.top=
        pos[1]+"px";

      point.addEventListener(
        "pointerdown",
        e=>{
          e.stopPropagation();
        }
      );

      point.addEventListener(
        "click",
        e=>{

          e.stopPropagation();

          openPost(post);
        }
      );

      galaxy.appendChild(
        point
      );
    }
  );
}
