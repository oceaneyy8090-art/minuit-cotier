<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Minuit côtier</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
overflow:hidden;
background:#030313;
font-family:tahoma;
}


#space{
position:fixed;
inset:0;
overflow:hidden;
background:
radial-gradient(circle,#342060,#05051b 60%);
}


#galaxy{

position:absolute;

width:9000px;
height:9000px;

left:50%;
top:50%;

transform:translate(-50%,-50%);

}



/* ستاره */

.star{

position:absolute;

font-size:10px;

animation:
starMove 6s infinite alternate ease-in-out;

text-shadow:
0 0 10px currentColor;

}



@keyframes starMove{

from{
transform:translate(0,0);
}

to{
transform:translate(20px,40px);
}

}



/* 💫 پست */


.postStar{

position:absolute;

font-size:35px;

cursor:pointer;

filter:
drop-shadow(0 0 15px #ffe36b);

animation:
pulse 2s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.3);

}

}



/* پروفایل */


.profile{

position:absolute;

top:4300px;

left:4300px;

text-align:center;

color:white;

}



.profile img{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

box-shadow:
0 0 30px #8bdcff;

}



.profile h1{

font-size:20px;

}





/* پنجره */

#viewer{

display:none;

position:fixed;

inset:0;

background:#000b;

align-items:center;

justify-content:center;

z-index:20;

}



#viewer.show{

display:flex;

}



.box{

width:90%;

max-width:500px;

background:#161638;

color:white;

padding:20px;

border-radius:25px;

text-align:center;

}


.box img,
.box video{

width:100%;

border-radius:15px;

}


</style>

</head>


<body>


<div id="space">

<div id="galaxy">


<div class="profile">

<img id="profileImg">

<h1 id="profileName">
Minuit côtier
</h1>

<p id="profileBio"></p>


</div>


</div>

</div>



<div id="viewer">

<div class="box">

<h2 id="title"></h2>

<div id="content"></div>

<button onclick="closePost()">
بستن
</button>

</div>

</div>



<script>
// =======================
// حرکت دنیا با انگشت
// =======================

const space=document.getElementById("space");
const galaxy=document.getElementById("galaxy");

let x=0;
let y=0;

let down=false;
let sx=0;
let sy=0;


space.onpointerdown=e=>{

down=true;

sx=e.clientX;
sy=e.clientY;

};



space.onpointermove=e=>{

if(!down)return;


x+=e.clientX-sx;
y+=e.clientY-sy;


sx=e.clientX;
sy=e.clientY;



galaxy.style.transform=
`
translate(
calc(-50% + ${x}px),
calc(-50% + ${y}px)
)
`;

};



space.onpointerup=()=>{

down=false;

};





// =======================
// ستاره های زیاد
// =======================


const colors=[

"#ffffff",
"#9eeaff",
"#ffc8eb",
"#d8b7ff",
"#fff29a",
"#aaffdd"

];


for(let i=0;i<900;i++){


let s=document.createElement("div");


s.className="star";


s.innerHTML=
Math.random()>0.4
?"☆"
:"✦";


s.style.left=
Math.random()*8500+"px";


s.style.top=
Math.random()*8500+"px";



s.style.color=
colors[
Math.floor(
Math.random()*colors.length
)
];



s.style.fontSize=
(5+Math.random()*9)+"px";



s.style.animationDuration=
(3+Math.random()*7)+"s";



galaxy.appendChild(s);


}





// =======================
// 💫 ساخت پست
// =======================


function createPostStar(x,y,post){


let star=document.createElement("div");


star.className="postStar";


star.innerHTML="💫";


star.style.left=x+"px";


star.style.top=y+"px";



star.onclick=()=>{

openPost(post);

};



galaxy.appendChild(star);


}





// =======================
// نمایش پست
// =======================


function openPost(post){


document
.getElementById("title")
.innerText=
post.title || "💫";


let html="";


if(post.content){

html+=
`<p>${post.content}</p>`;

}


if(post.image_url){

html+=
`<img src="${post.image_url}">`;

}



if(post.video_url){

html+=
`<video controls src="${post.video_url}"></video>`;

}



document
.getElementById("content")
.innerHTML=html;



document
.getElementById("viewer")
.classList.add("show");


}



function closePost(){

document
.getElementById("viewer")
.classList.remove("show");

}




// =======================
// شهاب کوچک
// =======================


function comet(){


let c=document.createElement("div");


c.innerHTML="✦";

c.style.position="absolute";

c.style.color="white";

c.style.fontSize="18px";


let a=Math.random()*8000;

c.style.left=a+"px";

c.style.top="0px";


galaxy.appendChild(c);



let t=0;


let move=setInterval(()=>{


t+=15;


c.style.transform=
`translate(${t}px,${t}px)`;


if(t>5000){

c.remove();

clearInterval(move);

}


},30);


}



setInterval(comet,6000);
// =======================
// SUPABASE
// =======================


const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// =======================
// آوردن پروفایل
// =======================


async function loadProfile(){


const {data,error}=

await db
.from("site_settings")
.select("*")
.order(
"created_at",
{
ascending:false
}
)
.limit(1);



if(error){

console.log(error);

return;

}



if(!data[0])return;


let p=data[0];



if(p.image_url){

document
.getElementById("profileImg")
.src=
p.image_url;

}



if(p.site_name){

document
.getElementById("profileName")
.innerText=
p.site_name;

}



if(p.bio){

document
.getElementById("profileBio")
.innerText=
p.bio;

}


}




// =======================
// آوردن پست ها
// =======================


async function loadPosts(){


const {data,error}=

await db
.from("posts")
.select("*")
.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



data.forEach((post,index)=>{



let x =
900+(index*650);


let y =
700+
((index%6)*850);



createPostStar(
x,
y,
post
);



});



}





// شروع

loadProfile();

loadPosts();
</script>

</body>
</html>
