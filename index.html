<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    background:#000;
}

/* پنجره پست */

#postWindow{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(88%,420px);
    max-height:80vh;
    overflow:auto;

    background:rgba(8,8,15,.96);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;

    padding:22px;
    box-sizing:border-box;

    color:white;
    text-align:center;

    z-index:20;

    box-shadow:
        0 0 35px rgba(160,120,255,.25);
}

#postWindow h2{
    margin:5px 0 15px;
    font-size:23px;
}

#postText{
    color:#ddd;
    line-height:1.8;
    white-space:pre-wrap;
}

#closePost{
    position:absolute;
    top:10px;
    right:12px;

    width:38px;
    height:38px;

    border:0;
    border-radius:50%;

    background:#171722;
    color:white;

    font-size:20px;
}

#likeButton{
    margin-top:20px;

    width:64px;
    height:52px;

    border:0;
    border-radius:18px;

    background:#15151f;
    color:white;

    font-size:30px;
}

#likeButton.liked{
    color:#ff4fa3;
    text-shadow:
        0 0 12px #ff4fa3,
        0 0 25px #ff4fa3;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<div id="postWindow">

    <button id="closePost">×</button>

    <h2 id="postTitle"></h2>

    <div id="postText"></div>

    <button id="likeButton">♡</button>

</div>

<script>

const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;


/* =========================
   اندازه صفحه
========================= */

function resize(){

    W=innerWidth;
    H=innerHeight;

    const dpr=Math.min(
        devicePixelRatio||1,
        1.5
    );

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

addEventListener("resize",resize);
resize();


/* =========================
   دوربین
========================= */

let camX=0;
let camY=0;

let targetX=0;
let targetY=0;

let dragging=false;

let startX=0;
let startY=0;

let startCamX=0;
let startCamY=0;


/* =========================
   رنگ ستاره‌ها
========================= */

const colors=[
    "#ffffff",
    "#ffd5ef",
    "#ff9ed6",
    "#ffb8e5",
    "#d3baff",
    "#b59cff",
    "#a9d9ff",
    "#78c8ff",
    "#9df3ff",
    "#e3c8ff",
    "#f4b9ff",
    "#c5ffe3"
];


/* =========================
   آسمان
========================= */

const WORLD=24000;

const STAR_COUNT=3000;

const stars=[];


/* =========================
   ستاره‌های اصلی
========================= */

for(let i=0;i<STAR_COUNT;i++){

    stars.push({

        x:(Math.random()-.5)*WORLD,

        y:(Math.random()-.5)*WORLD,

        size:13+Math.random()*4,

        color:
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ],

        vx:(Math.random()-.5)*0.8,

        vy:(Math.random()-.5)*0.8,

        phase:
            Math.random()*Math.PI*2
    });
}


/* =========================
   پست‌ها
========================= */

const posts=[

    {
        id:1,

        x:0,
        y:0,

        title:"پست اول 🌙",

        text:
        "به Minuit côtier خوش اومدی ✨\n\n"+
        "این اولین پست آزمایشی کاناله."
    }

];


/* =========================
   پروانه‌های راهنما
========================= */

/*
   هر پست یک دسته پروانه دارد.

                🦋
         🦋    🦋    🦋
      🦋  🦋   🦋   🦋  🦋

   پروانه‌ها همیشه به سمت 🌛 همان پست حرکت می‌کنند.
*/

const butterflyColors=[
    "#ffd6f6",
    "#ff9edc",
    "#c9a8ff",
    "#9edcff",
    "#b8f5ff",
    "#f4c8ff"
];

const butterflies=[];


/* برای هر پست یک دسته 7 تایی */

function createButterflies(){

    butterflies.length=0;

    for(const post of posts){

        for(let i=0;i<7;i++){

            butterflies.push({

                postId:post.id,

                row:
                    i===0
                    ? 0
                    : i<=3
                    ? 1
                    : 2,

                index:i,

                phase:
                    Math.random()*
                    Math.PI*2,

                speed:
                    .35+
                    Math.random()*.18,

                color:
                    butterflyColors[
                        Math.floor(
                            Math.random()*
                            butterflyColors.length
                        )
                    ]
            });
        }
    }
}


/* جای هر پروانه نسبت به ماه */

function getButterflyPosition(
    butterfly,
    post,
    time
){

    /*
       فاصله دسته از ماه
    */

    const baseDistance=135;

    /*
       حرکت آرام دسته
    */

    const forward=
        ((time*.035*
        butterfly.speed)%100);

    /*
       سه ردیف:

                  0
             1    2    3
          4    5    6
    */

    let ox=0;
    let oy=0;

    if(butterfly.row===0){

        ox=0;
        oy=-42;

    }else if(butterfly.row===1){

        const positions=[
            -48,
            0,
            48
        ];

        ox=
            positions[
                butterfly.index-1
            ];

        oy=0;

    }else{

        const positions=[
            -78,
            -39,
            0,
            39,
            78
        ];

        ox=
            positions[
                butterfly.index-2
            ];

        oy=43;
    }


    /*
       جهت از مرکز صفحه به سمت پست
    */

    const dx=
        post.x;

    const dy=
        post.y;

    const length=
        Math.hypot(dx,dy)||1;

    const dirX=
        dx/length;

    const dirY=
        dy/length;


    /*
       بردار عمود برای پخش V شکل
    */

    const sideX=-dirY;
    const sideY=dirX;


    /*
       جای دسته کمی دورتر از ماه
    */

    const distance=
        baseDistance+forward;

    let worldX=
        post.x-
        dirX*distance+
        sideX*ox+
        Math.sin(
            time*.003+
            butterfly.phase
        )*5;

    let worldY=
        post.y-
        dirY*distance+
        sideY*ox+
        oy+
        Math.cos(
            time*.003+
            butterfly.phase
        )*4;


    /*
       پروانه‌ها کمی به سمت ماه می‌روند
    */

    worldX+=dirX*forward*.35;
    worldY+=dirY*forward*.35;


    return {
        x:worldX,
        y:worldY
    };
}


/* رسم همه پروانه‌ها */

function drawButterflies(time){

    if(!butterflies.length)
        return;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const butterfly of butterflies){

        const post=
            posts.find(
                p=>p.id===butterfly.postId
            );

        if(!post)
            continue;


        const pos=
            getButterflyPosition(
                butterfly,
                post,
                time
            );


        const x=
            pos.x-
            camX+
            W/2;

        const y=
            pos.y-
            camY+
            H/2;


        if(
            x<-100 ||
            x>W+100 ||
            y<-100 ||
            y>H+100
        ){
            continue;
        }


        /*
           بال زدن آرام
        */

        const wing=
            Math.sin(
                time*.015+
                butterfly.phase
            );


        const size=
            15+
            wing*2;


        ctx.globalAlpha=.75;


        ctx.fillStyle=
            butterfly.color;

        ctx.shadowColor=
            butterfly.color;

        ctx.shadowBlur=7;


        ctx.font=
            `${size}px Arial`;


        ctx.fillText(
            "🦋",
            x,
            y
        );


        ctx.shadowBlur=0;
    }

    ctx.globalAlpha=1;
}


/* =========================
   ماه‌ها
========================= */

function drawPosts(){

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const post of posts){

        const x=
            post.x-
            camX+
            W/2;

        const y=
            post.y-
            camY+
            H/2;


        if(
            x<-80 ||
            x>W+80 ||
            y<-80 ||
            y>H+80
        ){
            continue;
        }


        ctx.font="32px Arial";

        ctx.shadowColor="#ffffff";
        ctx.shadowBlur=7;

        ctx.fillText(
            "🌛",
            x,
            y
        );

        ctx.shadowBlur=0;
    }
}


/* =========================
   ستاره‌های لایک
========================= */

const likeStars=[];


/*
   دقیقاً 100 ستاره
   از خود محل پست شروع می‌شوند
*/

function createLikeStars(){

    if(!activePost)
        return;


    const startX=
        activePost.x-
        camX+
        W/2;

    const startY=
        activePost.y-
        camY+
        H/2;


    for(let i=0;i<100;i++){

        const angle=
            Math.random()*
            Math.PI*2;

        const speed=
            1.5+
            Math.random()*4;


        likeStars.push({

            x:startX,

            y:startY,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            size:
                13+
                Math.random()*5,

            color:
                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ],

            life:
                100+
                Math.random()*100
        });
    }
}


function drawLikeStars(){

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(
        let i=likeStars.length-1;
        i>=0;
        i--
    ){

        const s=
            likeStars[i];

        s.x+=s.vx;
        s.y+=s.vy;

        s.vx*=.998;
        s.vy*=.998;

        s.life--;

        if(s.life<=0){

            likeStars.splice(
                i,
                1
            );

            continue;
        }

        ctx.globalAlpha=
            Math.min(
                1,
                s.life/35
            );

        ctx.fillStyle=
            s.color;

        ctx.shadowColor=
            s.color;

        ctx.shadowBlur=5;

        ctx.font=
            `normal ${s.size}px Arial`;

        ctx.fillText(
            "☆",
            s.x,
            s.y
        );

        ctx.shadowBlur=0;
    }

    ctx.globalAlpha=1;
}


/* =========================
   پس‌زمینه
========================= */

function drawBackground(){

    ctx.fillStyle="#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================
   ستاره‌های آسمان
========================= */

function drawStars(time){

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const s of stars){

        s.x+=s.vx;
        s.y+=s.vy;


        if(s.x>WORLD/2)
            s.x=-WORLD/2;

        if(s.x<-WORLD/2)
            s.x=WORLD/2;

        if(s.y>WORLD/2)
            s.y=-WORLD/2;

        if(s.y<-WORLD/2)
            s.y=WORLD/2;


        const x=
            s.x-
            camX+
            W/2;

        const y=
            s.y-
            camY+
            H/2;


        if(
            x<-40 ||
            x>W+40 ||
            y<-40 ||
            y>H+40
        ){
            continue;
        }


        const alpha=
            .88+
            Math.sin(
                time*.002+
                s.phase
            )*.10;


        ctx.globalAlpha=
            alpha;

        ctx.fillStyle=
            s.color;

        ctx.shadowColor=
            s.color;

        ctx.shadowBlur=5;


        ctx.font=
            `normal ${s.size}px Arial`;


        ctx.fillText(
            "☆",
            x,
            y
        );


        ctx.shadowBlur=0;
    }

    ctx.globalAlpha=1;
}


/* =========================
   پیدا کردن پست
========================= */

let activePost=null;


function findPost(x,y){

    for(
        let i=posts.length-1;
        i>=0;
        i--
    ){

        const post=
            posts[i];


        const px=
            post.x-
            camX+
            W/2;

        const py=
            post.y-
            camY+
            H/2;


        if(
            Math.hypot(
                x-px,
                y-py
            )<50
        ){

            return post;
        }
    }

    return null;
}


/* =========================
   لمس صفحه
========================= */

let downX=0;
let downY=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        downX=e.clientX;
        downY=e.clientY;

        dragging=true;

        startX=e.clientX;
        startY=e.clientY;

        startCamX=camX;
        startCamY=camY;


        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx=
            e.clientX-startX;

        const dy=
            e.clientY-startY;


        targetX=
            startCamX-
            dx*1.5;

        targetY=
            startCamY-
            dy*1.5;
    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        const moveDistance=
            Math.hypot(
                e.clientX-downX,
                e.clientY-downY
            );


        dragging=false;


        if(moveDistance<12){

            const post=
                findPost(
                    e.clientX,
                    e.clientY
                );


            if(post){

                openPost(post);
            }
        }


        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}
    }
);


/* =========================
   باز کردن پست
========================= */

function openPost(post){

    activePost=post;


    document.getElementById(
        "postTitle"
    ).textContent=
        post.title;


    document.getElementById(
        "postText"
    ).textContent=
        post.text;


    const like=
        document.getElementById(
            "likeButton"
        );


    like.classList.remove(
        "liked"
    );

    like.textContent="♡";


    document.getElementById(
        "postWindow"
    ).style.display=
        "block";
}


/* =========================
   بستن پست
========================= */

document.getElementById(
    "closePost"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "postWindow"
        ).style.display=
            "none";

        activePost=null;
    }
);


/* =========================
   لایک
========================= */

document.getElementById(
    "likeButton"
).addEventListener(
    "click",
    function(){

        if(!activePost)
            return;


        this.classList.add(
            "liked"
        );

        this.textContent="♥";


        createLikeStars();
    }
);


/* =========================
   شروع پروانه‌ها
========================= */

createButterflies();


/* =========================
   انیمیشن
========================= */

function animate(time){

    if(!dragging){

        targetX+=.10;
        targetY+=.04;
    }


    camX+=
        (targetX-camX)*.06;

    camY+=
        (targetY-camY)*.06;


    drawBackground();

    drawStars(time);

    drawButterflies(time);

    drawPosts();

    drawLikeStars();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
</html>
