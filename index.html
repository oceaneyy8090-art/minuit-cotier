<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030313;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#space{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#world{
  position:absolute;
  width:1px;
  height:1px;
  left:0;
  top:0;
  will-change:transform;
}

.item{
  position:absolute;
  left:0;
  top:0;
  user-select:none;
  white-space:nowrap;
  will-change:transform;
}

.star{
  font-size:18px;
  pointer-events:none;
}

.magic{
  font-size:25px;
  pointer-events:auto;
  padding:12px;
  cursor:pointer;
}

.planet{
  font-size:21px;
  pointer-events:none;
}

.comet{
  font-size:20px;
  pointer-events:none;
}

.heart{
  font-size:21px;
  pointer-events:none;
}


/* =====================
   POST
===================== */

#post{
  display:none;

  position:fixed;
  z-index:100;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(84vw,340px);
  max-height:78vh;

  overflow:auto;

  padding:16px;

  background:#09091d;
  color:white;

  border:1px solid rgba(255,255,255,.22);
  border-radius:18px;

  text-align:center;
}

#post h2{
  margin:2px 0 10px;
  font-size:17px;
}

#post p{
  margin:6px 0;
  font-size:13px;
  line-height:1.8;
  opacity:.8;
}

#post img,
#post video{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:12px;
}

#post audio{
  width:100%;
  margin-top:8px;
}

#close{
  position:absolute;
  left:8px;
  top:8px;

  width:32px;
  height:32px;

  border:0;
  border-radius:50%;

  background:#282347;
  color:#fff;

  font-size:20px;
}

#hint{
  position:fixed;
  z-index:10;

  top:14px;
  left:50%;

  transform:translateX(-50%);

  color:#fff;
  opacity:.35;

  font-size:11px;

  pointer-events:none;
}
</style>
</head>

<body>

<div id="space">
  <div id="world"></div>
</div>

<div id="hint">
  بکش و در هر جهتی حرکت کن ✦
</div>

<div id="post">

  <button id="close">×</button>

  <div id="postContent"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://oyowhuyzgjvpoeupoegh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dV39l6cN2-ibtAGNv71GWA_x8r0xsxT";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==================================================
   WORLD
================================================== */

const space =
document.getElementById("space");

const world =
document.getElementById("world");

let cameraX = 0;
let cameraY = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let startCameraX = 0;
let startCameraY = 0;

let moved = false;


/* ==================================================
   RENDER WORLD
================================================== */

function renderWorld(){

  world.style.transform =
    `translate3d(${-cameraX}px,${-cameraY}px,0)`;

}

renderWorld();


/* ==================================================
   OBJECTS
================================================== */

const objects = [];

const starColors = [
  "#ff4f9a",
  "#ff5577",
  "#ff6b6b",
  "#ff9f43",
  "#ffd166",
  "#4dd8ff",
  "#6ea8ff",
  "#9b7cff",
  "#c77dff",
  "#ffffff"
];


const types = [
  "star",
  "star",
  "star",
  "star",
  "star",
  "star",

  "magic",
  "magic",
  "magic",

  "planet",
  "comet",
  "heart"
];


/* ==================================================
   CREATE OBJECTS
================================================== */

for(let i=0;i<55;i++){

  const el =
    document.createElement("div");

  const type =
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  el.className =
    "item " + type;


  if(type === "star"){

    el.textContent = "☆";

    el.style.color =
      starColors[
        Math.floor(
          Math.random()*starColors.length
        )
      ];

  }

  if(type === "magic"){

    el.textContent = "💫";

  }

  if(type === "planet"){

    el.textContent = "🪐";

  }

  if(type === "comet"){

    el.textContent = "☄️";

  }

  if(type === "heart"){

    el.textContent = "💘";

  }


  const x =
    Math.random()*9000 - 4500;

  const y =
    Math.random()*9000 - 4500;


  const size =
    .75 + Math.random()*.6;


  world.appendChild(el);


  objects.push({

    el,

    type,

    x,

    y,

    size,

    phase:
      Math.random()*Math.PI*2,

    speed:
      .15 + Math.random()*.35

  });

}


/* ==================================================
   ANIMATION
================================================== */

let time = 0;

function animate(){

  time += .016;


  for(const obj of objects){

    /*
       هر شیء کمی شناور می‌شود.
       💫 هم دقیقاً مثل بقیه حرکت می‌کند.
    */

    const moveX =
      Math.sin(
        time*obj.speed +
        obj.phase
      ) * 12;

    const moveY =
      Math.cos(
        time*obj.speed +
        obj.phase
      ) * 12;


    /*
       کمی حرکت چرخشی برای تنوع
    */

    const rotate =
      Math.sin(
        time*obj.speed +
        obj.phase
      ) * 8;


    obj.el.style.transform =
      `translate3d(
        ${obj.x + moveX}px,
        ${obj.y + moveY}px,
        0
      ) rotate(${rotate}deg)
      scale(${obj.size})`;

  }


  requestAnimationFrame(animate);

}

animate();


/* ==================================================
   DRAG
================================================== */

space.addEventListener(
  "pointerdown",
  e => {

    if(
      e.target.classList.contains("magic")
    ){

      return;

    }


    dragging = true;

    moved = false;

    startX =
      e.clientX;

    startY =
      e.clientY;

    startCameraX =
      cameraX;

    startCameraY =
      cameraY;


    space.setPointerCapture(
      e.pointerId
    );

  }
);


space.addEventListener(
  "pointermove",
  e => {

    if(!dragging)
      return;


    const dx =
      e.clientX - startX;

    const dy =
      e.clientY - startY;


    if(
      Math.abs(dx)>5 ||
      Math.abs(dy)>5
    ){

      moved = true;

    }


    cameraX =
      startCameraX - dx;

    cameraY =
      startCameraY - dy;


    renderWorld();

  }
);


space.addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);


space.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

  }
);


/* ==================================================
   POSTS
================================================== */

let posts = [];

let postIndex = 0;


async function loadPosts(){

  const result =
    await db
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.log(
      "Posts error:",
      result.error
    );

    return;

  }


  posts =
    result.data || [];

}


loadPosts();


/* ==================================================
   MAGIC CLICK
================================================== */

document.addEventListener(
  "click",
  e => {

    if(
      !e.target.classList.contains("magic")
    ){

      return;

    }


    showPost();

  }
);


/* ==================================================
   SHOW POST
================================================== */

function showPost(){

  const box =
    document.getElementById(
      "post"
    );

  const content =
    document.getElementById(
      "postContent"
    );


  content.innerHTML =
    "";


  if(!posts.length){

    content.innerHTML =
      "<p>هنوز پستی وجود نداره 💔</p>";

    box.style.display =
      "block";

    return;

  }


  const data =
    posts[
      postIndex %
      posts.length
    ];


  postIndex++;


  if(data.title){

    const title =
      document.createElement("h2");

    title.textContent =
      data.title;

    content.appendChild(
      title
    );

  }


  if(data.content){

    const text =
      document.createElement("p");

    text.textContent =
      data.content;

    content.appendChild(
      text
    );

  }


  if(data.image_url){

    const image =
      document.createElement("img");

    image.src =
      data.image_url;

    image.alt =
      data.title || "post";

    content.appendChild(
      image
    );

  }


  if(data.video_url){

    const video =
      document.createElement("video");

    video.src =
      data.video_url;

    video.controls =
      true;

    video.preload =
      "metadata";

    content.appendChild(
      video
    );

  }


  if(data.music_url){

    const audio =
      document.createElement("audio");

    audio.src =
      data.music_url;

    audio.controls =
      true;

    audio.preload =
      "none";

    audio.volume =
      0.5;

    content.appendChild(
      audio
    );

  }


  box.style.display =
    "block";

}


/* ==================================================
   CLOSE POST
================================================== */

document
.getElementById("close")
.addEventListener(
  "click",
  () => {

    document
      .getElementById("post")
      .style.display =
      "none";

  }
);

</script>

</body>
</html>
