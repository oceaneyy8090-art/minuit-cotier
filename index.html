<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>𝑴𝒊𝒏𝒖𝒊𝒕 𝒄ô𝒕𝒊𝒆𝒓</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
background:#020817;
}

canvas{
display:block;
width:100%;
height:100%;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<script>

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}

resize();
onresize=resize;


let camX=0;
let camY=0;


const colors=[
"#ff5ca8",
"#ff8ad8",
"#66d9ff",
"#8d7cff",
"#c89cff"
];


let objects=[];


function create(){

let r=Math.random();

let o={
 x:(Math.random()-0.5)*7000,
 y:(Math.random()-0.5)*7000,
 phase:Math.random()*20,
 speed:.2+Math.random()*.4
};


if(r<0.7){

o.type="star";
o.text="☆";
o.size=10+Math.random()*8;
o.color=
colors[
Math.floor(Math.random()*colors.length)
];

}

else if(r<0.82){

o.type="magic";
o.text="💫";
o.size=18;

}

else if(r<0.92){

o.type="planet";
o.text="🪐";
o.size=16;

}

else{

o.type="comet";

}


objects.push(o);

}


for(let i=0;i<120;i++){
create();
}




function draw(t){

let time=t/1000;


/* پس زمینه */

let bg=ctx.createRadialGradient(
W/2,H/2,
20,
W/2,H/2,
W
);

bg.addColorStop(0,"#30206b");
bg.addColorStop(.4,"#14204f");
bg.addColorStop(1,"#020817");

ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);



objects.forEach(o=>{


let floatX=
Math.sin(time*o.speed+o.phase)*20;

let floatY=
Math.cos(time*o.speed+o.phase)*20;


let x=o.x+floatX-camX+W/2;
let y=o.y+floatY-camY+H/2;


if(x<-80||x>W+80||y<-80||y>H+80)
return;



/* دنباله دار */

if(o.type==="comet"){

ctx.strokeStyle=
"rgba(100,220,255,.7)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
x-35,
y+18
);

ctx.lineTo(
x,
y
);

ctx.stroke();


ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
x,
y,
4,
0,
Math.PI*2
);

ctx.fill();

return;

}



ctx.font=o.size+"px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillStyle=
o.color||"white";

ctx.fillText(
o.text,
x,
y
);


});


requestAnimationFrame(draw);

}

requestAnimationFrame(draw);



/* حرکت با انگشت */

let sx,sy,startX,startY;


canvas.onpointerdown=e=>{

sx=e.clientX;
sy=e.clientY;

startX=camX;
startY=camY;

};


canvas.onpointermove=e=>{

if(sx===undefined)return;

camX=
startX-(e.clientX-sx);

camY=
startY-(e.clientY-sy);

};


canvas.onpointerup=()=>{

sx=undefined;

};


</script>

</body>
</html>
